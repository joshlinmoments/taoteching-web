    title: `Favor and Humiliation`,
    classical: `寵辱章第十三 
`,
    english: `The Sage treats favor and disgrace with caution, as if being startled, like facing the disaster of losing the body.<br>Why be cautious of favor and disgrace?<br>To be favored is to be held high in the heart, raising one's mind to the top, yet bringing fear of losing the glory and sliding downward.<br>To be disgraced is to be trampled on the ground, bringing self-pity and sorrow; feeling low, one strives upward for more power.<br>Therefore, whether obtaining or losing them, both bring fear.<br>In these ups and downs, one loses the true self, just like losing this very body.<br>Why say we fear losing this body?<br>The reason I suffer great anxiety is that I have this physical body and a selfish mind.<br>If I can transcend the attachments of the self, what anxiety could I possibly have?<br>Therefore, only he who values the world as he values his own life can be entrusted with the world.<br>Only he who loves the world as he loves his own life is worthy of being the guardian of the world.`,
    chinese: `寵辱若驚，貴大患若身。<br>何謂寵辱若驚？<br>寵為下，辱為上。 <br>得之若驚，失之若驚，是謂寵辱若驚。 <br><br>何謂貴大患若身？<br>吾所以有大患者，為吾有身，<br>及吾無身，吾有何患？<br>故貴以身為天下者，可寄天下；<br>愛以身為天下者，可以托天下。`,
    commentary: `聖人對待他人的寵愛與羞辱，總是戒慎得像是被驚嚇一樣，就像面臨失去身體的禍患。為何戒慎寵愛與羞辱呢？受寵愛是讓人捧在心頭上，會使自己的心高高在上，然而害怕失去光環，害怕會就此走下坡；被人侮辱像是讓人踐踏在地上，使自己自怨自艾，苦惱憂愁，感覺很低下，就會想要往上爬，得到更多權力。所以無論寵愛或羞辱，得到讓人驚恐、失去也讓人驚恐，驚恐在起伏當中迷失了自我，就像失去這個身體一樣。為什麼說要把害怕失去這個身體呢？我之所以會有大憂患，是因為我有這具肉身與私心；如果我能超脫自我的執著，我還有什麼好憂慮的呢？所以，一個能像珍惜自己生命一樣去珍惜天下的人，才可把天下委託給他；一個能像愛護自己一樣去愛護天下的人，才值得把天下託付給他。`,

    num: 14,
    title: ``,
    classical: `道紀章`,
    english: `Look at it and it is not seen; it is called the Formless.<br>Listen to it and it is not heard; it is called the Soundless.<br>Touch it and it is not felt; it is called the Tangilless.<br>These three traits are the essence of the Tao, beyond all scrutiny, for they are blended into One.<br>Its upper part is not bright; its lower part is not dark.<br>Continuous and endless, it cannot be named, returning always to nothingness.<br>This is called the shape without shape, the image without image; this is the elusive and vague.<br>Face it and you see no front; follow it and you see no back.<br>Hold fast to the ancient Tao to manage the things of today.<br>To know the primal origin of the universe is to hold the thread of the Tao.`,
    chinese: `視之不見，名曰夷；<br>聽之不聞，名曰希；<br>搏之不得，名曰微。<br>此三者不可致詰，故混而為一。<br><br>其上不皦，其下不昧。<br>繩繩兮不可名，復歸於無物。<br>是謂無狀之狀，無象之象，是謂惚恍。<br>迎之不見其首，隨之不見其後。<br>執古之道，以禦今之有。能知古始，是謂道紀。`,
    commentary: `看它看不見，稱它為「無相」；聽它聽不到，稱它為「無聲」；摸它摸不著，稱它為「無形」。這三種特性就是道的本體，是無法追根究底的，因為它們原本就是渾然一體的。它的上方並不顯得光亮，下方也不會有陰影。它綿延不絕，無法用言語形容，想要探其究竟，又發現它終究只是一團虛無。這就是所謂沒有形狀的形狀、沒有物象的意象，也就是所謂的「恍惚」。迎面去追隨它，看不見它的開端；跟隨在它背後，也看不見它的結尾。只要掌握自古以來就存在的「道」，就能駕馭現實世界的萬事萬物。能夠瞭解宇宙原始的開端，這就叫做掌握了「道」的脈絡法則。`,

    num: 15,
    title: ``,
    classical: `不盈章`,
    english: `The ancient practitioners of the Tao were subtle, mysterious, and profound;<br>Their depth was beyond human measure.<br>Because they cannot be fully described, one can only look at their appearance:<br>Cautious, like one crossing a frozen stream in winter;<br>Watchful, like one who fears neighbors on all sides;<br>Respectful, like a dignified guest;<br>Yielding, like ice that is about to melt;<br>Simple, like an uncarved block;<br>Open, like a broad valley;<br>All-embracing, like turbid water.<br><br>Who can remain in the turbid world, yet stay still until it gradually becomes clear?<br>Who can remain in stillness for long, yet stir until life gradually comes forth?<br>Those who keep this Tao do not desire to be full.<br>Because they are never full, they can preserve the ancient mind, never drifting with human nature to attain the True Tao.`,
    chinese: `古之善為士者，微妙玄通，深不可識。<br>夫唯不可識，故強為之容。<br>豫兮若冬涉川；猶兮若畏四鄰；<br>儼兮其若客；渙兮其若冰之將釋；<br>敦兮其若樸；曠兮其若谷；渾兮其若濁。<br><br>孰能濁以止，靜之徐清。<br>孰能安以久，動之徐生。<br>保此道者，不欲盈。<br>夫唯不盈，故能弊不新成。`,
    commentary: `古代擅長悟道修身的人，其智慧微妙深邃、通達圓明，深奧到讓人無法輕易揣測。正因為無法完全描述，只能勉強形容他的樣子：他處事謹慎，如同古時「豫獸」等到冬天結冰才過河一樣；他慎獨的功夫，如同古時「猶獸」下山不敢驚擾村里百姓一樣；他莊重肅穆，如同在別人家做客一樣受人景仰；他灑脫自然，面對外緣干擾，心卻如同春天的冰消融散開；他敦厚的本性，如同未經雕琢的素材；他胸懷廣闊，如同空曠的山谷；他渾厚包容，如同混濁在污濁當中的水一樣。誰能在混濁中，不失本心，等待水慢慢澄澈、清濁分明？誰能在安定中持久，使生機慢慢萌發？能保有這個道的人，不會追求自滿。正因為不自滿，便能夠保守舊有（弊）的道心，而不隨人心（新）流轉，而成就真道。`,

    num: 16,
    title: ``,
    classical: `復命章`,
    english: `Reach the extreme of emptiness, and hold fast to constant stillness.<br>While the myriad things arise together, I observe their return and cycles.<br>Though the myriad things flourish in multitude, each eventually returns to its root.<br>Returning to the root is called stillness; it means returning to the source of life.<br>Returning to the source of life is the eternal law, and to know this eternal law is to be enlightened.<br>Not knowing the eternal law leads to arbitrary actions and disaster.<br><br>To know the eternal law is to be all-embracing;<br>Being all-embracing, one becomes impartial;<br>Being impartial, one becomes complete;<br>Being complete, one conforms to the Heavenly Law;<br>Conforming to the Heavenly Law, one unites with the Tao;<br>Uniting with the Tao, one endures forever,<br>And though the body perishes, one will never fall into danger.`,
    chinese: `致虛極，守靜篤。<br>萬物並作，吾以觀其復。夫物芸芸，各復歸其根。<br>歸根曰靜，靜曰覆命。覆命曰常，知常曰明。<br>不知常，妄作凶。<br>知常容，容乃公，公乃全，全乃天，<br>天乃道，道乃久，沒身不殆。`,
    commentary: `若心靈能達到極致的虛無，能保守恆久的寧靜，在萬物蓬勃生長的同時，就能真正地觀察到它們往復循環的規律。 萬物雖然紛雜繁多，最終都要各自回歸到它們的根源。回歸根源稱為「靜」，這就叫做回歸生命的本源。回歸生命 本源才是永恆不變的常理，知道常理的人，才稱得上「明理」。如果不明白常理而胡作非為，就會招致災禍。明白 了永恆的常理就能包容萬物，能包容就能公正無私，公正就能周全，周全就符合自然天理，符合天理就契合了道， 契合了道就能長久，即使肉身消亡也不會陷入危險。`,

    num: 17,

    classical: `知有章`,
    english: `As for the best rulers, the people only know they exist. The next best, they love and praise. The next, they fear. The next, they despise. If you do not trust enough, you will not be trusted. But of the best, when their work is done and their task is accomplished, The people all say, "It happened to us Naturally (Ziran)." `,
    chinese: `太上，不知有之；<br>其次親之，譽之；<br>其次，畏之；其次，侮之。<br>故信不足，焉有不信。猶兮其貴言。<br>功成事遂，百姓皆謂：我自然。`,
    commentary: `上古的有德之君，無為而治，百姓暗受他的恩惠，卻不知道他的存在；再其次的賢君，尚能以德行親近百姓，而獲 得百姓讚揚；再次一等的國君，就以明確的賞罰去治理，百姓都畏懼他；最差一等的國君，僅以權術愚弄人民，終 遭百姓輕蔑侮辱。如果統治者不能守信，自然就得不到百姓的信任，所以上位者必須時時謹慎言行，才稱得上是人 民的君主。當大功告成後，百姓甚至不曉得是國君的功勞，只覺得覺得：「這不是很自然的事嗎？」`,

    num: 18,
    title: ``,
    classical: `四有章`,
    english: `When the Great Tao was lost, benevolence and righteousness appeared. When cleverness and knowledge arose, great hypocrisy followed. When the six family relationships were no longer in harmony, "filial piety" and "parental love" were preached. When the state fell into disorder, "loyal ministers" appeared.`,
    chinese: `大道廢，有仁義；<br>智慧出，有大偽；<br>六親不和，有孝慈；<br>國家昏亂，有忠臣。<br>`,
    commentary: `當自然無為的「大道」被廢棄、不再作為社會準則時，才需要刻意提倡「仁義」來維持秩序；當人們開始崇尚聰明 與權謀智慧時，虛偽造假的風氣也就隨之產生；當家族成員之間失去自然的和睦，才顯現出所謂的「孝順」與「慈 愛」；當國家陷入昏庸混亂的局面，才表現出所謂的「忠臣」。這說明了當這些刻意的道德標準出現時，往往反映 出社會最本質的純樸與和諧已經失落。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 19,
    title: ``,
    classical: `樸素章`,
    english: `Discard "sagehood" and "wisdom," and the people will benefit a hundredfold. Discard "benevolence" and "righteousness," and the people will return to filial piety and love. Discard "ingenuity" and "profit," and there will be no more thieves. These three are outward forms and are not sufficient. Therefore, let people have something to hold on to: See the Simple Self, embrace the Uncarved Block, reduce selfishness, and have few desires.`,
    chinese: `絕聖棄智，民利百倍；<br>絕仁棄義，民復孝慈；<br>絕巧棄利，盜賊無有。<br>此三者，以為文不足，故令有所屬。<br>見素抱樸，少思寡欲。`,
    commentary: `拋棄自作聰明的聖明與才智，百姓反而能獲得百倍的利益；拋棄刻意標榜的仁義道德，百姓反而能回歸自然天性的 孝順與慈愛；拋棄投機取巧與對功利的追求，盜賊也就不會再出現。這三者如果只是作為政令條文、書本知識是不 夠的，所以要讓百姓的心有所歸屬：外表呈現質樸，內心保持純真，減少私心，淡化欲望。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 20,
    title: ``,
    classical: `⻝⺟章`,
    english: `Exterminate (worldly) learning and there will be no more sorrow. How much difference is there between a "yes" and a "no"? How much difference is there between "good" and "evil"? What the world fears, one cannot but fear; but how vast is the wilderness of delusion! The multitude are happy, as though enjoying a great feast or climbing a tower in spring. I alone am still, like a child who has not yet smiled; I am listless, like one who has no home to return to. The multitude have enough and to spare; I alone seem to have lost everything. Mine is the mind of an idiot—so dull and muddled! The world is bright; I alone am dark. The world is sharp; I alone am blunt. I am drifting, like the ocean; blown about, like the wind. Everyone has a purpose; I alone am stubborn and uncouth. I alone am different from others, for I value the Mother (the Tao) that nurses me.`,
    chinese: `絕學無憂。<br>唯之與阿，相去幾何？善之與惡，相去若何？<br>人之所畏，不可不畏。荒兮其未央哉！<br>眾人熙熙，如享太牢，如春登臺。<br>我獨泊兮其未兆，如嬰兒之未孩；<br>儽儽兮，若無所歸。<br><br>眾人皆有餘，而我獨若遺。<br>我愚人之心也哉！沌沌兮。<br>俗人昭昭，我獨若昏；俗人察察，我獨悶悶。<br>澹兮其若海，飂兮若無所止。<br>眾人皆有以，而我獨頑且鄙。我獨異於人，而貴食母。`,
    commentary: `學習不要受到文字障的障礙，才能沒有憂慮。「唯」與「阿」，雖皆是應答詞彙，但兩者在態度表現上相去甚遠。 「善」與「惡」，本是一線之間，但兩者相差沒有多少。人們所敬畏的事情，不可以不敬畏。世人總是沉迷在快樂 享受之中，就像享受豐盛的宴席（太牢）以及春天登高望遠一樣。只有我的心淡泊無欲，沒有什麼徵兆顯露，就像 剛出生的赤子，還不會笑的時候。總是意興闌珊的樣子，好像沒有歸宿，不去刻意選擇什麼，隨遇而安。  眾人都是追名逐利，志得意滿。唯獨我好像遺失了所有。我真有一顆愚人的心啊，混混沌沌的。世人都自以為聰明 清醒，唯獨我顯得昏庸迷糊；世人都斤斤計較、觀察細微，唯獨我像是沒有知識的人，不知道怎麼去計較。我心境 平淡得像大海，飄泊得像無處停留的風。眾人都有所作為與本事，唯獨我是那麼的笨拙粗鄙。我之所以與眾不同， 是因為我就像個嬰兒一樣，時時吸吮著上天老母供給的母乳。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 21,
    title: ``,
    classical: `從道章`,
    english: `The all-embracing quality of the Great Virtue (De) follows alone from the Tao. The Tao is eluding and vague. Vague and eluding, yet within it is the Form. Eluding and vague, yet within it is the Substance. Deep and obscure, yet within it is the Essence. The Essence is quite real; within it is the Evidence (Truth). From ancient times until now, its Name has never passed away. It is through this that we observe the Origin of all things. How do I know the Origin of all things? By this Tao.`,
    chinese: `孔德之容，惟道是從。道之為物，惟恍惟惚。<br>惚兮恍兮，其中有象；恍兮惚兮，其中有物。<br>杳兮冥兮，其中有精；其精甚真，其中有信。<br>自今及古，其名不去，以閱眾甫。<br>吾何以知眾甫之然哉？以此。`,
    commentary: `如何窺探「德」的真面目，完全是順從「道」而來的。道作為一個存在，是那樣的模糊不清、若有若無。在這種恍 恍惚惚的狀態中，卻隱約有形象存在；在這種若隱若現的狀態中，卻包含一切萬物。它是那樣的深遠幽暗，其中卻 含藏著最根本的精微能量；這種能量非常真實，而且充滿了恆久可信的規律。從古至今，道的名號永不消失，它讓 我們得以看見萬物的起源。我憑什麼能知道萬物起源的樣子呢？就是憑藉這個「道」。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 22,
    title: ``,
    classical: `抱一章`,
    english: `"Yield and remain whole; bend and be straight; Empty and be full; wear out and be new; Have little and gain; have much and be confused."Therefore, the Sage embraces the One (the Tao) and becomes a model for the world. He does not show himself, therefore he is enlightened; He does not justify himself, therefore he is distinguished; He does not boast of himself, therefore he is given credit; He does not pride himself, therefore he is a leader. It is because he does not strive that no one in the world can strive against him. Truly, the ancient saying "Yield and remain whole" is no empty phrase. It is the way to Complete Return.`,
    chinese: `曲則全，枉則直，窪則盈，敝則新，少則多，多則惑。<br>是以聖人抱一為天下式。<br>不自見故明；不自是故彰；不自伐故有功；不自矜故長。<br>夫唯不爭，故天下莫能與之爭。<br>古之所謂「曲則全」者，豈虛言哉！誠全而歸之。`,
    commentary: `能受委曲的人反而能成就身心完整；能受冤枉的人反而成就內心坦蕩率直；能謙卑滴下才能盈滿功德，能汰舊才能 換新，追求得少反而能收穫多，追求過多反而會陷入迷惑。因此，聖人始終抱守那一貫的元神中道，而成為天下人 的楷模。不固執己見才能看得清明；不自以為是才能真正彰顯其德行；不誇耀自己的成就，功勞才能被認可；不驕 傲自滿，所以能長久立於人前，受人尊崇。正因為他不與人爭奪，所以天下沒有人能與其競爭。古人所說的「委屈 就是保全」，難道是虛假的空話嗎？只要你依照實行那麼，一切的圓滿那就什麼就全部都歸於你了。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 23,
    title: ``,
    classical: `同道章`,
    english: `To speak little is to follow Nature (Ziran). A hurricane does not last the whole morning; A rainstorm does not last the whole day. Who creates these? Heaven and Earth. If Heaven and Earth cannot make things last forever, how much less can man? Therefore, he who follows the Tao is one with the Tao; He who follows Virtue (De) is one with Virtue; He who follows Loss is one with Loss. He who is one with the Tao, the Tao gladly welcomes. He who is one with Virtue, Virtue gladly welcomes. He who is one with Loss, Loss gladly welcomes. If you do not trust enough, you will not be trusted.<br><br>He who stands on tiptoe does not stand firm; He who takes long strides does not walk well. He who shows himself is not enlightened; He who justifies himself is not distinguished; He who boasts of himself is not given credit; He who prides himself is not a leader. In the eyes of the Tao, these are like "surplus food and parasitic growths." All creatures loathe them; therefore, he who has the Tao does not dwell in them.`,
    chinese: `希言自然。<br>飄風不終朝，驟雨不終日。<br>孰為此者？天地。<br>天地尚不能久，而況於人乎？<br><br>故從事於道者，<br>道者同於道；德者同於德；失者同於失。<br>同於道者，道亦樂得之；<br>同於德者，德亦樂得之；<br>同於失者，失亦樂得之。信不足焉，有不信焉。`,
    commentary: `謹言慎行才是符合自然之道。狂風颳不了一個早晨，暴雨下不到一整天。是誰讓風雨發生的？是天地。連天地都不能長久的颳風下雨了，何況是人呢？所以，順從於大道的人合於道；追求美德的人合於美德；放任「失道」的人，那就同流合污了。與道同在的人，道也樂於接納他；與德同在的人，德也樂於接納他；與失同在的人，那麼失心逐欲也樂於接納他。（因為道看不到，只能透過感應覺悟，所以說信，要相信才行）若你信心不足的話，那麼道也無法使你相信。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 24,
    title: ``,
    classical: `不處章`,
    english: `There was something formlessly fashioned that existed before Heaven and Earth. Silent and void, it stands alone and unchanging; It pervades everywhere and never fails. It may be called the Mother of the World. I do not know its name; I call it "The Tao." If forced to describe it, I would call it "Great." Greatness means passing on; passing on means going far; going far means Returning. Therefore: The Tao is great; Heaven is great; Earth is great; and the King is great. In the universe, there are four powers, and the King is one of them. Man follows Earth; Earth follows Heaven; Heaven follows the Tao; The Tao follows its own Nature (Ziran).`,
    chinese: `跂者不立；跨者不行；<br>自見者不明；自是者不彰；<br>自伐者無功；自矜者不長。<br>其於道也，曰：「餘食贅行」。<br>物或惡之，故有道者不處。`,
    commentary: `踮起腳尖的人站不穩，大跨步前行的人走不遠；只執著於自己見解的人看不見自己真實的樣子，自以為是的人無法 得到他人的認同；自我誇耀的人反而讓人懷疑他的功勞，驕矜自滿的人則不再成長。從「道」的觀點來看，這就像 是吃飽了還要再吃的食物、多餘沒有必要的行為。萬物大多厭惡這些事物，所以有道的人不會讓自己處在這樣狀態。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 25,
    title: ``,
    classical: `混成章`,
    english: `Heaviness is the root of lightness; Stillness is the master of restlessness. Therefore, the Sage travels all day without leaving his baggage-wagon (his Inner Center). Though there are sights of glory, he remains quiet and indifferent. How is it that the lord of ten thousand chariots should behave lightly in the world? To be light is to lose one's Root; To be restless is to lose one's Mastery.`,
    chinese: `有物混成，先天地生。<br>寂兮寥兮，獨立而不改，周行而不殆，可以為天下母。<br>吾不知其名，字之曰道，強為之名曰大。<br>大曰逝，逝曰遠，遠曰返。<br>故道大，天大，地大，人亦大。域中有四大，而人居其一焉。<br>人法地，地法天，天法道，道法自然。<br>`,
    commentary: `有一種渾然一體的力量，在天地之前就已經存在。它無聲無形，獨立且永恆不變，循環運行永不停止，是天下萬物 的母親。我不知道它的名字，稱它為「道」，再勉強稱它「大」。道廣大無邊，就是「逝」；無邊無際並包含萬物， 就是「遠」；而這廣大的道，就在自己內在本性中，所以是「返」。所以說能生天地萬物的道是最大的；能覆蓋一 切的天也是大的；能承載萬物的地也是大的、而能盡天地之德的聖人也是大的。宇宙中有這四種偉大的存在，而人 是其中之一。人效法大地，大地效法天，天效法自然之「道」，而「道」的本性就是自然而然、本就如此。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 26,
    title: ``,
    classical: `輜重章`,
    english: `A good traveler leaves no tracks; A good speaker makes no slips; A good counter uses no tallies. A good closer uses no bolts, yet no one can open what he has shut; A good binder uses no knots, yet no one can untie what he has bound. Therefore, the Sage is always a good helper of men, and so no one is rejected; He is always a good helper of things, and so nothing is cast away. This is called Double Illumination. Therefore, the good man is the teacher of the bad; The bad man is the material for the good. If one does not value the teacher or love the material, Though he be clever, he is greatly deluded. This is the Essential Secret.<br><br>He who knows the Masculine, yet keeps to the Feminine, becomes a Valley for the world. Being a Valley for the world, Eternal Virtue (De) never leaves him, and he becomes again like a Newborn Babe. He who knows the White, yet keeps to the Black, becomes a Model for the world. Being a Model for the world, Eternal Virtue never fails him, and he returns to the Infinite. He who knows Glory, yet keeps to Humility, becomes a Valley for the world. Being a Valley for the world, Eternal Virtue is sufficient, and he returns to the Uncarved Block (the Original State). When the Uncarved Block is divided, it becomes vessels. The Sage uses them to become the leader of ministers. Truly, a Great Carver does not cut (does not harm the original nature).`,
    chinese: `重為輕根，靜為躁君。<br>是以君子終日行，不離輜重。<br>雖有榮觀，燕處超然。<br>奈何萬乘之主，而以身輕天下。<br>輕則失根，躁則失君。`,
    commentary: `沉穩是輕浮的根本，寧靜是躁動的主宰。因此有德的君子即便整天在外奔波，也不會離開載運軍需品的大車（即是 本性）。雖然有尊貴華麗的外表，他卻能超然物外，安然處之。無奈擁有萬輛兵車的大國之君，卻以輕浮的態度來 對待天下。輕浮草率就會失去根本，性格躁動就會失去主宰的地位。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 27,
    title: ``,
    classical: `襲明章`,
    english: `Those who try to take the world and shape it to their will never succeed. The world is a Spiritual Vessel; it cannot be tampered with. He who tampers with it spoils it; he who grasps it loses it. For truly: "Some lead, some follow; some breathe hot, some breathe cold; Some are strong, some are weak; some rise up, some fall down." Therefore, the Sage discards the excessive, the extravagant, and the extreme.`,
    chinese: `善行無轍跡，善言無瑕謫，善數不用籌策；<br>善閉無關鍵，而不可開，善結無繩約，而不可解。<br><br>是以聖人常善救人，故無棄人；常善救物，故無棄物。是謂襲明。<br>故善人者，不善人之師；不善人者，善人之資。<br>不貴其師，不愛其資，雖智大迷，是謂要妙。`,
    commentary: `以至善行於天下的人，心中不會留下行善的痕跡；他所說的話都是本性流露，所以圓滿沒有瑕疵缺點；他所做的每件事都合於道，所以不必費盡心機的籌劃；他內心無虧，所以心門沒有上鎖，也沒法打開；他向上天立下普渡眾生的善愿，永遠不會忘記，所以也不必結繩立約，更沒有人能夠解除這個約定。  因此，聖人始終以至善之心去救渡他人，所以從未嫌棄任何人；發自內心保護萬事萬物，所以沒有被傷害或任意拋棄的動植物或事物，這就是他承襲古聖賢的明德。所以，善良的人可以作為不善之人的老師，而不善之人則是善良者引以為戒或教化的資源。但至善之人不執著於老師的地位，及擁有的資源。擁有大智慧卻看起來迷迷糊糊的，才是真正領悟到修道的精妙之處。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 28,
    title: ``,
    classical: `常德章`,
    english: `He who helps a ruler through the Tao does not use weapons to conquer the world; For such things are apt to recoil. Where armies dwell, thorns and brambles grow; A great war is always followed by years of famine. A good leader achieves his aim and stops; he does not dare to rely on force. Achieve the aim but do not boast; Achieve the aim but do not pride yourself; Achieve the aim but do not be arrogant; Achieve the aim because it is necessary; Achieve the aim but do not use violence. For things that grow to their full strength soon begin to decay. This is called "Not following the Tao." What does not follow the Tao soon comes to an end.`,
    chinese: `知其雄，守其雌，為天下谿。<br>為天下谿，常德不離，復歸於嬰兒。<br>知其白，守其黑，為天下式。<br>為天下式，常德不忒，復歸於無極。<br>知其榮，守其辱，為天下谷。<br>為天下谷，常德乃足，復歸於樸。<br>樸散則為器，聖人用之，則為官長，故大制不割。`,
    commentary: `雖知雄性的力量剛強，卻甘願守住雌性的柔弱，就像天下匯集溪水的溝壑。成為包容天下的溝壑，永恆的德行就不 會偏離，能回歸到嬰兒般純真的狀態。雖知明亮面的美好，卻甘願守住暗淡沉默，就能作為天下的楷模。能作為天 下楷模，永恆的德行就不會出差錯，能回歸到無極。雖知榮耀可貴，卻甘願守住卑下的屈辱，就像包容萬物的深谷。 能作為天下的深谷，永恆的德行便豐沛充足，能回歸到質樸的本性，如木頭保有原始的狀態，就能應用為各種器物。 而聖人保有質樸來治世，就能成為萬官的首長。因此大有作為的聖人，是保有本性完整樸素，而不願意切割雕琢。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 29,
    title: ``,
    classical: `自然章`,
    english: `Fine weapons are instruments of evil, hated by all creatures. Therefore, those who possess the Tao have nothing to do with them. The civilized ruler honours the left in times of peace; at war, he honours the right. Weapons are instruments of evil, not the tools of a Sage. When he uses them, it is only because he cannot help it, and his core remains in peace and quietude. To him, victory is no cause for rejoicing. To rejoice in victory is to rejoice in the slaughter of men; and he who rejoices in slaughter will never fulfill the Heavenly Mission over the world.`,
    chinese: `將欲取天下而為之，吾見其不得已。<br>天下神器，不可為也，為者敗之，執者失之。<br>故物或行或隨；或呴或吹；或強或羸；或載或隳。<br>是以聖人去甚，去奢，去泰。`,
    commentary: `想要透過人為了私欲想奪取天下，在我看來是不可能的。天下是神聖的器物，不能由著主觀意志去強行控制的，想 要以武力控制它的人會失敗，想要以私欲佔有它的人會失望。因為世間萬物本來就有他的原理：想走前面卻仍有人 走你前面；想走後面卻還是有人跟隨；呼一口暖氣就有風將之吹散；想要變強確有人更強；想要扛重物，沒多久還 是得放下來。因此，聖人明白這個道理，就不會去做過分多餘的事、奢侈浪費、驕傲自大的心態。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 30,
    title: ``,
    classical: `不道章`,
    english: `The Tao is forever nameless. Though the Uncarved Block (the Original State) be small, no one in the world can master it. If rulers would but embrace it, the ten thousand creatures would flock to do them homage. Heaven and Earth would unite to send down gentle dew; and without laws, the people would dwell in natural harmony. Once the Block is carved, there are names (distinctions). As soon as there are names, one must know when to stop. To know when to stop is to remain free from danger. The Tao is to the world as the Great Ocean is to the rivers and streams.<br><br>He who knows others is wise; he who knows the Self (the Original Nature) is enlightened. He who conquers others has physical strength; he who conquers himself is truly strong. He who is content is rich; he who acts with spiritual vigour has Will. He who does not lose his True Center lasts long; he who dies but his True Self is not forgotten (remains in the Spirit) possesses real longevity.`,
    chinese: `以道佐人主者，不以兵強天下。其事好還。<br>師之所處，荊棘生焉。大兵之後，必有凶年。<br>故善者果而已，不以敢取強。<br>果而勿矜，果而勿伐，果而勿驕，果而不得已，是果而勿強。<br>物壯則老，是謂不道，不道早已。`,
    commentary: `用「道」輔佐君主的人，不會依靠武力橫行天下。因為動武這件事，往往會得到對等的報復。兩軍交戰之地，田地 荒廢，荊棘叢生；大規模戰爭之後，必定會接著出現災荒之年。所以，善於用兵的人只要達到目的就適可而止。不 敢憑仗軍力來逞強。任務達成了而不自滿、不張揚，也不驕傲，這就是任務達成卻不逞強。萬物壯大到了極點就會 趨向衰老，仗恃欺人、逞強好勝是不符合「道」的；不符合「道」的，很快就會衰亡。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 31,
    title: ``,
    classical: `貴左章`,
    english: `The Great Tao flows everywhere, like a river that can go to the left or the right. The ten thousand creatures rely upon it for life, and it denies none. When its work is done, it claims no credit. It nourishes all things but does not act as their master. Because it is always without desire, it may be called "Small." Because all things return to it, yet it remains without mastery, it may be called "Great." Therefore, the Sage never displays his own greatness, and thus his true Greatness is accomplished.`,
    chinese: `夫佳兵者，不祥之器，<br>物或惡之，故有道者不處。<br>君子居則貴左，用兵則貴右。<br>兵者不祥之器，非君子之器，不得已而用之，恬淡為上。<br><br>勝而不美，而美之者，是樂殺人。<br>夫樂殺人者，不可得志於天下。<br>吉事尚左，凶事尚右。<br>偏將軍居左，上將軍居右，言以喪禮處之。<br>殺人眾多，以悲哀泣之。戰勝則以喪禮處之。`,
    commentary: `精良的武器是極不吉祥的工具，萬物大多厭惡它，所以悟道的人不使用它。君子平時居處以左方為尊，用兵作戰時則以右方為尊。兵器是不吉祥的工具，不是君子所使用的，只有在迫不得已時才使用，且以保持恬淡平和的心態為上。即便獲勝也不該認為這是光彩的事，如果認為獲勝很光榮，那就是以殺人為樂。凡是以殺人為樂的人，是不可能在天下實現志向的。吉慶之事崇尚左方，凶喪之事則崇尚右方。在軍隊中，偏將軍位於左側，上將軍位於右側，這意味著是以喪禮的位次來安排兵事。殺傷了眾多人命，應該以悲哀的心情來悼念；即便戰爭獲勝，也應該用喪禮的儀式來對待。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 32,
    title: ``,
    classical: `知止章`,
    english: `He who holds fast to the Great Image (the Tao) will attract the whole world. They come and receive no hurt, finding instead rest, peace, and great abundance. Music and dainties may make the passer-by stop, but the words of the Tao seem insipid and without flavour. Looked at, it is not enough to be seen; listened to, it is not enough to be heard. But use it, and its bounty will never be exhausted.`,
    chinese: `道常無名。樸雖小，天下不敢臣。<br>侯王若能守，萬物將自賓。<br>天地相合，以降甘露，民莫之令而自均。<br>始制有名，名亦既有，夫亦將知止。<br>知止可以不殆，譬道之在天下，猶川谷之於江海。`,
    commentary: `道永遠是質樸且沒有名稱的。這種質樸的狀態雖然看似微小卻孕育萬物，天下沒有誰敢把它看做下屬。侯王如果能 守住這份質樸，萬物自然成為你的賓客，歸順於你，。天地陰陽之氣相合，就會降下甘露，所以君王只要守道，百 姓不需要命令、指使，自然會取得平衡。自然創造萬物之後就產生了各種名相，既使有這些名相，就應懂得適可而 止，不要落入分別對待。懂得知止，才不會陷入危險，這就如同道存在於天下，萬物終將回歸於道，就像山谷的細 流，最後都將匯入能納百川的江河大海一樣。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 33,
    title: ``,
    classical: `盡己章`,
    english: `What you would make to shrink, you must first allow to expand. What you would make weak, you must first let grow strong. What you would lay low, you must first let rise. What you would take from, you must first give to. This is called the Subtle Illumination. The soft and weak overcome the hard and strong. As the fish must not leave the deep pool, so must the sharpest instruments (power) of the State not be shown to the people.`,
    chinese: `知人者智，自知者明。<br>勝人者有力，自勝者強。<br>知足者富。強行者有志。<br>不失其所者久。死而不亡者壽。`,
    commentary: `能洞察他人善惡是非的人，是智的表現，能反省改過的人，才是真正明白自身本性。能戰勝別人的人是有力量的， 但是能克制自己欲望與弱點的人才算真正的強大。懂得滿足的人內心不匱乏，就是富有；堅持不懈地實踐的人就是 有志氣。一個凡事不背離「道」的人，才能真正的長久，即使肉體雖然消逝，但精神與道合一、永存人心的人，才 是真正的長壽。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 34,
    title: ``,
    classical: `成大章`,
    english: `The Tao is ever Non-action (Wu-Wei), yet nothing is left undone. If rulers could but hold fast to it, the ten thousand creatures would be transformed by themselves. If during this transformation, desires should arise, I would restrain them with the Nameless Simplicity (the Original State). The Nameless Simplicity brings the absence of desire; and without desire, there is stillness. Then the world will find its own equilibrium.<br><br>The man of Highest Virtue is not conscious of his virtue, and therefore he possesses true Virtue (De). The man of lowest virtue never loses sight of his "virtue," and therefore he lacks the true Virtue. Highest Virtue is Non-action and has no private ends to serve. Lowest virtue acts and has private ends to serve. Highest Benevolence acts but has no private ends. Highest Justice acts and has private ends. Highest Ritual acts, and when no one responds, it uses force to compel. Therefore: "When the Tao was obscured, then came the Virtue (De); When Virtue was lost, then came Benevolence; When Benevolence was lost, then came Justice; When Justice was lost, then came Ritual." Now Ritual is the mere husk of loyalty and trust, and the beginning of disorder. Foreknowledge is but the flower of the Tao, and the beginning of folly. Therefore, the Great Man dwells in the thick (the substance) and not in the thin (the husk); he dwells in the fruit and not in the flower. He rejects the one and chooses the other.`,
    chinese: `大道汎兮，其可左右。<br>萬物恃之以生而不辭，功成而不有。<br>愛養萬物，而不為主，常無欲，可名於小；<br>萬物歸之，而不為主，可名於大。<br>是以聖人，終不為大，故能成其大。`,
    commentary: `道廣闊流動，無處不在，可以左右互補交流。萬物依恃著它而生長，它從不推辭；成就了一切功德，它也爭名逐利。 它愛護滋養萬物，卻不自任為萬物的主宰，始終無私無欲，所以可以稱之為「小」；但萬物最終都歸向它，它卻仍 不主宰控制，這又可以稱之為「大」。因此，聖人始終不自以為大、不追求偉大的名相，反而因此成就了真正的偉 大。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 35,
    title: ``,
    classical: `大象章`,
    english: `Of old, these attained the One (the Tao): Heaven attained the One and became clear; Earth attained the One and became firm; The Spirits attained the One and became divine; The Valley attained the One and became full; The ten thousand creatures attained the One and became alive; Rulers attained the One and became the Rectors of the world. It is the One that brings this to pass. Without that which makes it clear, Heaven might rend; without that which makes it firm, Earth might burst. Therefore, the noble takes the humble as its root; the high takes the low as its foundation. This is why rulers call themselves "The Orphan" or "The Needy." Is this not taking humility as the root? Truly, the highest honour is to be without (worldly) honour. Do not desire to shine like jade, but be as simple as a common stone.`,
    chinese: `執大象，天下往。往而不害，安平泰。<br>樂與餌，過客止。<br>道之出口，淡乎其無味，<br>視之不足見，聽之不足聞，用之不可既。`,
    commentary: `若能謹守那偉大的「道」，天下百姓都會前來歸附。大家前來歸附而互不傷害，如此就能過著安是平靜的太平生活。 這樣安樂的生活與物質的享受，因為這些美好，都像過客一樣短暫。若要說「道」是什麼味道，卻是平淡得沒有滋 味。看它看不見，聽它聽不到，然而實際運用起來，卻是無窮無盡、永遠不會耗竭的。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 36,
    title: ``,
    classical: `微明章`,
    english: `In the Tao, reversal is the movement; Yielding (Weakness) is the tool. The ten thousand creatures under Heaven are born of Being (the Manifested); Being is born of Non-being (the Unmanifested/The Void).`,
    chinese: `將欲歙之，必固張之；將欲弱之，必固強之；<br>將欲廢之，必固興之；將欲取之，必固與之。<br>是謂微明。弱勝剛，柔勝強。<br>魚不可脫於淵，國之利器，不可以示人。`,
    commentary: `想要收縮它，必先擴張它；想要削弱它，必先增強它；想要廢棄它，必先興舉它；想要奪取它，必先給予它。這就 是所謂微妙的先見之明。柔弱的最終會戰勝剛強，柔軟的會戰勝強硬。魚不能離開深淵而生存，國家的制勝利器， 也不可以輕易展示出來。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 37,
    title: ``,
    classical: `無為章`,
    english: `When the highest type of student hears of the Tao, he tries hard to practice it. When the average type of student hears of the Tao, he believes some of it and doubts some of it. When the lowest type of student hears of the Tao, he laughs at it. If he did not laugh, it would not be enough to be the Tao. For there is a saying: The Way that is bright seems dark; The Way that goes forward seems to go back; The Way that is smooth seems rough. The highest Virtue (De) seems like a valley (hollow); The greatest purity seems sullied; A Virtue that is wide seems insufficient; A Virtue that is firm seems frail; A Virtue that is true seems changeful. The great square has no corners; The great vessel is the last to be finished; The great sound is hard to hear; The great Image has no form. The Tao is hidden and nameless; Yet it is the Tao alone that excels in bestowing and completing.`,
    chinese: `道常無為，而無不為。<br>侯王若能守之，萬物將自化，化而欲作。<br>吾將鎮之以無名之樸。<br>無名之樸，亦將不欲。不欲以靜，天下將自正。`,
    commentary: `道始終順應自然而不妄加干涉，但萬物卻都在它的運作下自然成就，沒有一件事不是它所完成的。侯王如果能守住 這種「無為」的原則，萬物將會自我生長演化。在演化過程中，如果萬物產生了過度的貪欲與妄念，我將用那不求 名分、純真質樸的「道」來安定它們。當這種無名的質樸使欲望消失，內心歸於平靜，天下萬物自然就會走向正軌， 呈現和諧安定的狀態。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 38,
    title: ``,
    classical: `處厚章`,
    english: `The Tao gave birth to the One; the One gave birth to the Two; the Two gave birth to the Three; and the Three gave birth to the ten thousand creatures. The ten thousand creatures carry on their backs the Yin (Receptivity) and embrace in their arms the Yang (Creativity) and are blended by the Breath of the Void (Central Harmony). What men most loathe is to be "Orphaned," "Needy," or "Ill-provided." Yet kings and barons use these as their titles. For truly, "A thing may gain by being lost, or lose by being gained." What others have taught, I also teach: "A man of violence will come to a violent end." This I shall take as the father of my teaching.`,
    chinese: `上德不德，是以有德；下德不失德，是以無德。<br>上德無為，而無以為；下德為之，而有以為。<br>上仁為之，而無以為；上義為之，而有以為。<br>上禮為之，而莫之應，則攘臂而扔之。<br><br>故失道而後德，失德而後仁，失仁而後義，失義而後禮。<br>夫禮者，忠信之薄，而亂之首也。<br>前識者，道之華，而愚之始也。<br>是以大丈夫處其厚，不居其薄；<br>處其實，不居其華。`,
    commentary: `具備高尚品德的人，並不刻意表現德行，所以才真正擁有德；德行層次較低的人，執著於形式上的不失德，所以反而不具備真德。有德的人順應自然而不帶任何目的；無德之人做了善事，就會銘記自己做了有德之事。崇尚仁慈的人雖然去做了，但並非刻意為之；但崇尚義氣的人去做了，卻帶有應然的執著。崇尚禮的人去做了有禮的事，若得不到他人回應，就會露出手臂，要求別人也要回禮。所以，當人們失去了自然的「道」才強調「德」，失去了德才強調「仁」，失去了仁才強調「義」，失去了義才強 調「禮」。所謂的「禮」，是「忠信」當中最淡薄的，也是動亂的開端。那些在自認為高人一等的知見意識，只是道外在表層的虛華表象，更是愚昧與盲從的開始。因此，真正的大丈夫立身於厚實的自性，而不處於淺薄的知見；追求內容的真實，而不流於外在的浮華。所以他們捨棄前者（虛偽的外相），而選擇這個（敦厚的真理）。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 39,
    title: ``,
    classical: `得一章`,
    english: `What is most soft in the world overcomes what is most hard. That which has No Substance (The Spirit) enters where there is no crevice. By this I know the benefit of Non-action (Wu-Wei). Few things under heaven are as instructive as the "Teaching without words," or as beneficial as Non-action.`,
    chinese: `昔之得一者，天得一以清；地得一以寧；<br>神得一以靈；谷得一以盈；萬物得一以生；<br>侯王得一，以為天下貞。其致之一也。<br>天無以清，將恐裂；地無以寧，將恐發；<br>神無以靈，將恐歇；谷無以盈，將恐竭；<br>萬物無以生，將恐滅；侯王無以貞，而貴高將恐蹶。<br><br>故貴以賤為本，高以下為基。<br>是以侯王自稱孤、寡、不穀。<br>此非以賤為本耶？非乎？<br>故致數輿無輿。<br>是故不欲琭琭如玉，落落如石。`,
    commentary: `往昔凡是要得到「一」的：天得到一而清明，地得到一而安寧，神靈得到一而玄妙靈通，河谷得到一而充盈，萬物 得到一而生長，侯王得到一而得到天下人的尊敬。這些都是由「一」所達成的。如果天不清明，恐怕會崩裂；地不 安寧，恐怕會塌陷；神靈不顯靈，恐怕會消失；河谷不充盈，恐怕會枯竭；萬物不能生長，恐怕會滅絕；侯王不能 持手正道，而高貴的地位恐怕會遭致挫敗。  所以，顯貴是以卑賤為根本，高尚是以低下為基礎。因此侯王常自稱為孤家、寡人、不穀，這不正是以卑賤為根本 嗎？難道不是嗎？所以最高的榮譽反而是沒有讚譽。因此，不要看自己晶瑩華麗像玉石一般，而要看自己質樸厚實 質就像石頭一樣。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 40,
    title: ``,
    classical: `反覆章`,
    english: `Fame or one's own self, which is the dearer? One's self or possessions, which is the worthier? Gain or loss, which is the greater evil? Truly, a great love is bound to cost a great deal; A great hoard is bound to suffer a great loss. He who is content suffers no disgrace; He who knows when to stop is free from danger. It is thus that one can endure for long.`,
    chinese: `反者道之動；<br>弱者道之用。<br>天下萬物，生於有，有生於無。`,
    commentary: `循環往復、向對立面轉化，是「道」運動變化的規律；柔弱謙下、不偏激爭奪，是「道」發揮作用的體現。天下萬 物都產生於具象的「有」（太極），而「有」則是產生於無形無象的「無」。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 41,
    title: ``,
    classical: `聞道章`,
    english: `Greatest perfection seems imperfect, yet its use is never exhausted. Greatest fullness seems empty, yet its use is never-ending. Greatest straightness seems crooked; Greatest skill seems clumsy; Greatest eloquence seems like a stutter. Movement overcomes cold; stillness overcomes heat. Only through Purity and Stillness can one become the Rectifier of the world.<br><br>When the Tao prevails in the world, the galloping horses are turned back to fertilize the fields with their dung. When the Tao does not prevail in the world, war-horses are bred on the borderlands. There is no greater sin than yielding to desire; No greater disaster than not knowing contentment; No greater misfortune than the greed for gain. Therefore, the contentment of knowing when one has enough is a lasting contentment.`,
    chinese: `上士聞道，勤而行之；中士聞道，若存若亡；<br>下士聞道，大笑之，不笑不足以為道。<br><br>故建言有之：<br>明道若昧；進道若退；夷道若類；上德若谷；<br>大白若辱；廣德若不足；建德若偷；<br>質真若渝；大方無隅；大器晚成；大音希聲；大象無形；<br>道隱無名。夫唯道，善貸且成。`,
    commentary: `上等的人得聞道，會努力不懈地去實踐；中等的人得聞道，似懂非懂，時而相信時而懷疑；下等資質的人得聞道，會大聲嘲笑，如果道不被嘲笑，那就不足以稱為真正的「道」了。所以古人曾說：明瞭道的人看起來昏庸愚昧；精進修道的人總是禮讓無爭，看起來像是退縮；真修道的人不標新立異，看起來平易近人；具有高尚品德的人能虛懷若谷；擁有潔淨的心靈，卻總是不計較是非得失，就像受侮辱；廣大的德性的人積極改過，看起來像老是做錯事；默默建功立德不令人見，就像小偷；本性純真質樸看起來卻像經歷了改變而混濁。包容萬物卻沒有稜角，不分黨結派；有用的器物需要耐心打磨而成；最偉大的聲音（成全）聽起來沒有聲響（以身作則），最大的形象看起來反而沒有形跡。道幽隱而沒有名稱，但也只有道，善於資助並成就萬物。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 42,
    title: ``,
    classical: `沖和章`,
    english: `Without leaving his door, he knows everything under heaven. Without looking out of his window, he sees the Tao of Heaven. The further one travels, the less one knows. Therefore, the Sage knows without travelling, Sees without looking, And accomplishes without acting.<br><br>In the pursuit of learning, every day something is acquired; In the pursuit of the Tao, every day something is dropped. Dropped and again dropped, until one reaches Non-action (Wu-Wei). By Non-action, there is nothing that is not done. The world is always won by those who do not meddle; As for those who meddle, they are never equal to the task of winning the world.`,
    chinese: `道生一，一生二，二生三，三生萬物。<br>萬物負陰而抱陽，沖氣以為和。<br>人之所惡，唯孤、寡、不穀，而王公以為稱。<br>故物或損之而益，或益之而損。<br>人之所教，我亦教之。<br>強梁者，不得其死，吾將以為教父。`,
    commentary: `道生成了原始的統一體「一」，「一」分化出對立的陰陽兩氣「二」，陰陽兩氣交感產生了第三種中和的力量 「三」，再由這三者生成了宇宙間的萬事萬物。萬物背負著陰氣而懷抱著陽氣，在兩氣的互相激盪中達成和諧。人 們所厭惡的，往往是「孤」、「寡」、「不善」這些名詞，但王公貴族卻用這些詞來自我稱呼，作為自我警惕。所 以事物有時看似受損，結果反而得到補益；有時看似得到補益，結果反而受損。別人所教導的道理，我也用來教導 人：那些橫行霸道、強悍好勝的人，通常得不到好下場，我將把這條道理視為父親的教誨，永遠記住。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 43,
    title: ``,
    classical: `至柔章`,
    english: `The Sage has no fixed heart of his own; He takes the heart of the people as his own. To those who are good, I am good; To those who are not good, I am also good; Thus, Virtue (De) is goodness. To those who are faithful, I am faithful; To those who are not faithful, I am also faithful; Thus, Virtue (De) is faithfulness. The Sage, in his dealings with the world, is humble and blends his heart with the world. The people all fix their eyes and ears upon him; And the Sage treats them all as his children.`,
    chinese: `天下之至柔，馳騁天下之至堅。無有入無間。<br>吾是以知無為之有益。<br>不言之教，無為之益，天下希及之。<br>`,
    commentary: `天下最柔弱的東西，竟然能穿梭在天下最堅硬的東西之中。無形的力量能進入沒有縫隙的空間，我因此體會到「無 為」的好處。這種不靠言語來教化、不帶目的而得到的益處，普天之下很少有人能趕得上這種境界。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 44,
    title: ``,
    classical: `知止章`,
    english: `Between birth and death, Three in ten are followers of life; Three in ten are followers of death; And those whose movements lead them to the land of death are also three in ten. Why is this? Because they live their lives too intensely. But I have heard that he who is a good preserver of his life Never meets tiger or wild bull when he travels, And is not touched by weapons of war on the battlefield. The wild bull finds no place to thrust its horns; The tiger finds no place to set its claws; The weapon finds no place to lodge its point. And why? Because in him there is no place for death.<br><br>The Tao gives them life; Virtue (De) nurses them; The world of matter shapes them; their environment completes them. Therefore, among the ten thousand creatures, there is none that does not pay homage to the Tao and assign a high value to Virtue. This homage to the Tao and valuing of Virtue is not commanded by anyone, but is always so, naturally of itself. Thus, the Tao gives them life, but it is Virtue that nurses them, raises them, fosters them, shelters them, feeds them, and protects them. To give life but not to own; To act but not to rely on one's ability; To lead but not to master; This is what is called Mysterious Virtue (Xuan De).`,
    chinese: `名與身孰親？身與貨孰多？得與亡孰病？<br>是故甚愛必大費；多藏必厚亡。<br>故知足不辱，知止不殆，可以長久。`,
    commentary: `名聲與生命相比，哪一個更親切？生命與財富相比，哪一個更貴重？獲得名利與失去生命相比，哪一個更有害？所 以說，過分的貪名求愛必會付出巨大的代價，過多的財物收藏必會招致慘重的損失。因此，懂得滿足就不會受到羞 辱，懂得適可而止就不會遭遇危險，如此才能保持長久的平安。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 45,
    title: ``,
    classical: `清靜章`,
    english: `Everything under heaven had a beginning which may be called the Mother of all things. He who has found the Mother can from her know the children (the manifestations). He who, having known the children, still holds fast to the Mother, will be free from danger all his life. Close the mouth, shut the gates (of the senses), and to the end of life you will have no trouble. Open the mouth, meddle with affairs, and to the end of life there will be no help for you. To see the small is called Illumination; To hold on to the soft is called strength. Use the light, but return to your Inner Illumination (the Source); Then you will not leave yourself exposed to peril. This is called "clinging to the always-so."`,
    chinese: `大成若缺，其用不弊。<br>大盈若沖，其用不窮。<br>大直若屈，大巧若拙，大辯若訥。<br>躁勝寒，靜勝熱。清靜為天下正。`,
    commentary: `最圓滿的成就看起來好像有欠缺，但它的作用卻永遠不會衰竭；最充盈的狀態看起來好像很空虛，但它的作用卻無 窮無盡。最正直的東西看起來好像有彎曲，最靈巧的表現看起來好像很笨拙，最卓越的辯才看起來好像不善言辭。 縱使奔跑躁動可以戰勝寒冷，安靜守候可以克服炎熱。唯有清靜無為，才是治理天下的準則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 46,
    title: ``,
    classical: `知足章`,
    english: `If I had but a little knowledge, I should walk in the Great Tao, and my only fear would be wandering from it. The Great Tao is very smooth and straight, but the people love the mountain paths. When the court is very clean, the fields are full of weeds, and the granaries are quite empty. To wear fine clothes, to carry sharp swords, to be filled with food and drink, and to have more wealth than one can use—this is what I call "the pride of robbers." It is certainly not the Tao.`,
    chinese: `天下有道，卻走馬以糞。<br>天下無道，戎馬生於郊。<br>禍莫大於不知足；咎莫大於欲得。<br>故知足之足，常足矣。`,
    commentary: `當天下太平、符合自然之道時，人們不需要戰爭，原本用來作戰的駿馬都被退還到田裡拉車、施肥耕種。當天下紛 亂、背離自然之道時，兵馬也難免要生死於荒郊野外。災禍沒有比不知足更嚴重的了，過錯沒有比貪得無厭更巨大 的了。所以，唯有明白「真正的滿足」而得到的滿足，才是永恆且恆久的滿足。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 47,
    title: ``,
    classical: `天道章`,
    english: `What is well planted cannot be uprooted; what is well embraced cannot slip away. Through the Virtue (De) of the ancestors, the sacrifices will never cease. Cultivate it in your own person, and its Virtue will be real; Cultivate it in the family, and its Virtue will be abundant; Cultivate it in the village, and its Virtue will endure; Cultivate it in the state, and its Virtue will be flourishing; Cultivate it in the world, and its Virtue will be universal. Therefore, by one's own person, one may judge other persons; By one's own family, one may judge other families; By one's own village, one may judge other villages; By one's own state, one may judge other states; By one's own world, one may judge the world. How do I know that the world is so? By this.`,
    chinese: `不出戶，知天下；<br>不窺牖，見天道。<br>其出彌遠，其知彌少。<br>是以聖人不行而知，不見而明，不為而成。`,
    commentary: `不出門戶，就能推知天下大事的道理；不望向窗外，就能察覺自然運行的規律。向外奔波得越遠，對生命本質的體 認反而越少。因此，聖人不必親身奔波就能明瞭事理，不必親眼窺察就能洞見真相，不刻意妄為就能成就萬物。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 48,
    title: ``,
    classical: `日損章`,
    english: `He who possesses the fullness of Virtue (De) is like a little child. Poisonous insects will not sting him; wild beasts will not seize him; birds of prey will not strike him. His bones are soft, his sinews are weak, yet his grip is firm. He does not yet know the union of male and female, yet his organ can be stirred; this is because his Vital Essence is at its height. He can cry all day without becoming hoarse; this is because his Innate Harmony is at its height. To know harmony is to know the "always-so"; To know the "always-so" is to be Illumined. To force the growth of life is an ill omen; For the heart to direct the breath is called violence. Things that grow to their full strength soon begin to decay. This is called "not being in the Tao." Whatever is not in the Tao soon comes to an end.`,
    chinese: `為學日益，為道日損。<br>損之又損，以至於無為。無為而無不為矣。<br>故取天下，常以無事，<br>及其有事，不足以取天下。<br>`,
    commentary: `追求學問是每天都在增加知識與技能，但體悟大道卻是每天都在減損執念與欲求。不斷地減損再減損，直到進入不 刻意妄為的境界。達到「無為」之後，反而因為順應自然，沒有什麼事情是做不成的。所以，想要治理天下，通常 應當採取不干擾百姓、清靜無事的方法，如果非要將天下佔為己有，以私心行事，那就不具備治理天下的資格了。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 49,
    title: ``,
    classical: `德善章`,
    english: `Those who know do not speak; those who speak do not know. Close the mouth; shut the gates (of the senses). Blunt the sharpness; unravel the knots; Temper the brightness; identify yourself with the dust. This is what is called Mysterious Unity (Xuan Tong). Therefore, no one can be intimate with him, nor can anyone be distant from him. No one can benefit him, nor can anyone harm him. No one can ennoble him, nor can anyone debase him. Therefore, he is the most noble thing under heaven.`,
    chinese: `聖人常無心，以百姓之心為心。<br>善者，吾善之；不善者，吾亦善之；德善矣。<br>信者，吾信之；不信者，吾亦信之；德信矣。<br>聖人之在天下，歙歙焉，<br>為天下渾其心，百姓皆注其耳目，聖人皆孩之。`,
    commentary: `聖人沒有私心，而是以百姓的意願作為自己的心願。良善的人，我善待他；不良善的人，我也善待他，如此便能使 眾人趨於向善，成就德性的圓滿。誠信的人，我信任他；不誠信的人，我也信任他，如此便能使眾人守信，成就信 實的本質。聖人活在世界上，總是為眾生擔憂，為了天下人的福祉而混濁自己清靜的性體；所以百姓們都專注地觀 看聆聽著聖人的教導，而聖人則像看待孩子一樣，慈愛且平等地呵護著每一位百姓。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 50,
    title: ``,
    classical: `生死章`,
    english: `Govern a state with righteousness; conduct a war with craft; but win the world by Non-interference (Wu-Shi). How do I know this is so? By this: The more prohibitions there are, the poorer the people become. The more sharp weapons the people have, the more troubled is the state. The more cunning and skill man possesses, the more strange things happen. The more laws and edicts are multiplied, the more thieves and robbers there are. Therefore the Sage says: I take Non-action (Wu-Wei), and the people transform themselves; I love quietude, and the people right themselves; I do not meddle, and the people prosper by themselves; I have no desires, and the people return to Simplicity (the Uncarved Block).`,
    chinese: `出生入死。<br>生之徒，十有三；死之徒，十有三；<br>人之生，動之死地者，亦十有三。<br>夫何故？以其生生之厚。<br>蓋聞善攝生者，路行不遇兕虎，入軍不被甲兵；<br>兕無所投其角，虎無所用其爪，兵無所容其刃。<br>夫何故？以其無死地。`,
    commentary: `人生即是從出生到死亡。正在生長的孩子約佔十分之三，邁向死亡的老人也約佔十分之三；而原本可以長壽，卻因 為過度耽溺於養生享樂、反使自己走向死地的，也佔了十分之三。這是什麼原因呢？是因為他們汲汲營營謀求衣食， 而傷害了生命。聽說善於攝養生命的人，在陸地上行走不會遇到犀牛或猛虎，進入軍隊也不會受到兵刃傷害。犀牛 對他無處投以利角，猛虎對他無處施以利爪，武器對他無處刺以鋒刃。這是什麼原因呢？因為他順應自然，心中沒 有對立與殺機，所以他的生命中沒有進入死地的缺口。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 51,
    title: ``,
    classical: `尊貴章第五十一
`,
    english: `When the government is muddled and dull, the people are simple and honest. When the government is alert and vigilant, the people are anxious and dissatisfied. Disaster is that on which happiness relies; Happiness is that in which disaster is hidden. Who knows where the end will be? Is there no "Right"? What is "Right" turns into "Strange," and what is "Good" turns into "Evil." Truly, man has been deluded for a long time. Therefore the Sage is square but does not cut; He has edges but does not wound; He is straight but not unrestrained; He is bright but does not dazzle.`,
    chinese: `道生之，德畜之，物形之，勢成之。<br>是以萬物莫不尊道而貴德。<br>道之尊，德之貴，夫莫之命而常自然。<br>故道生之，德畜之；長之育之；成之熟之；養之覆之。<br>生而不有，為而不恃，長而不宰。是謂玄德。`,
    commentary: `萬物由「道」所化生，由「德」所撫育，由物質構成形態，由環境促成生長。因此，萬物沒有不尊崇道、不珍貴德 的。道之所以受尊崇，德之所以顯珍貴，是因為它們從不干涉萬物，而是任由萬物順應自然地生長。所以說，道生 化萬物，德養育萬物，使它們成長、發育，使它們成熟、結果，並對其愛護與庇蔭。生養了萬物而不據為己有，成 就了萬物而不自恃有功，引領著萬物而不主宰控制，這就是最深奧、最幽微的「玄德」。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 52,
    title: ``,
    classical: `守⺟章`,
    english: `In ruling men and serving Heaven, there is nothing like Frugality (Storing up the Virtue). Frugality means to prepare early. To prepare early means to accumulate an abundance of Virtue (De). If there is an abundance of Virtue, there is nothing that cannot be overcome. If there is nothing that cannot be overcome, then no one knows his limits. If no one knows his limits, he can possess the state. The Mother of the state (the Tao) can endure for long. This is called having "deep roots and a firm foundation." It is the way to long life and lasting vision.`,
    chinese: `天下有始，以為天下母。<br>既得其母，以知其子，既知其子，復守其母，沒身不殆。<br>塞其兌，閉其門，終身不勤。<br>開其兌，濟其事，終身不救。<br>見小曰明，守柔曰強。<br>用其光，復歸其明，無遺身殃；是為襲常。`,
    commentary: `天地萬物的化生都有一個原始的開端，這個開端可以看作是天下萬物的母親。既然掌握了這位「母」，就能進一步 認識由它所衍生的「子」；而在認識了萬物之後，又能返回守住那根本的道，如此一生都不會遭遇危險。收斂感官 的孔竅，關閉欲念的門戶，一輩子都不會感到勞頓疲憊。相反地，如果放任感官去追求外物，並耗費心機去處理各 種繁雜的俗事，那這輩子就沒救了。能察覺到隱微的意念叫做「明」，能守住柔弱順應之姿的叫做「強」。運用智 慧的光芒，再返回來照徹內心的清明，不讓真我留下遺憾，這就是所謂的承襲永恆不變的自然法則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 53,
    title: ``,
    classical: `大道章`,
    english: `Ruling a large state is like frying a small fish (it must not be over-handled). When the world is governed according to the Tao, the spirits of the dead do not show their power. It is not that they lack power, but that their power does not harm men. Not only does their power do no harm, but the Sage also does no harm to the people. Since neither does any harm, their Virtues (De) meet and return to the same Source.`,
    chinese: `使我介然有知，行於大道，惟施是畏。大道甚夷，而民好捷徑。朝<br>甚除，田甚蕪，倉甚虛；服文采，帶利劍，厭飲食，財貨有餘；是<br>謂盜誇。非道也哉！`,
    commentary: `假使我稍微有一點覺悟與智慧，並行走於自然大道之中，我最擔心的就是怕自己走入歧路而流於炫耀。大道本來是 非常平坦好走的，但百姓卻偏偏喜歡走那些險峻的捷徑。看看現在的朝廷都不保了，田園卻荒蕪不堪，糧倉也空虛 無物。然而統治者仍穿著華美的衣服，佩帶著鋒利的寶劍，吃厭了精緻的美食，還囤積了剩餘過多的財物，這簡直 就是強盜自誇其富有。這完全是背離大道、違背自然規律的啊！`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 54,
    title: ``,
    classical: `善建章`,
    english: `What is well planted cannot be uprooted; what is well embraced cannot slip away. Through the Virtue (De) of the ancestors, the sacrifices will never cease. Cultivate it in your own person, and its Virtue will be real; Cultivate it in the family, and its Virtue will be abundant; Cultivate it in the village, and its Virtue will endure; Cultivate it in the state, and its Virtue will be flourishing; Cultivate it in the world, and its Virtue will be universal. Therefore, by one's own person, one may judge other persons; By one's own family, one may judge other families; By one's own village, one may judge other villages; By one's own state, one may judge other states; By one's own world, one may judge the world. How do I know that the world is so? By this.`,
    chinese: `善建者不拔，善抱者不脫，子孫以祭祀不輟。<br>修之於身，其德乃真；修之於家，其德乃餘；<br>修之於鄉，其德乃長；修之於國，其德乃豐；<br>修之於天下，其德乃普。<br>故以身觀身，以家觀家，<br>以鄉觀鄉，以國觀國，以天下觀天下。<br>吾何以知天下之然哉？以此。`,
    commentary: `善於建立道德的人，其根基不會被拔除；善於持守道心的人，其信念堅定而不會脫失。如果能將這種精神傳承下去， 子孫的祭祀將會世代延續，永不間斷。將這種道的修養落實在自身，德性就會純真切實；落實在家庭，其德性能庇 蔭家人；落實在鄉里，鄉里就會德性增長；落實在國家，國家就會繁榮豐沛；落實在天下，天下就會使道普及。 所以，要以個人處境來觀察他人，以自己的家庭的來觀察他人的家庭，以自己的鄉里來觀察其他的鄉里，以自己的 國家來觀察其他的國家，以當今天下的動向來觀察天下的趨勢。我憑什麼知道天下運行的規律與現狀呢？就是這樣。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 55,
    title: ``,
    classical: `含德章`,
    english: `He who possesses the fullness of Virtue (De) is like a little child. Poisonous insects will not sting him; wild beasts will not seize him; birds of prey will not strike him. His bones are soft, his sinews are weak, yet his grip is firm. He does not yet know the union of male and female, yet his organ can be stirred; this is because his Vital Essence is at its height. He can cry all day without becoming hoarse; this is because his Innate Harmony is at its height. To know harmony is to know the "always-so"; To know the "always-so" is to be Illumined. To force the growth of life is an ill omen; For the heart to direct the breath is called violence. Things that grow to their full strength soon begin to decay. This is called "not being in the Tao." Whatever is not in the Tao soon comes to an end.`,
    chinese: `含德之厚，比於赤子。<br>毒蟲不螫，猛獸不據，攫鳥不搏。<br>骨弱筋柔而握固。未知牝牡之合而脧作，精之至也。<br>終日號而不嗄，和之至也。<br>知和曰常，知常曰明，益生曰祥。<br>心使氣曰強，物壯則老，是謂不道，不道早已。`,
    commentary: `道德涵養深厚的人，就如同剛出生的嬰兒一般純真質樸。毒蟲不會螫咬他，猛獸不會抓捕他，鳥禽也不會搏擊他。 他的筋骨雖然柔弱，但小手卻能握得很緊；他雖然還不懂男女交合之事，但陽物卻會自然勃起，這是因為精氣充沛 到了極點。他整天大聲啼哭，嗓子卻不會沙啞，這是因為體內的太和之氣達到了極致。能保守太和之器叫做「常」， 能體認永恆大道叫做「明」。能保養長生之道叫做「祥」。妄動暴躁，自以為剛強叫做「逞強」。事物如果強大壯 盛，就會走向衰老；背離了自然之道，生命就會提早終結。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 56,
    title: ``,
    classical: `道貴章`,
    english: `Those who know do not speak; those who speak do not know. Close the mouth; shut the gates (of the senses). Blunt the sharpness; unravel the knots; Temper the brightness; identify yourself with the dust. This is what is called Mysterious Unity (Xuan Tong). Therefore, no one can be intimate with him, nor can anyone be distant from him. No one can benefit him, nor can anyone harm him. No one can ennoble him, nor can anyone debase him. Therefore, he is the most noble thing under heaven.`,
    chinese: `知者不言，言者不知。<br>塞其兌，閉其門，挫其銳，解其紛，和其光，同其塵，是謂玄同。<br>故不可得而親，亦不得而疏；<br>不可得而利，亦不可得而害；<br>不可得而貴，亦不可得而賤。故為天下貴。`,
    commentary: `真正領悟大道的人知道「道」無法用言語表達，而到處宣揚的人往往並非真正體悟。收斂感官的孔竅，關閉欲念的 門戶，消解原本銳利的鋒芒，排解紛擾的糾結，將光芒含藏而顯得柔和，將自己混同於塵世的平凡之中，這就叫做 深奧微妙的「玄同」境界。達到這種境界的人，已經超越了世俗的情感與利害，你既無法親近他，也無法疏遠他； 既無法給予他利益，也無法對他造成傷害；既無法使他變得尊貴，也無法使他顯得卑賤。正因為他超脫了這一切對 立與牽絆，所以才成為天下最尊貴的存在。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 57,
    title: ``,
    classical: `治國章`,
    english: `Govern a state with righteousness; conduct a war with craft; but win the world by Non-interference (Wu-Shi). How do I know this is so? By this: The more prohibitions there are, the poorer the people become. The more sharp weapons the people have, the more troubled is the state. The more cunning and skill man possesses, the more strange things happen. The more laws and edicts are multiplied, the more thieves and robbers there are. Therefore the Sage says: I take Non-action (Wu-Wei), and the people transform themselves; I love quietude, and the people right themselves; I do not meddle, and the people prosper by themselves; I have no desires, and the people return to Simplicity (the Uncarved Block).`,
    chinese: `以正治國，以奇用兵，以無事取天下。吾何以知其然哉？以此：<br>天下多忌諱，而民彌貧；人多利器，國家滋昏；<br>人多伎巧，奇物滋起；法令滋彰，盜賊多有。<br>故聖人云：<br>我無為而民自化；我無事而民自富；我好靜而民自正；<br>我無欲而民自樸；我無情而民自清。`,
    commentary: `治理國家要用光明正大的法制，帶兵作戰要用出奇制勝的謀略，而治理天下則要以使百性平安無事，來取得天下百姓的心。 我憑什麼知道是這樣呢？是根據這些：天下的禁令與忌諱越多，百姓就越陷於貧窮；民間的權謀與利器越多，國家就越陷入 昏亂；人們的鑽營巧思越多，各種稀奇古怪的事物就越層出不窮；法律條文制定得越繁瑣嚴苛，盜賊反而越加橫行。所以聖 人說：只要我守住「無為」，百姓自然會順應本性而自我化育；只要我不生事干擾，百姓自然會富庶康樂；只要我喜好清靜， 百姓自然會歸於端正；只要我沒有貪欲，百姓自然會回歸淳樸；只要我摒除私情偏執，百姓的心境自然會清澈安寧。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 58,
    title: ``,
    classical: `察政章`,
    english: `When the government is muddled and dull, the people are simple and honest. When the government is alert and vigilant, the people are anxious and dissatisfied. Disaster is that on which happiness relies; Happiness is that in which disaster is hidden. Who knows where the end will be? Is there no "Right"? What is "Right" turns into "Strange," and what is "Good" turns into "Evil." Truly, man has been deluded for a long time. Therefore the Sage is square but does not cut; He has edges but does not wound; He is straight but not unrestrained; He is bright but does not dazzle.`,
    chinese: `其政悶悶，其民淳淳；其政察察，其民缺缺。<br>禍兮福所倚，福兮禍所伏。孰知其極？其無正耶。<br>正復為奇，善復為妖。人之迷也，其日固久矣。<br>是以聖人，方而不割，廉而不劌，直而不肆，光而不耀。`,
    commentary: `政府的治理寬厚隨和，百姓就會淳樸敦厚；政府的治理嚴苛精明，百姓就會狡詐缺憾。災禍中往往依傍著福分，福分中也常常隱藏著災禍。誰能知道它們的究竟呢？難道沒有一個絕對的標準嗎？原本的正道會被當成奇怪的言論，原本的良善也被認為是為妖邪。人們對這種變幻無常的道理感到迷惘，確實經很久了。因此，聖人處事方正卻不割傷他人，銳利卻不傷人皮肉，直率卻不放肆傲慢，光亮卻不刺眼。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 59,
    title: ``,
    classical: `⻑生章`,
    english: `In ruling men and serving Heaven, there is nothing like Frugality (Storing up the Virtue). Frugality means to prepare early. To prepare early means to accumulate an abundance of Virtue (De). If there is an abundance of Virtue, there is nothing that cannot be overcome. If there is nothing that cannot be overcome, then no one knows his limits. If no one knows his limits, he can possess the state. The Mother of the state (the Tao) can endure for long. This is called having "deep roots and a firm foundation." It is the way to long life and lasting vision.`,
    chinese: `治人事天，莫若嗇。夫唯嗇，是謂早服；早服謂之重積德；重積德<br>則無不克；無不克，則莫知其極；莫知其極，可以有國；有國之母，<br>可以長久；是謂深根固蒂，長生久視之道。`,
    commentary: `治理百姓和事奉自然，沒有比即愛惜精神、不輕易外洩更重要的了。所謂愛惜精神，就是指早起穿衣服一樣，都是 每天必要的日常，而行善積德就像日常一樣，就能積累深厚德行。不斷積累深厚的德行，就沒有什麼困難是不能克 服的；既然沒有什麼不能克服，就沒有人能測量出他力量的極限。擁有了這種不可限量的力量，就可以擔負起治理 國家的重任。能勝任國家的保母，治理天下就能長治久安。這就是所謂的根基深厚、基礎牢固，是生命長久延續、 永恆存在的根本法則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 60,
    title: ``,
    classical: `治大國章`,
    english: `Ruling a large state is like frying a small fish (it must not be over-handled). When the world is governed according to the Tao, the spirits of the dead do not show their power. It is not that they lack power, but that their power does not harm men. Not only does their power do no harm, but the Sage also does no harm to the people. Since neither does any harm, their Virtues (De) meet and return to the same Source.`,
    chinese: `治大國，若烹小鮮。<br>以道蒞天下，其鬼不神；<br>非其鬼不神，其神不傷民；<br>非其神不傷民，聖人亦不傷民。<br>夫惟兩不相傷，故德交歸焉。`,
    commentary: `治理大國就像烹煮小魚一樣，不能隨意翻動，否則魚肉就會碎掉，比喻治理應當清靜無為，不可朝令夕改。當以 「道」來治理天下時，那些鬼怪邪祟就不再顯靈作祟。不只鬼怪不作祟，神明也不再懲罰百姓。不僅神明不再懲罰 百姓，連有道的聖人也不會為了匡正百姓而去傷害百姓。因為鬼神與聖人都不傷害百姓，所以這份祥和的德性會相 互交融，最終歸結到百姓身上，使天下太平。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 61,
    title: ``,
    classical: `為下章`,
    english: `A large state is like the low-lying land where all streams flow. It is the Universal Mother, the meeting-place of the world. The Feminine always overcomes the Masculine by stillness; and because she is still, she takes the lower place. Therefore, if a large state takes a lower place than a small state, it wins the small state. If a small state takes a lower place than a large state, it wins the large state. One wins by taking the lower place; the other wins by being already low. A large state only desires to protect and nourish all alike; a small state only desires to enter and serve. Both get what they wish; but it is for the great to practice humility (the lower place).`,
    chinese: `大國者下流，天下之交。<br>天下之交，牝常以靜勝牡，以靜為下。<br>故大國以下小國，則取小國；小國以下大國，則取大國。<br>故或下以取，或下而取。<br>大國不過欲兼畜人，小國不過欲入事人。<br>兩者各得所欲，故大者宜為下。`,
    commentary: `大國應該像江河的下游一樣，是天下交流匯聚之處。在天下的交際往來中，柔弱的雌性經常以寧靜勝過剛強的雄性， 因為其處於謙下的地位。所以，大國如果對小國表現謙下，就能贏得小國的信服；小國如果對大國表現謙下，就能 得到大國的接納與包容。所以，有的是透過謙下來取得對方的信任，有的是因為以卑下自處而獲得庇護。大國的願 望不過是想兼容並蓄，照顧天下，小國的願望不過是想事奉大國尋求百姓的安定。為了讓兩者都能各取所需、達成 願望，大國更應該展現謙下、包容的姿態。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 62,
    title: ``,
    classical: `道奧章`,
    english: `The Tao is the sanctuary of all things; The treasure of the good man, the protector of the bad. Fine words may be used for marketing; noble deeds may be used to gain respect. Even if a man is bad, why should he be abandoned? Therefore, at the enthronement of an Emperor or the appointment of the Three Ministers, though one may have large jewels and a team of four horses to precede him, it is better to remain still and offer this Tao. Why did the ancients so highly value this Tao? Was it not because they said: "Seek and you shall find; sin and you shall be forgiven"? Therefore, it is the greatest treasure under heaven.`,
    chinese: `道者萬物之奧。善人之寶，不善人之所保。<br>美言可以市，尊行可以加人。人之不善，何棄之有？<br>故立天子，置三公，雖有拱璧，以先駟馬，不如坐進此道。<br>古之所以貴此道者？何不曰求以得，有罪以免耶？故為天下貴。`,
    commentary: `「道」是萬物最深奧的歸宿，是善人的法寶，也是不善之人用來保全自己的依賴。美好良善的言語可以使人心悅誠 服，尊嚴高尚的行為可以讓人高於他人；未明理的不善之人，見了嘉言善行幡然改過，難道道有遺棄他們嗎？所以， 世人皆以成為天子，擁有文武百官為貴，雖然擁有巨大的玉璧、配備華麗車隊，這些榮耀，都遠遠不如坐下來潛心 進修這大道。古人之所以如此推崇這大道，是為什麼呢？不正是因為「道」能讓人求而得之，且能讓有罪的人能得 到洗滌與寬恕、免於禍害嗎？正因如此，「道」才是天下最尊貴的存在。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 63,
    title: ``,
    classical: `無難章`,
    english: `Practice Non-action (Wu-Wei); attend to nothingness; taste the flavourless. Consider the small as large and the few as many; requite hatred with Virtue (De). Deal with the difficult while it is still easy; manage the great while it is still small. The difficult things of the world must once have been easy; the great things of the world must once have been small. Therefore, the Sage never attempts anything great, and thus his greatness is achieved. He who promises lightly will rarely keep his word; he who considers everything easy will find many difficulties. Therefore, the Sage considers everything difficult, and so in the end he finds no difficulty.`,
    chinese: `為無為，事無事，味無味。<br>大小多少，報怨以德。<br>圖難於其易，為大於其細；<br>天下難事，必作於易；天下大事，必作於細。<br>是以聖人，終不為其大，故能成其大。<br>夫輕諾必寡信，多易必多難。<br>是以聖人猶難之故，終無難。`,
    commentary: `以「無為」的態度去作為，以「不生事」的方式去處事，以「恬淡無味」去品味人生。無論面對的是大事或小事、多數或少 數，都應抱持平常心，甚至能以德報怨。想要解決困難的事，要從容易的地方著手；想要成就遠大的目標，要從微小的細節 開始。天下的難事，必定是從容易的地方發展而來的；天下的大事，也必定是從細微的地方累積而成的。因此，聖人始終不 刻意追求宏大，反而能成就其偉大。輕易許下諾言的人，必然缺乏誠信；把事情看得太過容易的人，必然會遭遇許多困難。 所以聖人遇事總能謹慎、嚴肅地看待其中的困難，最終反而能化險為夷，一生沒有解決不了的難題。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 64,
    title: ``,
    classical: `輔物章`,
    english: `What is at rest is easy to hold; what has not yet appeared is easy to prevent. What is frail is easy to break; what is minute is easy to scatter. Deal with a thing before it comes into being; put it in order before it becomes confused. A tree as big as a man's embrace grows from a tiny sprout; a tower nine stories high rises from a heap of earth; a journey of a thousand miles begins with a single step. He who acts, spoils it; he who grasps, loses it. Because the Sage does not act, he does not spoil; because he does not grasp, he does not lose. In their business, people often fail when they are on the verge of succeeding. If one is as careful at the end as at the beginning, there will be no failure. Therefore, the Sage desires to have no desire, and does not value rare treasures. He learns what is unlearned and returns to the source that the multitude has passed by. He helps the ten thousand creatures to find their own nature (Ziran), but he does not dare to act.`,
    chinese: `其安易持，其未兆易謀。其脆易泮，其微易散。<br>為之於未有，治之於未亂。<br>合抱之木，生於毫末；<br>九層之臺，起於累土；<br>千里之行，始於足下。<br><br>為者敗之，執者失之。<br>是以聖人無為故無敗，無執故無失。<br>民之從事，常幾於成而敗之。慎終如始，則無敗事。<br>是以聖人，<br>欲不欲，不貴難得之貨；學不學，復眾人之所過。<br>以輔萬物之自然，而不敢為。`,
    commentary: `事物在安定時容易持守，在徵兆未顯時容易謀劃。脆弱的容易消解，微小的容易散失。要在事情尚未發生前就先處 理，要在動亂尚未產生前就先治理。數人才能合抱的大樹是由細小的幼苗長成的；九層的高台是從第一筐泥土築起 的；千里的遠行是從腳下的第一步開始的。 刻意強求的人往往會失敗，執著不放的人往往會失去。因此聖人順應自然、不妄為，所以不會失敗；不偏執，所以 不會有損失。一般人做事，常在接近成功時卻失敗了。如果能像剛開始時那樣謹慎地對待結束，就不會有失敗的事 了。所以聖人追求眾人所不追求的，不珍視難得的財物；學習眾人所忽略的，去補救大眾常犯的過錯。他只是輔助 萬物順應自身的天性發展，而不敢依照私欲妄加干預。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 65,
    title: ``,
    classical: `玄德章`,
    english: `In ancient times, those who were skilled in the Tao did not use it to make the people clever, but to keep them simple. The reason why the people are difficult to govern is that they have too much (worldly) knowledge. Therefore, to govern a state by cleverness is to ruin the state; to govern a state without cleverness is a blessing to the state. He who knows these two things knows the Standard. To be always mindful of this Standard is what is called Mysterious Virtue (Xuan De). Mysterious Virtue is deep and far-reaching; it returns with all things to the Source. Only then is the Great Harmony achieved.`,
    chinese: `古之善為道者，非以明民，將以愚之。<br>民之難治，以其智多。<br>故以智治國，國之賊；不以智治國，國之福。知此兩者，亦楷式。<br>常知楷式，是謂玄德。<br>玄德深矣，遠矣，與物反矣，然後乃至大順。`,
    commentary: `古時候善於實踐大道的人，並不是教導百姓運用心機與巧詐，而是要讓他們回歸純真質樸的本性。百姓之所以難以 治理，是因為他們充滿了過多的心機與狡詐。所以，用權謀智慧來治理國家，反而是對國家的傷害；不用權謀、而 以淳樸自然來治理國家，才是國家的福氣。能明白這兩種治理方式的差別，就是成為了治國的榜樣。能恆常守住這 個榜樣準則，就稱為「玄德」。玄德是如此幽深、如此遼遠，它引導萬物回歸本真，雖然其表現與世俗的認知相反， 但最終能帶領世間達到最完美的和諧與順遂。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 66,
    title: ``,
    classical: `江海章`,
    english: `The reason why the River and the Sea are able to be the kings of a hundred mountain streams is that they take the lower place. Therefore, they can be the kings of them all. So, if the Sage wishes to be above the people, he must speak as though he were below them; if he wishes to lead them, he must place himself behind them. In this way, though he is above them, the people do not feel his weight; though he is in front of them, the people do not feel his obstruction. Therefore, the whole world delights in praising him and never tires of him. Because he does not strive, no one in the world can strive against him.`,
    chinese: `江海之所以能為百谷之王者，以其善下之，故能為百谷王。<br>是以聖人，欲上民，必以言下之；欲先民，必以身後之。<br>是以聖人，處上而民不重，處前而民復害。<br>是以天下樂推而不厭。以其不爭，故天下莫能與之爭。`,
    commentary: `江海之所以能成為千百條河流匯聚的王者，是因為它甘願處於低下的地位，所以能成為百谷之王。因此，聖人若想 居於百姓之上，言談間必定對人謙下；若想領導百姓，行為上必定將自己的利益置於人後。因為聖人如此謙卑、無 私，所以他雖然身處高位，百姓也不會覺得沉重負累；雖然走在前面，百姓也不會感到受威脅或妨礙。正因如此， 普天下的人都樂意推舉他而不感到厭倦。因為他不與人競爭，所以天下也沒有人能跟他競爭。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 67,
    title: ``,
    classical: `三寶章`,
    english: `Every one under heaven says that my Tao is great, yet it seems unlike anything else. It is precisely because it is great that it seems unlike anything else. If it were like anything else, it would have become small long ago. I have Three Treasures which I hold fast and watch over: The first is Compassion (Ci); The second is Frugality (Jian); The third is Not daring to be first in the world. Because I am compassionate, I can be brave; Because I am frugal, I can be generous; Because I dare not be first in the world, I can become the leader of all vessels. Nowadays, people leave compassion and try to be brave; they leave frugality and try to be generous; they leave the hindmost place and try to be first. This leads only to death. For compassion wins in the attack and is firm in the defense. Heaven will arm with compassion those whom it would not see destroyed.`,
    chinese: `天下皆謂我道大，似不肖。夫唯大，故似不肖。<br>若肖久矣，其細也夫！<br>我有三寶，持而保之。一曰慈，二曰儉，三曰不敢為天下先。<br>夫慈故能勇；儉故能廣；不敢為天下先，故能成器長。<br>今捨其慈且勇；捨其儉且廣；捨其後且先；死矣！<br>夫慈以戰則勝，以守則固。天將救之，以慈衛之。`,
    commentary: `天下人都說我所說的道過於博大，以至於不像任何具體的東西；正因為它博大，所以才顯得不像具體之物，如果像 具體之物，它早就變得微不足道了。我有三件寶貝，始終持守著：一是仁慈，二是儉約，三是不敢居於天下人的領 先地位。因為仁慈所以能產生勇氣，因為儉約所以能蓄積廣大力量，因為不敢爭先所以能成為萬物的首長。如果現 在的人捨棄仁慈而追求勇敢、捨棄儉約而追求擴張、捨棄退後而爭取領先，那就是走向死亡。仁慈用來作戰就能獲 勝，用來守禦就能堅固，上天如果要救助誰，就會用慈愛來保護他。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 68,
    title: ``,
    classical: `不爭章`,
    english: `A good warrior is not violent; A good fighter is not angry. A good winner does not strive; A good employer of men takes a lower place. This is called the Virtue of Non-striving; This is called the power of using men; This is called matching the sublimity of Heaven, the highest principle of old.`,
    chinese: `善為士者不武；善勝者不怒；<br>善戰敵者不與；善用人者為之下。<br>是謂不爭之德，<br>是謂用人之力，<br>是謂配天，古之極。`,
    commentary: `最好的勇士不逞強好勇；最好的戰士不輕易暴躁動怒；善於打勝仗的人不輕易與對方交鋒；善於用人的人待人謙卑 低下。這就叫作不與人爭的美德，這就是用人的真正力量，這就適配合天地的德行，順應古道最極致的表現。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 69,
    title: ``,
    classical: `用兵章`,
    english: `The strategists have a saying: "I dare not be the host (take the offensive), but prefer to be the guest. I dare not advance an inch, but prefer to retreat a foot." This is called marching without moving; rolling up one's sleeves without baring the arms; capturing the enemy without a confrontation; arming oneself without weapons. There is no greater disaster than underestimating the enemy. To underestimate the enemy is to risk losing my Three Treasures. Therefore, when opposing armies meet, the one who feels pity (sorrow) will be the victor.`,
    chinese: `用兵有言：<br>吾不敢為主而為客；不敢進寸而退尺。<br>是謂行無行；扔無臂；仍無敵；執無兵。<br>禍莫大於輕敵，輕敵則幾喪吾寶。<br>故抗兵相加，哀者勝矣。`,
    commentary: `用兵的人有句名言：我不敢主動採取攻勢而是不得已而應戰，不敢前進一寸爭奪敵方地盤而寧願後退一尺。這就是 行軍佈陣沒有一定的行列陣式，雖然要舉臂卻像沒有手臂可舉；沒有敵意使敵人自願跟隨我方，雖然要執持武器卻 像沒有拿著兵器。災禍沒有比輕視敵人更大的了，輕視敵人幾乎會喪失我所珍視的三寶。所以當兩軍實力相當、陷 入僵持時，能悲天憫人的一方終能獲得勝利。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 70,
    title: ``,
    classical: `懷玉章`,
    english: `My words are very easy to understand and very easy to practice. Yet no one in the world can understand them or practice them. My words have an Ancestor (the Source); my deeds have a Master (the Tao). It is because people do not know this that they do not understand me. Because those who understand me are few, those who follow me are distinguished. Therefore, the Sage wears coarse cloth on the outside, but carries Jade (the True Essence) within his breast.`,
    chinese: `吾言甚易知，甚易行。天下莫能知，莫能行。<br>言有宗，事有君。<br>夫唯無知，是以不我知。知我者希，則我貴矣。<br>是以聖人被褐懷玉。`,
    commentary: `我的話非常容易理解，也非常容易實行，但天下卻沒有人能真正理解，也沒有人能真正實行。言語都有其宗旨，行 事都有其根據。正因為眾人不能理解這些道理，所以才不了解我。了解我的人越稀少，我的道也就越顯得珍貴。因 此聖人就像外表穿著粗布衣裳，卻懷抱著美玉。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 71,
    title: ``,
    classical: `不病章`,
    english: `To know that one does not know is the highest attainment. Not to know, yet to think that one knows, is a disease. Only by recognizing this disease as a disease can one be free from it. The Sage is free from this disease. Because he recognizes it as a disease, he is free from it.`,
    chinese: `知不知上；不知知病。<br>夫唯病病，是以不病。<br>聖人不病，以其病病。`,
    commentary: `知道自己還有所不知，這是最上等的；不知道卻自以為知道，這是嚴重的毛病。唯有把這種「自以為知」當作是病， 才能不犯這種病。聖人之所以沒有這種毛病，是因為他把這種毛病當作病來警惕，所以才不會犯病。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 72,
    title: ``,
    classical: `畏威章`,
    english: `When the people do not fear your power, a greater power will descend upon them. Do not restrict their living space; do not weigh down their lives. It is only because you do not oppress them that they will not grow weary of you. Therefore, the Sage knows himself but does not show himself; He loves himself (his True Self) but does not exalt himself. He rejects the "one" (outward display) and chooses the "other" (inner reality).`,
    chinese: `民不畏威，則大威至。<br>無狹其所居，無厭其所生。<br>夫唯不厭，是以不厭。<br>是以聖人，自知不自見；自愛不自責。<br>故去彼取此。`,
    commentary: `當百姓不再畏懼統治者的威權時，那麼真正可怕的大災難或大變動就要降臨了。不要限制百姓的生存空間使其感到 狹隘，不要壓迫百姓的生活使其感到厭惡。正因為統治者不讓百姓感到厭惡，百姓才不會厭惡統治者。因此聖人有 自知之明，卻不自我顯揚；愛惜自己，卻不自顯尊貴。所以要捨棄自我顯揚與尊貴，採取自知與自愛的態度。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 73,
    title: ``,
    classical: `天網章`,
    english: `He who is brave in daring will be killed; He who is brave in not daring will survive. Of these two, one is profitable and the other is harmful. Who knows the reason for Heaven's dislikes? Even the Sage finds this a difficult question. The Tao of Heaven does not strive, yet it excels in conquering; It does not speak, yet it excels in responding; It does not summon, yet things come of their own accord; It is quiet, yet it excels in planning. The Net of Heaven is vast; its meshes are wide, yet nothing slips through.`,
    chinese: `勇於敢則殺，勇於不敢則活。<br>此兩者，或利或害。天下所惡。<br>孰知其故？是以聖人，猶難之矣。<br>天之道，不爭而善勝，不言而善應，不召而自來，<br>繟然而善謀。天網恢恢，疏而不失。`,
    commentary: `勇於表現剛強果敢的就會招致死亡，勇於表現柔弱退讓的就能活命。這兩種勇氣，一種有利，一種有害。上天所厭 惡的，誰能知道其中的原因呢？所以即使是聖人也感到難以解說。道的規律是：不與人爭卻讓萬物自然順應其發展， 不用說話但能得到萬物自然地響應，不召喚而萬物自動歸附。道總是從容不迫卻好像早已安排好了一切。上天的法 網廣大無邊，雖然網目稀疏，卻不會漏掉任何一件事。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 74,
    title: ``,
    classical: `司殺章`,
    english: `If the people do not fear death, what is the use of trying to frighten them with death? If we make the people constantly fear death, and we seize and kill those who do wrong, who would dare to act? There is always the Master Executioner (Heavenly Law) who kills. To take the place of the Master Executioner is like trying to do the work of a master carpenter. He who tries to do the master carpenter's chipping will rarely escape cutting his own hands.`,
    chinese: `民常不畏死，奈何以死懼之。<br>若使民常畏死，而為奇者，吾得執而殺之，孰敢？<br>常有司殺者殺。<br>夫代司殺者，是謂代大匠斲，<br>夫代大匠斲者，希有不傷其手矣。`,
    commentary: `百姓如果已經窮困痛苦到不再害怕死亡，又怎麼能用死刑來威脅他們呢？假使百姓真的畏懼死亡，而對於那些作亂 違法的人，我們抓來處死，那麼還有誰敢作亂？冥冥中自有主宰殺伐的人負責執行。如果人要代替上天主掌殺伐， 就好比替高明的木匠砍伐木材；代替高明的木匠砍伐木材的人，很少有不傷到自己手的。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 75,
    title: ``,
    classical: `貴生章`,
    english: `The people are starving because those above them eat too much in taxes; that is why they starve. The people are difficult to govern because those above them interfere too much; that is why they are difficult to govern. The people lightheartedly face death because those above them live too luxuriously; that is why they face death lightheartedly. Truly, only those who do not strive after the "fullness of life" are the truly wise in valuing life.`,
    chinese: `民之飢，以其上食稅之多，是以饑。<br>民之難治，以其上之有為，是以難治。<br>民之輕死，以其求生之厚，是以輕死。<br>夫唯無以生為者，是賢於貴生。`,
    commentary: `百姓之所以遭受飢荒，是因為統治者徵收的稅收太多，所以才陷入飢餓。百姓之所以難以治理，是因為統治者喜歡 多事妄為，所以才難以治理。百姓之所以輕視死亡，是因為統治者過度追求奢華的生活，厚斂民財，使得百姓生活 不下去，所以才輕視死亡。只有那種不為了生活享受而強作妄為的人，才比過於看重自身生命享樂的人更加賢明。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 76,
    title: ``,
    classical: `柔弱章`,
    english: `When a man is born, he is soft and weak; when he dies, he is stiff and hard. When the ten thousand creatures, the plants and trees, are born, they are soft and tender; when they die, they are withered and brittle. Therefore, the stiff and hard are the companions of death; The soft and weak are the companions of life. Thus, if an army is too strong, it will not conquer; If a tree is too stiff, it will break. The hard and strong will be brought low; the soft and weak will be exalted.`,
    chinese: `人之生也柔弱，其死也堅強。<br>萬物草木之生也柔脆，其死也枯槁。<br>故堅強者死之徒，柔弱者生之徒。<br>是以兵強則不勝，木強則拱。堅強居下，柔弱居上。<br>`,
    commentary: `人活著的時候身體是柔軟的，死後就變得僵硬；萬物草木活著的時候是柔嫩脆弱的，死後就變得乾枯凋零。所以， 堅硬強大是屬於死亡的一類，柔弱細嫩是屬於生存的一類。因此，軍隊過於強大就不能獲勝，樹木過於強大就會被 砍伐。堅強的處於劣勢，柔弱的反而佔據優勢。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 77,
    title: ``,
    classical: `天道章`,
    english: `Is not the Tao of Heaven like the drawing of a bow? It brings down that which is high and raises up that which is low. It takes from those who have too much and gives to those who have not enough. The Tao of Heaven takes from the surplus to supplement the deficient. The way of man is not so; it takes from the deficient to serve those who have a surplus. Who is there that can use his surplus to serve the world? Only he who possesses the Tao. Therefore, the Sage acts but does not rely on his own ability; His work is done, but he does not stay in it; He has no desire to display his merits.`,
    chinese: `天之道，其猶張弓乎？<br>高者抑之，下者舉之。有餘者損之，不足者與之。<br>天之道，損有餘而補不足。人之道則不然，損不足以奉有餘。<br>孰能以有餘奉天下？唯有道者。<br>是以聖人為而不恃，功成而不處，不欲見賢。`,
    commentary: `自然的規律，難道不像張開弓弦嗎？往上拉就被壓低，往下拉就被抬高；有多的就減少一些，不足就增加一些。道 的規律就是減少多餘的來補貼不足。但人類社會的規則卻不是這樣，反而是犧牲不足的人，來奉獻給富有餘裕的人。 誰能把多餘的力量奉獻給天下人呢？唯有領悟了大道的人才能做到。因此聖人有所作為，卻不自恃己能，成就了功 業卻不歸功於自己，他不希望彰顯自己的賢能。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 78,
    title: ``,
    classical: `水德章`,
    english: `Nothing in the world is softer and weaker than water. Yet, for attacking the hard and strong, nothing can surpass it, because nothing can change it. That the weak overcomes the strong, and the soft overcomes the hard—everyone in the world knows this, yet no one can practice it. Therefore, the Sage says: "He who takes upon himself the disgrace of the state is called the lord of the shrines; He who takes upon himself the misfortunes of the state is called the King of the world." True words often seem paradoxical.`,
    chinese: `天下柔弱，莫過乎水，<br>而攻堅強者，莫之能勝，其無以易之。<br>故柔勝剛，弱勝強，天下莫不知，天下莫能行。<br>故聖人云：受國之垢，是謂社稷主；受國不祥，是為天下。<br>正言若反。`,
    commentary: `天下萬物中沒有比水更柔弱的了，但在攻擊堅強的事物時，卻沒有什麼能勝過水，因為沒有什麼能取代它。所以柔 弱能戰勝剛強，這道理天下沒有人不知道，卻沒有人能真正實行。因此聖人說：肯承擔全國的屈辱，才稱得上是國 家的主人；肯承擔全國的災難，才稱得上是天下的君王。正直的真理聽起來往往像是反話。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 79,
    title: ``,
    classical: `左契章`,
    english: `When a great hatred is reconciled, some hatred is bound to remain. How can this be made good? Therefore, the Sage holds the left-hand tally (the debtor's side) and does not demand payment from others. The man of Virtue (De) attends to his obligations; the man without Virtue attends to his claims. The Tao of Heaven has no favourites; it is always on the side of the good man.`,
    chinese: `和大怨，必有餘怨；安可以為善。<br>是以聖人，執左契，而不責於人。<br>故有德司契，無德司徹。<br>天道無親，常與善人。`,
    commentary: `和解重大的怨恨，必然還會殘留餘怨；這樣又怎麼能算是完美的處置呢？ 因此聖人就像放款的官員，雖然持有放款 憑據，卻不要求他人償還。 也就是說，有德的人就像持有借據一樣，只管盡到自己的義務而不苛求他人；沒有德的 人就像負責徵稅的人一樣，只會一味地對人索取與苛責。 上天之道是對萬物公正無私的，但它卻經常眷顧並助益那 些遵循自然、心存良善的人。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 80,
    title: ``,
    classical: `不徙章`,
    english: `Let the state be small and the people few. Even if there are tools that could do the work of ten or a hundred men, let them not be used. Let the people value their lives and not travel far. Though there be boats and carriages, let there be no occasion to ride in them; Though there be armour and weapons, let there be no occasion to display them. Let the people return to the use of knotted cords (simplicity). Let them find their food savoury, their clothes beautiful, their homes comfortable, and their customs joyful. Though the next state be within sight, and the crowing of cocks and the barking of dogs be heard from it, let the people grow old and die without ever having been there.`,
    chinese: `小國寡民。<br>使有什伯之器而不用；使民重死而不遠徙。<br>雖有舟車，無所乘之，雖有甲兵，無所陳之。<br>使民復結繩而用之。甘其食，美其服，安其居，樂其俗。<br>鄰國相望，雞犬之音相聞，民至老死，不相往來。<br>`,
    commentary: `最純樸的世界就是：國家很小，人口稀少。即使有各種效率極高的器械也不去使用；使百姓看重生命，而不向遠方 遷徙。雖然有船隻與車輛，卻沒有必要去乘坐；雖然有鎧甲與兵器，卻沒有地方去陳放。使百姓恢復到古代結繩記 事的生活方式。這時百姓就會覺得食物甘甜，衣服精美，居住安穩，體會風俗習慣的樂趣。鄰國之間可以互相望見， 雞鳴狗吠的聲音也都能聽聞，但百姓直到老死，彼此之間都不需要互相往來交易或爭鬥。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 81,
    title: ``,
    classical: `不積章`,
    english: `Sincere words are not beautiful; beautiful words are not sincere. The good man does not argue; the man who argues is not good. He who knows is not learned (in mere facts); he who is learned does not know (the Tao). The Sage does not hoard. The more he does for others, the more he has for himself; The more he gives to others, the more he possesses. The Tao of Heaven is to benefit and not to harm. The Way of the Sage is to act and not to strive.`,
    chinese: `信言不美，美言不信。<br>善者不辯，辯者不善。<br>知者不博，博者不知。<br>聖人不積，既以為人己愈有，既以與人己愈多。<br>天之道，利而不害；聖人之道，為而不爭。`,
    commentary: `真實的話不一定好聽，好聽的話往往不真實。善良的人不巧辯，巧辯的人不善良。真正通達真理的人不一定見聞廣 博，見聞廣博的人不一定通達真理。聖人沒有私藏，他盡力幫助別人，自己反而更充足；他盡力給予別人，自己反 而更豐富。自然的規律是利濟萬物而不加傷害；聖人的準則是施予作為而不與人競爭。`,
    discussion: ``,
    en_discussion: ``
  },
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let currentChIdx = null;
let showEn = true, showCn = true, showCmt = true;
let currentDis = 'zh';
let sidebarBuilt = false;

/* ══════════════════════════════════════
   LANDING PAGE
══════════════════════════════════════ */
// Populate chapter dropdown
(function buildLandingSelect() {
  const sel = document.getElementById('l-select');
  chapters.forEach((ch, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${String(ch.num).padStart(2,'0')} · ${ch.classical || '第'+ch.num+'章'}　${ch.title || ''}`;
    sel.appendChild(opt);
  });
})();

function openChapter(idx) {
  currentChIdx = idx;
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('reader').classList.add('active');
  buildSidebar();
  renderChapter();
  if (localStorage.getItem('sidebar-collapsed') !== 'false') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
}

function goHome() {
  document.getElementById('reader').classList.remove('active');
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('l-select').value = '';
}

/* ══════════════════════════════════════
   SIDEBAR
══════════════════════════════════════ */
function buildSidebar() {
  if (sidebarBuilt) return;
  sidebarBuilt = true;
  const navList = document.getElementById('chapter-list');
  chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = 'nav-' + ch.num;
    div.innerHTML =
      `<span class="ch-item-num">${String(ch.num).padStart(2,'0')}</span>` +
      `<div class="ch-item-names">` +
        `<span class="ch-item-en">${ch.title || '—'}</span>` +
        `<span class="ch-item-classical">${ch.classical || '第'+ch.num+'章'}</span>` +
      `</div>`;
    div.onclick = () => {
      openChapter(i);
      if (window.innerWidth <= 640) {
        document.getElementById('sidebar').classList.add('collapsed');
        localStorage.setItem('sidebar-collapsed', 'true');
      }
    };
    div.addEventListener('dblclick', () => enterPresent(i));
    navList.appendChild(div);
  });
}

function setActiveNav(id) {
  document.querySelectorAll('.ch-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  s.classList.toggle('collapsed');
  localStorage.setItem('sidebar-collapsed', s.classList.contains('collapsed'));
}

/* ══════════════════════════════════════
   CHAPTER READER
══════════════════════════════════════ */
function fmtEng(t) { return t.replace(/;[ \t]*(<br>)?[ \t]*/g, ';<br>'); }

function renderChapter() {
  const ch = chapters[currentChIdx];
  const view = document.getElementById('chapter-view');

  const header =
    `<div class="ch-header">` +
      `<div class="ch-header-main">` +
        `<div class="ch-header-label">Chapter ${String(ch.num).padStart(2,'0')}</div>` +
        `<div class="ch-header-en">${ch.title || '—'}</div>` +
        (ch.classical ? `<div class="ch-header-classical-inline">${ch.classical}</div>` : '') +
      `</div>` +
      `<div class="ch-header-num">${String(ch.num).padStart(2,'0')}</div>` +
    `</div>`;

  const engSec = ch.english ?
    `<div class="reader-section${showEn?'':' hidden'}" id="sec-en">` +
      `<div class="reader-sec-label">English Translation</div>` +
      `<div class="reader-english">${fmtEng(ch.english)}</div>` +
    `</div>` : '';

  const cnSec = ch.chinese ?
    `<div class="reader-section${showCn?'':' hidden'}" id="sec-cn">` +
      `<div class="reader-sec-label">原文 · Original Text</div>` +
      `<div class="reader-chinese">${ch.chinese}</div>` +
    `</div>` : '';

  const cmtSec = ch.commentary ?
    `<div class="reader-section${showCmt?'':' hidden'}" id="sec-cmt">` +
      `<div class="reader-sec-label">白話注釋 · Commentary</div>` +
      `<div class="reader-commentary">${ch.commentary}</div>` +
    `</div>` : '';

  const hasDis = ch.discussion || ch.en_discussion;
  const zhContent = ch.discussion
    ? `<div class="reader-discussion">${ch.discussion}</div>`
    : `<p class="dis-coming-soon">尚未提供，敬請期待。</p>`;
  const enContent = ch.en_discussion
    ? `<div class="reader-discussion">${ch.en_discussion}</div>`
    : `<p class="dis-coming-soon">Coming soon.</p>`;

  const disSec = hasDis || true ?
    `<div id="sec-dis">` +
      `<div class="dis-tabs">` +
        `<button class="dis-tab-btn${currentDis==='zh'?' active':''}" onclick="switchDis('zh')">道學讀書會討論摘要</button>` +
        `<button class="dis-tab-btn${currentDis==='en'?' active':''}" onclick="switchDis('en')">English Discussion</button>` +
      `</div>` +
      `<div class="dis-panel${currentDis==='zh'?'':' hidden'}" id="dis-zh">${zhContent}</div>` +
      `<div class="dis-panel${currentDis==='en'?'':' hidden'}" id="dis-en">${enContent}</div>` +
    `</div>` : '';

  view.innerHTML = header + engSec + cnSec + cmtSec + disSec;
  document.getElementById('reader-content').scrollTop = 0;

  document.getElementById('reader-ch-info').innerHTML =
    `<span class="ch-info-full">${String(ch.num).padStart(2,'0')} · ${ch.classical || '第'+ch.num+'章'} · ${ch.title || ''}</span>` +
    `<span class="ch-info-short">Chapter ${String(ch.num).padStart(2,'0')}</span>`;
  document.getElementById('btn-prev-ch').disabled = currentChIdx === 0;
  document.getElementById('btn-next-ch').disabled = currentChIdx === chapters.length - 1;

  setActiveNav('nav-' + ch.num);
}

function prevChapter() {
