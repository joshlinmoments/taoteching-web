  {
    num: 6,
    title: `The Formless True Spirit`,
    classical: `谷神章`,
    english: `The Valley Spirit never dies; <br>It is called the Mysterious Female. <br>The Gateway of the Mysterious Female;<br>Is the Root of Heaven and Earth. <br>Lingering and faint, it seems eternally present;<br>Use it as you will, it never runs dry.`,
    chinese: `谷神不死，是謂玄牝。<br>玄牝之門，是謂天地根。<br>綿綿若存，用之不勤。`,
    commentary: `位在谷地正位的真神是永恆不死的，這就叫做深遠奧妙的母體。這個深妙母體的門戶，就是天地的原始根源。它連綿不絕地存在著，彷彿若有若無，但它的作用卻是無窮無盡，無論如何使用都不會枯竭。`,
    discussion: `<div class="disc-h">主題三：《道德經》第六章——谷神不死與無我境界</div><div class="disc-p">第六章「谷神不死，是謂玄牝。玄牝之門，是謂天地根。綿綿若存，用之不勤。」點傳師解釋，「谷神」指的是我們的真如本性，永恆不滅；「玄牝」則是深不可測的根源，是天地萬物的母體，能生化萬物而取之不盡。<br>點傳師以燈泡為喻：真如本性如同一盞永遠亮著的燈，但因長期被塵埃（習氣、業障）覆蓋，我們已無法感知其光芒。修行的目的，就是不斷「洗澡」——清除覆蓋在本性上的污垢，讓真光重新顯現。<br>在「無我」境界的討論中，點傳師以前賢甲為例，遭遇車禍失去意識，醒來卻還想著自己的後學，這說明：當一個人進入慈悲的境界、不再計較自我得失時，便進入了「神在我身，我在神身」的狀態——與天地合一，與道同在。此時，個人的能量與宇宙的能量相通，便能發揮無限的力量。即便躺在家中靜養，但她慈悲忘我的精神都不斷地感染著大家。</div><div class="disc-h">相關問答</div><div class="disc-q">問：何時才能達到「神在我身，我在神身」的境界？</div><div class="disc-a">答（前賢丙）：在車禍現場，忘記了自己的不適，只想著如何自己還有後學要照顧，那一刻就是無我的狀態。</div><div class="disc-a">答（點傳師）：正是如此。當你不再區分你我，全心投入當下，便是與道合一的境界。</div><div class="disc-q">問：為何我們感受不到自身擁有宇宙的力量？</div><div class="disc-a">答（點傳師）：因為真如本性被長期的習氣與業障所覆蓋，我們忘記了自己本來的樣子。修行就是不斷清除這些覆蓋，讓本性重新顯現。</div><div class="disc-h">主題四：多言數窮——少批評，多行動</div><div class="disc-p">點傳師在課程後段強調，《道德經》中「多言數窮，不如守中」的教導，在現代社會尤為重要。網路上充斥著各種批評與指責，人人都在指出問題，卻鮮少有人願意付諸行動。<br>他以讀書會的實際情況為例：在活動籌備過程中，有人不斷提出問題與批評，卻沒有實際參與解決；真正需要的，是願意捲起袖子、共同承擔的人。批評越多，能量越分散，反而讓事情更難推進。<br>真正的修行者，應效法天道的「無為」——不是什麼都不做，而是順應自然、默默付出，不求回報、不求認可，讓道的力量在潛移默化中發揮作用。</div><div class="disc-h">補充資源</div><div class="disc-p">本次課程未明確提供具體補充資源，但課程中提及以下參考內容：<br>《道德經》：本次研讀第五章（天地不仁）與第六章（谷神不死），建議學員自行對照原文與各家注解深入研讀。<br>黃石公園狼群生態案例：可自行搜尋相關紀錄片或文章，了解移除狼群對生態系統的影響，作為理解「天地不仁」自然法則的輔助案例。</div>`,
    en_discussion: `<div class="disc-sh">Class 8: Centering with Universal Impartiality — Embracing Life’s Impermanence in Modern Life</div><div class="disc-p">Exploring the mystery of the eternal Valley Spirit within, deconstructing the traps of validation-seeking through selfless endurance, and purifying the mind to overcome blindness and restore inner clarity.</div><div class="disc-sh">Guang Ming Advanced Academy</div><div class="disc-sh">June 24, 2026</div><div class="disc-sh">Overview</div><div class="disc-p">This session focused on studying and discussing two chapters of the Tao Te Ching — Chapter 6 (The Valley Spirit) and Chapter 7 (Heaven and Earth). The discussion drew connections between Daoist philosophy, Buddhist teachings, and Christian scripture, exploring themes of the eternal Tao, selflessness, self-cultivation, and inner clarity. Participants engaged in bilingual (English and Mandarin) dialogue, sharing personal reflections and real-life examples to deepen their understanding of the classical texts.</div><div class="disc-sh">Key Concepts or Theories</div><div class="disc-p">The Valley Spirit: The mysterious, undying spirit residing within a specific location on the human body, symbolizing the eternal and nurturing nature of the Tao<br>The Mysterious Female (玄牝): A metaphor for the generative, nurturing gateway of the Tao — the root of heaven and earth<br>Tao as Eternal and Inexhaustible: Like a bellows, the Tao is empty yet endlessly useful; it nurtures all things without depleting itself</div><div class="disc-q">Master: The principle that heaven, earth, and sages endure because they do not live for themselves</div><div class="disc-p">Blindness/Lack of Clarity(無明): A Buddhist concept describing the state of not understanding oneself clearly, likened to being lost in a maze<br>The Paradox of Giving: The more one gives, the more one receives — a recurring theme across Daoist, Buddhist, and personal experience<br>Self-Cultivation: The importance of examining oneself deeply, washing the "dish of the mind," and achieving clarity as the foundation of spiritual growth</div><div class="disc-sh">Important Questions Raised</div><div class="disc-p">What is the Valley Spirit, and where is it located in the human body?<br>Why does Laozi describe the Tao as the "Mysterious Female" and the "root of heaven and earth"?<br>How do Daoism, Buddhism, and Christianity describe the same spiritual location or concept in different ways?<br>Why do heaven and earth remain eternal — and what does that teach us about how to live?<br>How can we overcome Wuming (lack of clarity/blindness) in our own lives?<br>Is recognition or acknowledgment necessary for doing good deeds?<br>How can we help others who are resistant to change without triggering their defenses?</div><div class="disc-sh">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">The Valley Spirit in Chapter 6 represents the eternal, invisible Tao that resides within us and never dies<br>The "Mysterious Female" is a metaphor for the nurturing, generative nature of the Tao — the gateway and root of all existence<br>Parallel descriptions of the same spiritual concept appear across Daoism (valley/nose), Buddhism (Lingshan/vase of Guanyin), and Christianity (God breathing life through the nostrils in Genesis)<br>Chapter 7 teaches that heaven and earth are eternal because they do not live for themselves — a model for selfless leadership and living<br>The sage puts himself last yet finds himself foremost — illustrating the paradox of selflessness leading to fulfillment<br>Wuming refers to a lack of inner brightness or clarity — the root of frustration and conflict — and self-cultivation begins with recognizing and clearing this blindness<br>The more one gives — time, energy, care — the more one receives in return; this is not merely idealistic but practically demonstrated in relationships and community life</div><div class="disc-sh">Topic 1: Chapter 6 — The Valley Spirit and the Mysterious Female</div><div class="disc-p">Chapter 6 of the Tao Te Ching opens with the line: "The valley spirit never dies; it is called the Mysterious Female." "Gu Shen" can be understood not only as "valley spirit" but also as "very God" — signifying something divine and undying. The valley, as the lowest point of a mountain, serves as a metaphor for a specific, sacred location on the human body — one that is traditionally revealed only to those who have received the Dao. The shape of Guanyin Shan in New Taipei serves as a visual metaphor: the mountain resembles a face lying down, and the valley corresponds to a spiritually significant point.</div><div class="disc-q">Master Josh drew cross-tradition parallels to illuminate this concept. In Buddhism, the Buddha is said to reside on Lingshan — the Spiritual Mountain — which is not a physical place but a location within oneself. The vase held by Guanyin Buddha, filled with wisdom water, similarly points to the same location: the mountain represents one part of the face, and the wisdom flows from the top of the vase, corresponding to the valley. In Christianity, Genesis describes God forming man from dust and breathing life into his nostrils — again pointing to the nose and its surrounding area as spiritually significant. These convergences across traditions reinforced the idea that the Valley Spirit is the dwelling place of the soul, and because the soul is a part of the eternal Tao (or God), it never dies.</div><div class="disc-p">The chapter concludes: "Lingering and faint, it seems eternally present. Use it as you will; it never runs dry." This was connected to the bellows metaphor from Chapter 5 — the Tao is invisible and seemingly empty, yet inexhaustible in its capacity to nurture.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "Is the Valley Spirit the same as the Tao inside us?"</div><div class="disc-a">Participant: Yes — the valley spirit represents the Tao dwelling within each person. Because the Tao never dies, and our soul is part of the Tao (or God), our soul is likewise eternal.</div><div class="disc-a">Participant: "Why does Laozi call it the 'Mysterious Female'?"</div><div class="disc-a">Participant: The female metaphor emphasizes the nurturing, generative quality of the Tao — like a mother who gives birth to and sustains all things. It is the root and gateway of heaven and earth.</div><div class="disc-a">Participant: "Does Christianity describe the same spiritual location?"</div><div class="disc-a">Participant: Yes — Genesis 2:7 states: "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul." This points to the nose as the entry point of divine life, consistent with the Daoist and Buddhist descriptions.</div><div class="disc-sh">Topic 2: Chapter 7 — Heaven, Earth, and Selflessness</div><div class="disc-p">Chapter 7 opens: "Heaven is eternal, Earth is lasting. How do they remain so? They do not live for themselves. And so they can help us." Master Josh explained that Laozi uses the sky and earth as the most universally recognizable examples of enduring things in nature, and asks: how do they last so long? The answer is that they are selfless — they do not act for their own benefit.<br>This principle was applied to leadership: a good leader cannot serve only themselves. History remembers only a few people — sages, prophets, figures like the Buddha — precisely because they transcended their physical bodies through selfless action. Their ideas and spirit endure long after their physical death, which is what it means to be "eternal and lasting."<br>The chapter continues: "Therefore, the sage puts himself last, yet finds himself in the foremost place. He places his own self outside, yet he is preserved. Is it not because he is selfless? His own self-fulfillment is attained." Master Josh illustrated this with a real example from a large temple event in Linkou, where Jason and his wife Helen gave away all their own lunch boxes to ensure every performer was fed — and ended up receiving more than ten lunch boxes in return from grateful participants. This embodied the Daoist principle: put yourself last, and you will not be forgotten.<br>The discussion also explored the danger of seeking recognition. Acting with the expectation of acknowledgment was identified as a subtle form of arrogance and attachment — a "purpose" that contradicts the Daoist ideal of acting without ulterior motive. The mind is like a dish: even the finest praise, if not "washed clean," spoils like leftovers overnight. This attachment breeds future anxiety—leading one to wonder why praise is missing next time or why results fall short. True clarity means cleansing the mind daily to prevent past success from becoming future frustration.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "Why do sages like the Buddha remain remembered and respected even after death?"</div><div class="disc-a">Participant: Because they did not live for themselves. Their ideas and spirit transcend their physical bodies — they are eternal in meaning, even if not in form.</div><div class="disc-a">Participant: "Does doing good require recognition to be valid?"</div><div class="disc-a">Participant: No — a good action is still good even if no one acknowledges it. Even self-recognition can become a seed of arrogance. The ideal is to act without expectation of reward or acknowledgment.</div><div class="disc-a">Participant: "What is Wuming, and how does it relate to self-cultivation?"</div><div class="disc-a">Participant: Wuming literally means "no brightness" or "no clarity" — it is a state of blindness, like being lost in a maze. It is the root of frustration and conflict. Self-cultivation begins with recognizing this blindness within oneself and working to achieve clarity, just as one must wash a dish clean before using it again.</div><div class="disc-sh">Topic 3: Applying the Teachings — Giving, Compassion, and Helping Others</div><div class="disc-p">The final portion of the session moved from textual study to practical application. Master Josh shared a personal reflection on a friend who was experiencing depression and recurring conflict with others. Rather than offering direct advice — which would likely trigger defensiveness — Master Josh concluded that the most effective approach was to be a good model: to demonstrate, through action, that there is another way to handle conflict. "The solution is not to give a solution," as one participant summarized. Instead, being a safe and compassionate presence allows others to observe and, in time, follow.<br>This connected back to the paradox of giving discussed throughout the session: the more one gives — whether time, energy, friendship, or compassion — the more one receives. Dom shared a personal story from her teenage years, recalling that he struggled to make friends because he was waiting to receive care rather than offering it. Once he shifted his focus to asking questions and showing genuine interest in others, friendships formed naturally. This was recognized as a lived example of the Daoist and Buddhist principle: give first, and abundance follows.<br>The session also touched on how compassion can serve as a practical tool for resolving conflict — particularly within families and among siblings. Rather than judging or arguing, approaching others with a parental compassion — loving them even when they are wrong, and gently guiding rather than confronting — was offered as a path through difficult relationships.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "How can we help someone who always ends up in conflict with others, but doesn't believe they are at fault?"</div><div class="disc-a">Participant: Direct advice often activates their defense mechanisms. A more effective approach is to be a good model — to demonstrate through your own behavior that there is another way. The solution is not to give a solution, but to be a living example.</div><div class="disc-a">Participant: "How do we charge our mental energy when we feel depleted?"</div><div class="disc-a">Participant: Giving more, helping others, spending time in service — generates more energy rather than depleting it. Like a phone that wastes battery by sitting idle, the mind loses energy through withdrawal. Giving and connecting recharges it.</div><div class="disc-a">Participant: "What is the solution to Wuming — how do we overcome our own blindness?"</div><div class="disc-a">Participant: By reading the classics, listening to the guidance of wise teachers, and cultivating compassion in each challenge we face. We cannot always see our own maze from within, but wisdom — like a God's-eye view — gives us a wider vision to find the way.</div><div class="disc-sh">Supplemental Resources</div><div class="disc-p">Genesis 2:7 (Christian Bible, Old Testament): Referenced during the discussion of the Valley Spirit — "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul." Used to illustrate cross-tradition parallels regarding the spiritual significance of the nose.<br>Guanyin Shan, New Taipei: Referenced as a visual metaphor for the Valley Spirit — the mountain's shape resembles a face lying down, with the valley corresponding to the spiritually significant location described in Chapter 6.<br>Buddhist Sutra on Lingshan: Referenced to show that the Buddha's "Spiritual Mountain" is not a physical place but an inner location — parallel to the Daoist Valley Spirit concept.</div>`

    title: `The Selfless Mind`,
    classical: `無私章`,
    english: `Heaven is eternal, Earth is lasting. <br>How do they remain eternal and lasting? <br>Because they do not live for themselves, <br>And so they can outlive themselves.<br>Therefore, the Sage puts himself last, yet finds himself in the foremost place; <br>He places his own self outside, yet finds his life preserved. <br>Is it not because he is selfless;<br>That his own self-fulfillment is attained?`,
    chinese: `天長地久。<br>天地所以能長且久者，以其不自生，故能長生。<br>是以聖人後其身而身先；外其身而身存。<br>非以其無私邪？故能成其私。`,
    commentary: `天地之所以能夠長久存在，是因為它們運作時並非為了自己的生存而刻意作為，而是自然地生養萬物，正因為不為 己，所以能永恆長生。聖人效法這種精神：在利益面前，他把自己放在眾人之後，結果反而受到推崇而領先；在安 危面前，他將自身的私利置之度外，結果反而能保全自身。這不正是因為他的無私嗎？但也正因為這種無私，反而 成就了他個人的圓滿。`,
    discussion: `<div class="disc-sh">知道・道學讀書會</div><div class="disc-sh">重點摘要</div><div class="disc-p">本次讀書會為第七集，研讀《道德經》第七章，主題為「天長地久」。<br>瑋揚引導學員理解「天長地久」的深層含義，並非僅指情感上的長久，而是指個人德行與精神的永恆。<br>討論了老子「不自生」、「無私」的核心思想，並以范仲淹的故事作為具體例證。<br>強調真正的「長生」是「死而不亡」——即使身死，其德行與影響仍被後世記憶與傳承。</div><div class="disc-sh">討論主題</div><div class="disc-sh">《道德經》第七章「天長地久」的文本解讀</div><div class="disc-p">瑋揚帶領學員共同朗讀第七章，並逐句解析老子所言「天長地久」的意涵。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：老子以天地為最大的學習對象，因為在古人的世界觀中，天地是最偉大的存在。天地之所以能長久，在於其「不自生」，即不為自己而生存。</div><div class="disc-q">點傳師：「天長地久」這個詞在現代常被用於形容愛情，但老子原意是探討個人的精神與德行如何能夠永恆長存。</div><div class="disc-sh">結論</div><div class="disc-p">「天長地久」的核心不在於情感，而在於效法天地「不自生」的精神，以此修養自身德行。</div><div class="disc-sh">現代人的人生目標與「天長地久」的共同本質</div><div class="disc-p">瑋揚提問學員現代人追求的人生目標為何，並引導學員發現這些目標與「天長地久」的本質相通。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：現代人普遍追求金錢、安全感、穩定、成功、健康等，這些目標的本質都是希望一切都能「好好的」，能「一直好好的」，其實這與老子所說的「天長地久」指向同一個目標。</div><div class="disc-q">點傳師：當我們想當YOUTUBER，偶然發了某一則影片獲得大量按讚，就會繼續想要得到更多的關注，說明人們對成功的渴望往往是希望成功能夠持續，而非一次性的達成。</div><div class="disc-sh">結論</div><div class="disc-p">現代人所追求的種種目標，其深層本質皆是對「永恆美好」的渴望，與老子的「天長地久」思想一脈相承。</div><div class="disc-sh">「不自生」與「無私」的哲學內涵</div><div class="disc-p">瑋揚深入解析老子「不自生，故能長生」的哲學意涵，並區分不同層次的「為他」境界。</div><div class="disc-sh">詳細內容</div><div class="disc-a">前賢：對「不自生」的解讀提出疑問，認為可能是「不利益自身」的意思。</div><div class="disc-q">點傳師：「生」就是「增加」，所以不自生就是自己不增加，不覺得我有做什麼，我有做了好事，不覺得我有賺功德等。</div><div class="disc-q">點傳師：區分兩個層次——第一層是「為自己」，做事以提升自我為目的；第二層是「利他」，但若心存利他之念，容易生起驕慢之心，反而傷害自己。真正偉大的德行是連「利他」的念頭都沒有，只是順應本性去做該做的事。</div><div class="disc-q">點傳師：以講課為例，若講師心存「我在幫助你們，你們應該感謝我」的念頭，便是有所求；真正的境界是講師與學員互相感恩，感恩之心是宇宙中最強大的力量之一。</div><div class="disc-sh">結論</div><div class="disc-p">真正的「無私」不是刻意壓抑自我，而是根本沒有「我在幫助別人」的念頭，只是順應天性去行善。<br>唯有達到這種境界，才能實現真正的「天長地久」。</div><div class="disc-sh">「死而不亡者壽」——真正的長生之道</div><div class="disc-p">瑋揚引用《道德經》後章「死而不亡者壽」，說明真正的長生並非肉體的長壽，而是精神與德行的永恆傳承。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：以電影《可可夜總會》為例，說明一個人真正消失是在被所有人遺忘之時；只要被人記得，其精神便仍然存在。</div><div class="disc-q">點傳師：暢銷書榜單每週更換，但兩千五百年前的孔子、老子至今仍被人記憶，這正是「死而不亡」的體現。</div><div class="disc-q">點傳師：真正被後世記憶的人，往往是那些將自己的智慧與德行奉獻給眾人的人，而非只為自己積累財富者。</div><div class="disc-sh">結論</div><div class="disc-p">真正的「長生」是「死而不亡」，即德行與影響力超越肉體生命，被後世永遠記憶。<br>經典之所以成為經典，正因其具有超越時代的真實價值。</div><div class="disc-sh">「聖人後其身而身先」——以范仲淹為例</div><div class="disc-p">瑋揚以北宋名相范仲淹的故事，具體說明老子「後其身而身先，外其身而身存」的實踐。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：范仲淹的名言「先天下之憂而憂，後天下之樂而樂」正是「後其身」精神的體現。</div><div class="disc-q">點傳師：范仲淹治理杭州時，當地遭遇嚴重饑荒，他不像其他官員直接開倉放糧，而是反其道而行，將提高米價，引來全國商人運糧前來，反而讓米價下跌，最終糧食充裕，饑荒自然解除。</div><div class="disc-q">點傳師：范仲淹同時舉辦龍舟賽等藝文活動，並修繕廟宇、修建水利建設等創造就業機會，讓百姓有工作可做、有收入可得，此舉雖遭彈劾，卻是真正解決問題的根本之道。</div><div class="disc-q">點傳師：以1929年美國經濟大蕭條為例，說明政府以「以工代賑」取代直接發放救濟金，才是真正幫助人民重返正常生活的方式。</div><div class="disc-q">點傳師：范仲淹將風水師認為能使子孫大富大貴的風水寶地，捐出作為義學（公益學校），讓貧苦百姓得以受教育；而將另一塊被認為凶險的土地作為祖墳。此舉完全出於無私，最終其家族綿延千年，至今仍興旺。</div><div class="disc-sh">結論</div><div class="disc-p">范仲淹的一生是「後其身而身先，外其身而身存」的最佳典範。<br>真正的無私不僅造福他人，最終也成就了自己與後代的長久興旺。<br>道場或家族中的付出，即使當下看不到回報，其深遠影響往往超乎想像。</div><div class="disc-sh">過度保護子女的反思</div><div class="disc-p">瑋揚以一位家教學生的故事，說明過度保護反而剝奪子女成長機會的道理。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：某補習學生從小被父母過度保護，所有障礙皆由父母排除，導致其成年後極度缺乏自信，甚至在被選為社團幹部時感到恐懼，父母更直接到校干涉，阻止其參與社團活動。</div><div class="disc-q">點傳師：真正幫助子女成長的方式，是為其創造一個充滿信任與友善的環境，而非不斷替其排除障礙。</div><div class="disc-sh">結論</div><div class="disc-p">過度保護是一種「有私」的愛，反而阻礙子女的成長與自立。<br>為子女創造良好的成長環境，遠比替其解決所有問題更為重要。</div><div class="disc-sh">感恩心的力量</div><div class="disc-p">瑋揚在課程中強調感恩之心的重要性。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：感恩是宇宙中最強大的力量之一，能夠平衡世間萬物的高低起伏。</div><div class="disc-q">點傳師：當講師感謝學員、學員感謝講師，雙方皆懷感恩之心時，整個場域便充滿和諧。</div><div class="disc-q">點傳師：每次上課開始，都會感謝天恩師德、前輩們精心培育的聚會氛圍。</div><div class="disc-sh">結論</div><div class="disc-p">感恩心是化解「有私」心態的重要力量，也是實踐「無私」精神的具體表現。</div>`,
    en_discussion: `<div class="disc-sh">Class 8: Centering with Universal Impartiality — Embracing Life’s Impermanence in Modern Life</div><div class="disc-p">Exploring the mystery of the eternal Valley Spirit within, deconstructing the traps of validation-seeking through selfless endurance, and purifying the mind to overcome blindness and restore inner clarity.</div><div class="disc-sh">Guang Ming Advanced Academy</div><div class="disc-sh">June 24, 2026</div><div class="disc-sh">Overview</div><div class="disc-p">This session focused on studying and discussing two chapters of the Tao Te Ching — Chapter 6 (The Valley Spirit) and Chapter 7 (Heaven and Earth). The discussion drew connections between Daoist philosophy, Buddhist teachings, and Christian scripture, exploring themes of the eternal Tao, selflessness, self-cultivation, and inner clarity. Participants engaged in bilingual (English and Mandarin) dialogue, sharing personal reflections and real-life examples to deepen their understanding of the classical texts.</div><div class="disc-sh">Key Concepts or Theories</div><div class="disc-p">The Valley Spirit: The mysterious, undying spirit residing within a specific location on the human body, symbolizing the eternal and nurturing nature of the Tao<br>The Mysterious Female (玄牝): A metaphor for the generative, nurturing gateway of the Tao — the root of heaven and earth<br>Tao as Eternal and Inexhaustible: Like a bellows, the Tao is empty yet endlessly useful; it nurtures all things without depleting itself</div><div class="disc-q">Master: The principle that heaven, earth, and sages endure because they do not live for themselves</div><div class="disc-p">Blindness/Lack of Clarity(無明): A Buddhist concept describing the state of not understanding oneself clearly, likened to being lost in a maze<br>The Paradox of Giving: The more one gives, the more one receives — a recurring theme across Daoist, Buddhist, and personal experience<br>Self-Cultivation: The importance of examining oneself deeply, washing the "dish of the mind," and achieving clarity as the foundation of spiritual growth</div><div class="disc-sh">Important Questions Raised</div><div class="disc-p">What is the Valley Spirit, and where is it located in the human body?<br>Why does Laozi describe the Tao as the "Mysterious Female" and the "root of heaven and earth"?<br>How do Daoism, Buddhism, and Christianity describe the same spiritual location or concept in different ways?<br>Why do heaven and earth remain eternal — and what does that teach us about how to live?<br>How can we overcome Wuming (lack of clarity/blindness) in our own lives?<br>Is recognition or acknowledgment necessary for doing good deeds?<br>How can we help others who are resistant to change without triggering their defenses?</div><div class="disc-sh">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">The Valley Spirit in Chapter 6 represents the eternal, invisible Tao that resides within us and never dies<br>The "Mysterious Female" is a metaphor for the nurturing, generative nature of the Tao — the gateway and root of all existence<br>Parallel descriptions of the same spiritual concept appear across Daoism (valley/nose), Buddhism (Lingshan/vase of Guanyin), and Christianity (God breathing life through the nostrils in Genesis)<br>Chapter 7 teaches that heaven and earth are eternal because they do not live for themselves — a model for selfless leadership and living<br>The sage puts himself last yet finds himself foremost — illustrating the paradox of selflessness leading to fulfillment<br>Wuming refers to a lack of inner brightness or clarity — the root of frustration and conflict — and self-cultivation begins with recognizing and clearing this blindness<br>The more one gives — time, energy, care — the more one receives in return; this is not merely idealistic but practically demonstrated in relationships and community life</div><div class="disc-sh">Topic 1: Chapter 6 — The Valley Spirit and the Mysterious Female</div><div class="disc-p">Chapter 6 of the Tao Te Ching opens with the line: "The valley spirit never dies; it is called the Mysterious Female." "Gu Shen" can be understood not only as "valley spirit" but also as "very God" — signifying something divine and undying. The valley, as the lowest point of a mountain, serves as a metaphor for a specific, sacred location on the human body — one that is traditionally revealed only to those who have received the Dao. The shape of Guanyin Shan in New Taipei serves as a visual metaphor: the mountain resembles a face lying down, and the valley corresponds to a spiritually significant point.</div><div class="disc-q">Master Josh drew cross-tradition parallels to illuminate this concept. In Buddhism, the Buddha is said to reside on Lingshan — the Spiritual Mountain — which is not a physical place but a location within oneself. The vase held by Guanyin Buddha, filled with wisdom water, similarly points to the same location: the mountain represents one part of the face, and the wisdom flows from the top of the vase, corresponding to the valley. In Christianity, Genesis describes God forming man from dust and breathing life into his nostrils — again pointing to the nose and its surrounding area as spiritually significant. These convergences across traditions reinforced the idea that the Valley Spirit is the dwelling place of the soul, and because the soul is a part of the eternal Tao (or God), it never dies.</div><div class="disc-p">The chapter concludes: "Lingering and faint, it seems eternally present. Use it as you will; it never runs dry." This was connected to the bellows metaphor from Chapter 5 — the Tao is invisible and seemingly empty, yet inexhaustible in its capacity to nurture.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "Is the Valley Spirit the same as the Tao inside us?"</div><div class="disc-a">Participant: Yes — the valley spirit represents the Tao dwelling within each person. Because the Tao never dies, and our soul is part of the Tao (or God), our soul is likewise eternal.</div><div class="disc-a">Participant: "Why does Laozi call it the 'Mysterious Female'?"</div><div class="disc-a">Participant: The female metaphor emphasizes the nurturing, generative quality of the Tao — like a mother who gives birth to and sustains all things. It is the root and gateway of heaven and earth.</div><div class="disc-a">Participant: "Does Christianity describe the same spiritual location?"</div><div class="disc-a">Participant: Yes — Genesis 2:7 states: "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul." This points to the nose as the entry point of divine life, consistent with the Daoist and Buddhist descriptions.</div><div class="disc-sh">Topic 2: Chapter 7 — Heaven, Earth, and Selflessness</div><div class="disc-p">Chapter 7 opens: "Heaven is eternal, Earth is lasting. How do they remain so? They do not live for themselves. And so they can help us." Master Josh explained that Laozi uses the sky and earth as the most universally recognizable examples of enduring things in nature, and asks: how do they last so long? The answer is that they are selfless — they do not act for their own benefit.<br>This principle was applied to leadership: a good leader cannot serve only themselves. History remembers only a few people — sages, prophets, figures like the Buddha — precisely because they transcended their physical bodies through selfless action. Their ideas and spirit endure long after their physical death, which is what it means to be "eternal and lasting."<br>The chapter continues: "Therefore, the sage puts himself last, yet finds himself in the foremost place. He places his own self outside, yet he is preserved. Is it not because he is selfless? His own self-fulfillment is attained." Master Josh illustrated this with a real example from a large temple event in Linkou, where Jason and his wife Helen gave away all their own lunch boxes to ensure every performer was fed — and ended up receiving more than ten lunch boxes in return from grateful participants. This embodied the Daoist principle: put yourself last, and you will not be forgotten.<br>The discussion also explored the danger of seeking recognition. Acting with the expectation of acknowledgment was identified as a subtle form of arrogance and attachment — a "purpose" that contradicts the Daoist ideal of acting without ulterior motive. The mind is like a dish: even the finest praise, if not "washed clean," spoils like leftovers overnight. This attachment breeds future anxiety—leading one to wonder why praise is missing next time or why results fall short. True clarity means cleansing the mind daily to prevent past success from becoming future frustration.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "Why do sages like the Buddha remain remembered and respected even after death?"</div><div class="disc-a">Participant: Because they did not live for themselves. Their ideas and spirit transcend their physical bodies — they are eternal in meaning, even if not in form.</div><div class="disc-a">Participant: "Does doing good require recognition to be valid?"</div><div class="disc-a">Participant: No — a good action is still good even if no one acknowledges it. Even self-recognition can become a seed of arrogance. The ideal is to act without expectation of reward or acknowledgment.</div><div class="disc-a">Participant: "What is Wuming, and how does it relate to self-cultivation?"</div><div class="disc-a">Participant: Wuming literally means "no brightness" or "no clarity" — it is a state of blindness, like being lost in a maze. It is the root of frustration and conflict. Self-cultivation begins with recognizing this blindness within oneself and working to achieve clarity, just as one must wash a dish clean before using it again.</div><div class="disc-sh">Topic 3: Applying the Teachings — Giving, Compassion, and Helping Others</div><div class="disc-p">The final portion of the session moved from textual study to practical application. Master Josh shared a personal reflection on a friend who was experiencing depression and recurring conflict with others. Rather than offering direct advice — which would likely trigger defensiveness — Master Josh concluded that the most effective approach was to be a good model: to demonstrate, through action, that there is another way to handle conflict. "The solution is not to give a solution," as one participant summarized. Instead, being a safe and compassionate presence allows others to observe and, in time, follow.<br>This connected back to the paradox of giving discussed throughout the session: the more one gives — whether time, energy, friendship, or compassion — the more one receives. Dom shared a personal story from her teenage years, recalling that he struggled to make friends because he was waiting to receive care rather than offering it. Once he shifted his focus to asking questions and showing genuine interest in others, friendships formed naturally. This was recognized as a lived example of the Daoist and Buddhist principle: give first, and abundance follows.<br>The session also touched on how compassion can serve as a practical tool for resolving conflict — particularly within families and among siblings. Rather than judging or arguing, approaching others with a parental compassion — loving them even when they are wrong, and gently guiding rather than confronting — was offered as a path through difficult relationships.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "How can we help someone who always ends up in conflict with others, but doesn't believe they are at fault?"</div><div class="disc-a">Participant: Direct advice often activates their defense mechanisms. A more effective approach is to be a good model — to demonstrate through your own behavior that there is another way. The solution is not to give a solution, but to be a living example.</div><div class="disc-a">Participant: "How do we charge our mental energy when we feel depleted?"</div><div class="disc-a">Participant: Giving more, helping others, spending time in service — generates more energy rather than depleting it. Like a phone that wastes battery by sitting idle, the mind loses energy through withdrawal. Giving and connecting recharges it.</div><div class="disc-a">Participant: "What is the solution to Wuming — how do we overcome our own blindness?"</div><div class="disc-a">Participant: By reading the classics, listening to the guidance of wise teachers, and cultivating compassion in each challenge we face. We cannot always see our own maze from within, but wisdom — like a God's-eye view — gives us a wider vision to find the way.</div><div class="disc-sh">Supplemental Resources</div><div class="disc-p">Genesis 2:7 (Christian Bible, Old Testament): Referenced during the discussion of the Valley Spirit — "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul." Used to illustrate cross-tradition parallels regarding the spiritual significance of the nose.<br>Guanyin Shan, New Taipei: Referenced as a visual metaphor for the Valley Spirit — the mountain's shape resembles a face lying down, with the valley corresponding to the spiritually significant location described in Chapter 6.<br>Buddhist Sutra on Lingshan: Referenced to show that the Buddha's "Spiritual Mountain" is not a physical place but an inner location — parallel to the Daoist Valley Spirit concept.</div>`

    num: 8,
    title: `Supreme Goodness is Like Water`,
    classical: `若水章`,
    english: `The highest excellence is like water. <br>The goodness of water is that it benefits all things without striving;<br> It occupies the low places that all men disdain. <br>Thus, it is very near to the Tao.<br>In dwelling, be close to the earth; <br>In the mind, be close to the depths; <br>In dealing with others, be close to kindness; <br>In speech, be close to truth; <br>In government, be close to order; <br>In business, be close to competence; <br>In action, be close to timeliness. <br>It is because he does not strive that he is free from blame.`,
    chinese: `上善若水，水善利萬物而不爭，<br>處眾人之所惡，故幾於道。<br>居善地，心善淵，與善仁，言善信，<br>正善治，事善能，動善時。夫唯不爭，故無尤。`,
    commentary: `最崇高的善就像水一樣。水善於滋養萬物而不與萬物相爭，且甘願處於眾人所厭惡的卑下之地，所以水的本性最接 近於「道」。有道的人，像水一樣隨遇而安；內心有水一樣無量而不可測的善良；能像水一樣沒有分別心，與人交 往一視同仁；像水一樣有信，說話誠實守信用；能像水調節大氣環境一樣，使社會安定；能像水有很多作用一樣， 辦事盡其所長；能像水一樣順應天時，行動則能掌握時機。正因為水具有這種不與人爭奪的特質，所以才不會招致 怨恨，也不會犯下過失。`,
    discussion: `<div class="disc-sh">知道・道學讀書會</div><div class="disc-sh">概覽</div><div class="disc-p">本次讀書會以《道德經》第八章「上善若水」為核心文本，結合佛法修行、武術精神（以李小龍為例）及運動員心理狀態，探討「最佳狀態」（心流狀態）的本質與修行意義。討論涵蓋水德七善、菩薩行的當下實踐，以及如何在日常生活中持續保持正念與最佳狀態。</div><div class="disc-sh">核心概念與理論</div><div class="disc-q">點傳師：水利萬物而不爭，處眾人之所惡，象徵最高的善德境界</div><div class="disc-p">最佳狀態（心流）：指一種無念、專注、自然流露的精神狀態，為修行所追求的核心境界</div><div class="disc-a">前賢：居善地、心善淵、與善仁、言善信、正善治、事善能、動善時</div><div class="disc-a">前賢：不強求功名，默默利益他人，不留名、不計較</div><div class="disc-p">當下即佛境：在幫助他人的當下，即是菩薩的狀態；修行的目標是隨時能進入並維持此狀態</div><div class="disc-a">前賢：透過閱讀經典、反覆聆聽、實際應用，將修行融入日常生活</div><div class="disc-sh">重要提問</div><div class="disc-p">什麼是「最佳狀態」？如何定義並進入這種狀態？<br>水德如何對應修行中的無我與利他精神？<br>職業運動員與修行者在追求最佳狀態上有何共通之處？<br>成佛是否遙不可及？如何在日常中逐步實踐？<br>候選人（修行者）應如何在備課與生活中維持最佳狀態？</div><div class="disc-sh">重點摘要與學習目標</div><div class="disc-p">《道德經》第八章以水為喻，說明最高善德的特質：利萬物、不爭、處低位<br>水德七善涵蓋居所、心性、交往、言語、治理、行事、時機七個面向<br>李小龍的武術修煉與心理訓練，印證了修行中「無念專注」的境界<br>職業運動員（如大谷翔平）的訓練哲學與修行者追求最佳狀態的精神高度一致<br>妙善公主（觀世音菩薩前身）的故事，示範了在極端逆境中仍保持無我利他的菩薩行<br>修行的目標不是達到某個終點，而是隨時能進入並延長最佳狀態的時間<br>候選人（修行者）應透過認真閱讀經典、聆聽法音、將道理應用於生活，持續精進</div><div class="disc-sh">主題一：上善若水——《道德經》第八章解析</div><div class="disc-p">《道德經》第八章以水為最高善德的象徵。水滋養萬物卻不居功，甘願流向眾人不願去的低窪之處，因此「幾於道」。討論中逐一解析水德七善：</div><div class="disc-a">前賢：水甘處低下，象徵修行者不挑剔環境，隨遇而安</div><div class="disc-a">前賢：水深不可測，象徵心性深厚、蘊藏豐富能量</div><div class="disc-a">前賢：水滋養萬物不分彼此，無偏見、無歧視</div><div class="disc-a">前賢：水依節氣準時循環，象徵言出必行、守信可靠</div><div class="disc-a">前賢：水作為溶劑與媒介，能協調萬物，象徵政治上的協調藝術——不強求唯一正確答案，而是尋求各方可接受的平衡</div><div class="disc-a">前賢：水能量巨大，比熱容高，默默承載並轉化能量</div><div class="disc-a">前賢：水依二十四節氣準時運行，象徵行動合乎時機</div><div class="disc-p">討論特別強調，水從不主動宣揚自己的貢獻——就如同茶杯中超過九成是水，卻沒有人說「我在喝水」，而是說「我在喝烏龍茶」。這正是無為不爭的最佳寫照。</div><div class="disc-sh">相關問答</div><div class="disc-q">問：水「不爭」的精神如何在現實生活中體現？</div><div class="disc-a">答：以茶為例，一杯烏龍茶中超過九成是水，但人們只說喝茶，不提水的貢獻。水默默佔據最大比例，卻從不爭功，這正是修行者應學習的無我精神。</div><div class="disc-q">問：「正善治」中的水德如何對應政治或領導？</div><div class="disc-a">答：政治是一門協調的藝術，沒有絕對正確的答案。水作為溶劑，能融合各種物質，象徵領導者應以協調為核心，而非堅持己見，尋求各方都能接受的結果。</div><div class="disc-sh">主題二：最佳狀態——李小龍、運動員與修行的共通境界</div><div class="disc-p">討論以李小龍的訪談為引子，說明武術家在對戰時必須進入完全無念的專注狀態。當對手出拳時，若還在思考「我應該閃開」，早已被打中；真正的反應是純粹的當下反應，沒有任何多餘的念頭。<br>這種狀態與修行中的「最佳狀態」高度吻合：<br>李小龍的訓練：不僅鍛鍊體能與技術，更著重心理訓練。他要求自己不說負面的話，因為身體無法分辨是真實還是想像，負面語言會在潛意識中留下自我懷疑的印記<br>大谷翔平的修煉：每天比所有人更早到球場練習，連睡眠都視為訓練的一部分（肌肉恢復）。他的職業生涯與修行已融為一體，沒有分別<br>偶像練習生的例子：每天練習唱歌跳舞，不是為了某個目標，而是持續保持在最佳狀態中<br>修行的對應：當我們在幫助他人、行菩薩道的當下，那個瞬間就是佛的狀態。修行的目標是讓這種狀態越來越長、越來越穩定<br>討論也指出，許多人在修行中容易犯的錯誤是：追求某個「到達的境界」，而非專注於當下的狀態本身。</div><div class="disc-sh">相關問答</div><div class="disc-q">問：最佳狀態是什麼感覺？</div><div class="disc-a">答（筠欣）：就像睡著的感覺——什麼都沒有，但又什麼都有。是一種從心出發、自然而然去做事的狀態，沒有刻意，沒有雜念。</div><div class="disc-q">問：如何在面對強大對手或逆境時維持最佳狀態？</div><div class="disc-a">答：以打羽毛球為例，若上場前就想著「對手太強，我一定輸」，注意力已經分散，最佳狀態根本無從建立。真正的專注是每一球都全力以赴，不去想比分或結果。李小龍能接住飛箭，正是因為他在那一刻完全無我，沒有恐懼，沒有雜念。</div><div class="disc-sh">主題三：妙善公主的故事——逆境中的菩薩行</div><div class="disc-p">討論引用觀世音菩薩前身妙善公主的故事，作為在極端逆境中實踐無我利他的具體示範：<br>妙善公主向父王請求出家，父王不允，將她送往寺廟，期望艱苦的勞役能讓她打退堂鼓<br>公主在寺廟中不僅毫無怨言，甚至利用空閒時間靜修，令父王更加憤怒<br>最終父王下令焚燒寺廟，公主被鎖在其中，面臨生死關頭<br>在那一刻，公主沒有任何怨恨或自憐，只想到寺廟中其他人的安危，立即跪地祈禱：「若要燒，就燒我一人，不要傷害其他人」<br>最終寺廟被燒毀，一隻白虎出現，帶走了公主<br>這個故事的核心在於：在最危急的當下，公主的心中沒有「我」，只有對他人的關懷。這正是最佳狀態與菩薩行的最高示範——不是刻意為之，而是自然流露。</div><div class="disc-sh">相關問答</div><div class="disc-q">問：若換作是我們，在被鎖在燃燒的寺廟中，心中會有什麼念頭？</div><div class="disc-a">答：大多數人第一個念頭可能是「我只是想修行，為什麼要這樣對我？」或是怨恨父親。但妙善公主在那一刻完全沒有這些念頭，只想到他人的安危。這說明她已達到真正的無我境界，當下即是菩薩的狀態。</div><div class="disc-sh">主題四：修道人的修行實踐——如何維持最佳狀態</div><div class="disc-p">討論最後聚焦於修道人在日常生活中如何具體維持最佳狀態：</div><div class="disc-sh">閱讀與備課</div><div class="disc-p">認真閱讀經典，不只是快速瀏覽，而是細細咀嚼每一個字<br>同時閱讀多部經典，相互對照，加深理解<br>重複聆聽法音、講座錄音，讓道理深入潛意識</div><div class="disc-sh">心理訓練</div><div class="disc-p">不說負面的話，不在心中留下負面印記（呼應李小龍的訓練哲學）<br>遇到衝突或不如意時，先反觀自己，而非評判對錯<br>將每一次的挫折與逆境視為修行的機會</div><div class="disc-sh">實際應用</div><div class="disc-p">將經典中的道理應用於當天的生活經驗與人際互動<br>在道場中，向那些默默付出、自然流露善德的長輩學習（如道場中的阿姨、奶奶們）<br>保持「我要幫助他人、普渡眾生」的發心，讓這個念頭成為自然狀態<br>討論也強調，成佛並不遙遠——每一個當下幫助他人的瞬間，就是佛的狀態。修行的進步不是跳躍式的，而是讓最佳狀態的時間越來越長、越來越穩定。</div><div class="disc-sh">相關問答</div><div class="disc-q">問：成佛是否遙不可及？</div><div class="disc-a">答：其實一點都不遠。每當我們在幫助他人的當下，那個瞬間就是佛的狀態。修行就是讓這種狀態持續更長的時間，從幾秒鐘到幾分鐘，再到更長。方向是清楚的，路也是清楚的，只需要持續走下去。</div>`,
    en_discussion: `<div class="disc-sh">Class 9: Aligning with the Essence of Water — Mastering Non-Striving and Integrity in Modern Life</div><div class="disc-p">Embodying the formless, non-striving virtue that flows with the present, widening the mind to accept all experiences with depth, and purifying the heart-mind to restore absolute honesty with oneself.</div><div class="disc-sh">Guang Ming Advanced Academy</div><div class="disc-sh">July 1, 2026</div><div class="disc-sh">Overview</div><div class="disc-p">This session focuses on Chapter 8 of the Tao Te Ching, which uses water as a central metaphor for the highest form of virtue and the nature of the Tao. The content explores the connections between Taoist and Buddhist philosophy, leadership, daily life, and modern culture.</div><div class="disc-sh">Key Concepts or Theories</div><div class="disc-p">Water as the highest virtue (上善若水): Water benefits all things without striving, occupies low places others disdain, and is thus closest to the Tao.<br>Wu Wei (Non-striving): Acting without seeking recognition or reward; doing what needs to be done without attachment to outcomes.</div><div class="disc-q">Master: Described as the ultimate truth, the holy principle, and the natural order underlying all existence.</div><div class="disc-p">Non-attachment: Releasing attachment to recognition, desire, anger, and ignorance in order to act freely and purely.<br>The Three Poisons (Buddhism): Greed, anger, and ignorance are identified as obstacles to clarity and virtuous action, paralleled in Taoist thought.<br>Sincerity (Xin): Being true to oneself as the foundation of being true to others; loyalty of the heart-mind.<br>Leadership through selflessness: A good leader, like water, gives others the stage and supports without seeking the spotlight.</div><div class="disc-sh">Important Questions Raised</div><div class="disc-p">Why does water serve as the best metaphor for the Tao and for the highest virtue?<br>What does it mean to "occupy the low places" in one's own life?<br>How can we act with timeliness — choosing the right moment — while also acting with the immediacy and flow of water?<br>What does it truly mean to be sincere, and how does sincerity toward oneself relate to sincerity toward others?</div><div class="disc-sh">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Chapter 8 of the Tao Te Ching teaches that the highest virtue resembles water: it benefits all things, does not strive, and occupies the lowest places without complaint.<br>Water is a metaphor for the Tao itself — formless, selfless, adaptive, and essential to all life.<br>True leadership means supporting others without seeking recognition, like water that sustains a flower without claiming credit for its bloom.<br>Sincerity begins with honesty toward oneself; only then can one be genuinely truthful with others.<br>The concept of Xin (信) encompasses belief, faith, loyalty, and being true to one's word.<br>Timeliness in action means recognizing the right moment, yet water teaches that acting in the present — without hesitation — is itself a form of wisdom.</div><div class="disc-sh">Topic 1: Water as the Highest Virtue — Introduction to Chapter 8</div><div class="disc-p">Chapter 8 of the Tao Te Ching opens with the declaration: "The highest excellence is like water." Water is foundational to all life — comprising approximately 70% of the human body and covering much of the earth — yet it is rarely acknowledged for its role. It does not strive, does not compete, and willingly goes to the lowest, most undesirable places.<br>Water follows the path of least resistance, always moving toward the lowest point, never resisting gravity or circumstance. This embodies the Taoist ideal of wu wei — effortless, non-striving action. This metaphor directly inspired Bruce Lee's famous saying, "Be water, my friend."<br>The power of water lies not in force but in persistence and adaptability. Even diamonds can be cut by a focused jet of water, illustrating that apparent softness and humility can achieve what brute strength cannot.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "What does it mean that water 'occupies the low places that all men disdain'?"</div><div class="disc-a">Participant: This represents a willingness to go where others refuse — dirty places, undesirable tasks, forgotten roles. This is a supreme virtue: doing what needs to be done without concern for status or recognition.</div><div class="disc-a">Participant: "Is water a metaphor for the Tao itself?"</div><div class="disc-a">Participant: Water and the Tao share the same core qualities: formless, selfless, essential, and present everywhere without demanding acknowledgment.</div><div class="disc-sh">Topic 2: Selflessness, Recognition, and Leadership</div><div class="disc-p">A central theme of Chapter 8 is acting without seeking recognition, which is highly visible in temple volunteer communities. At summer camps, children remember the teachers who stood on stage, but the dozens of volunteers who cooked, organized, and prepared behind the scenes are rarely acknowledged. Like water in a cup of coffee — present in the greatest proportion yet unnamed — these volunteers embody the spirit of the text.</div><div class="disc-p">According to Lao Zi, a good leader gives others the stage rather than occupying it themselves. A leader who seeks the spotlight, craves recognition, or prioritizes personal comfort is, by this standard, a poor leader. This metaphor extends to teachers and parents: they are like water, nurturing students or children — the flowers — without changing their essential nature, simply providing the conditions for growth.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "What makes a good leader according to Lao Zi?"</div><div class="disc-a">Participant: A good leader acts like water — supporting others, contributing without seeking credit, and creating conditions for others to flourish. A leader who chases recognition or personal glory will ultimately cause harm.</div><div class="disc-a">Participant: "How does the coffee metaphor illustrate water's role?"</div><div class="disc-a">Participant: A cup of coffee may be 90% water, yet we call it coffee and forget the water entirely. Water supports the whole without demanding acknowledgment — this is the model for selfless service.</div><div class="disc-sh">Topic 3: The Six Qualities of Water Applied to Life</div><div class="disc-p">Chapter 8 presents a series of paired principles describing how the qualities of water apply to different domains of life:<br>In dwelling, be close to the earth: This means choosing an environment that nourishes growth, staying connected to nature and community, and recognizing that water itself has no preference — it goes wherever it is needed, without judging a place as good or bad.<br>In the mind, be close to depth: The ocean serves as a model — it accepts everything that rivers bring to it, just as a deep and open mind accepts all experiences without resistance. The Chinese phrase 江海之所以為百谷王 — the ocean is the king of all valleys — illustrates that greatness comes from accepting what others reject.<br>In dealing with others, be close to kindness: Water supports everything it touches without changing it or demanding anything in return. Teachers, parents, and volunteers serve as human examples of this quality.<br>In speech, be close to truth (Xin/信): The word Xin encompasses belief, faith, loyalty, and the keeping of promises. Being true to one's word begins with being honest with oneself.<br>In government, be close to order: Identified as the natural purpose of governance — to bring order, as water naturally brings life and structure to the land.<br>In action, be close to timeliness: Water acts immediately and continuously — it does not wait for the perfect moment but moves always in the present. When water encounters a depression or hole in the riverbed, it does not stop but fills the gap and continues forward.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: "Does timeliness mean waiting for the right moment, or acting now?"</div><div class="disc-a">Participant: Water teaches both. It acts immediately and without hesitation, yet its movement is always appropriate to the conditions.</div><div class="disc-a">Participant: "What does 'in dwelling, be close to the earth' mean?"</div><div class="disc-a">Participant: There are two main interpretations — one practical, which means living close to one's community and necessities, and one philosophical, which means staying connected to nature and the environment. Furthermore, from water's perspective, there is no good or bad place; water simply goes where it is needed.</div><div class="disc-sh">Topic 4: Non-Attachment, the Three Poisons, and Freedom from Striving</div><div class="disc-p">The closing lines of Chapter 8 state: "It is because he does not strive that he is free from blame." This connects to the broader Taoist concept of bu zheng — non-competition — and to Buddhist teachings on the Three Poisons: greed, anger, and ignorance.</div><div class="disc-p">This philosophy offers a critical view on the pressures of Asian educational culture, where studying is often treated as the only valid path, and failure to succeed along that single route is experienced as total loss. The Taoist response is not to abandon effort, but to release the grip — to open the hand, let go of attachment to one particular outcome, and remain open to other paths and solutions.</div><div class="disc-p">Being attached to a solution that is not working does not solve the problem. Like water filling a hole in a riverbed without complaint or hesitation, the ideal is to keep moving, keep trying, without being weighed down by past failures or the need for external validation.</div><div class="disc-p">Furthermore, Master Mavis emphasized that sincerity and being true to oneself is the foundation of being true to others. The true self is not the constructed self-image, but the deeper, honest inner voice. When one is loyal to that inner truth, genuine relationships and genuine speech naturally follow.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: " Does non-competition mean that one should stop striving or working hard?"</div><div class="disc-a">Participant: Non-competition is not a call to lie flat or abandon effort. Instead, it challenges us to examine the underlying motive of our striving. It means releasing our attachment to external validation, social comparison, and fixed outcomes, thereby transforming our effort into something that is clear, free from anxiety, and truly sustainable.</div><div class="disc-a">Participant: "What is sincerity, according to Confucius and Taoist thought?"</div><div class="disc-a">Participant: Sincerity means refusing to lie to oneself. When a person maintains absolute honesty within their own mind and heart, that inner truth naturally and effortlessly extends to their outward words and actions toward others.</div><div class="disc-a">Participant: "How do the Three Poisons of Buddhism relate to the water metaphor?"</div><div class="disc-a">Participant: Water is entirely free from greed, anger, and ignorance; it simply flows and acts according to its true nature. The Taoist and Buddhist traditions converge on this point, showing that by removing these three poisons, a person can act with the same purity, adaptability, and freedom as water.</div>`

    num: 9,
    title: `Knowing When Enough Is Enough`,
    classical: `持盈章`,
    english: `A cup filled to the brim is easily spilled. Rather than always trying to have more, it is wiser to know when enough is enough.<br>Sharpen a blade too much, and it will become dull or even break. When something is pushed to its extreme, it cannot last.<br>A house overflowing with gold and jade cannot be guarded forever. Great wealth often attracts thieves. <br>Likewise, those who become arrogant because of wealth and honor bring trouble upon themselves.<br>When your work is accomplished and your reputation is established, step aside without clinging to power or seeking recognition. This is the Tao of Heaven.<br>`,
    chinese: `持而盈之，不如其已；揣而銳之，不可長保。<br>金玉滿堂，莫之能守；富貴而驕，自遺其咎。<br>功遂身退，天之道。`,
    commentary: `水杯裝得太滿容易溢出。與其追求過度飽滿，不如適可而止。將將刀刃磨得過於鋒利，反而容易捲刃斷裂，鋒芒太露難以長久保持。錢財多到屋子裝不下，往往招來盜賊，無法長久守住；若因富貴而驕傲自大，就會替自己招來災禍與過錯。：功成名就後選擇退隱，不貪戀權位，這才是符合自然運行的客觀法則。`,
    discussion: `<div class="disc-sh">知道・道學讀書會</div><div class="disc-sh">重點摘要</div><div class="disc-p">本次讀書會以《大學》八條目（格物、致知、誠意、正心、修身、齊家、治國、平天下）為核心，深入探討內在修養與外在行動的關係。<br>討論「無功德」的概念：行善後不執著於功德，才能保持初心，否則動機改變後功德即消失。<br>探討「功遂身退」的精神：事情做完後放下，不留戀結果，如同揮一揮衣袖不帶走一片雲彩。<br>以「碗」為喻，說明內心若積累過多執念（無論好壞），將難以容納新的善念與成長。<br>討論「坤卦」的包容與承載精神：真正的包容是不分好壞地接納萬物，並給予平台讓人發揮。<br>分享外語教學（創辦華語班、英語班）的實際經驗，呼應「無功德」與「借力」的道理。</div><div class="disc-sh">《大學》八條目的架構與內在修養</div><div class="disc-p">瑋揚介紹《大學》八條目的整體架構，重點說明後半段（誠意、正心、修身、齊家、治國、平天下）皆從內在出發。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：八條目中，格物、致知、誠意、正心、修身屬於內在工夫；自我認識是致良知，恢復良知是克己，誠意是不自欺，修身是改變自身行為，進而影響他人、齊家、治國、平天下。</div><div class="disc-q">點傳師：八條目中沒有任何一條是關於「說話」的，真理不是用嘴說出來的，而是用行動示現的。</div><div class="disc-sh">誠意、正心、修身的深入解釋</div><div class="disc-a">前賢：不自欺,真實面對內心的各種念頭,包括榮譽感、慾望、被冒犯的情緒等,不逃避也不否認</div><div class="disc-a">前賢：在看清內心的念頭後,調整內心狀態,清除內心的「霧」,讓心保持清明</div><div class="disc-a">前賢：在內心調整後,自然改變外在行為,成為他人的榜樣,用行動而非言語影響他人</div><div class="disc-sh">「揣而銳之，不可常保」——現代人的保護邊界與人際傷害</div><div class="disc-p">瑋揚引用《道德經》第九章「揣而銳之，不可常保」，討論現代人「保護自己」的邊界感問題。現代人保護自己並沒有惡意，但這種邊界感讓人只在乎自己，無意間卻傷害了人與人之間的關係。</div><div class="disc-sh">老師被告的故事——四方皆輸的困局</div><div class="disc-p">瑋揚分享了一個老師被學生家長提出告訴的真實案例。老師最後丟了工作，身心俱疲，甚至得了癌症。這個故事中涉及四個角色：學校、家長、老師、學生，彼此都沒有惡意，也都只是想要保護自己，但最後卻導致全盤皆輸的局面。</div><div class="disc-sh">四個角色的立場分析</div><div class="disc-a">前賢：為了保護學校聲譽與避免法律風險，選擇站在中立或保守立場，未能全力支持老師，最終失去了一位優秀的教師</div><div class="disc-a">前賢：為了保護孩子的權益，選擇提出告訴，但過程中也承受了壓力與社會輿論，親子關係與社區關係也受到影響</div><div class="disc-a">前賢：為了證明自己的清白，耗費了大量時間與精力打官司，最終雖然贏了，但失去了工作、健康與對教育的熱情</div><div class="disc-a">前賢：夾在家長、老師、學校之間，成為事件的中心卻無能為力，失去了師生關係的信任與學習的單純環境</div><div class="disc-q">點傳師：這個故事說明，當每個人都只想著「保護自己」、築起邊界時，最終沒有人是贏家。人與人之間的信任與連結被破壞，所有人都付出了代價。</div><div class="disc-sh">逆境與順境的修煉——逆忍與順忍</div><div class="disc-a">前賢：面對逆境時保持清醒。逆境總是伴隨著痛苦,就如同牙痛,我們根本無法忽視,因此能夠把問題看得清楚,努力讓自己不要迷失</div><div class="disc-a">前賢：面對順境時仍能保持警覺。順境總能讓自己沉浸其中而不自知,就像成功、獲得榮耀之後總是迷失自我的開始,就像每天喝含糖飲料卻不知道自己已經得了糖尿病。順境還能忍,這才是更深一層的功夫</div><div class="disc-q">點傳師：「國」與「天下」的概念在古代並無明確國界之分，「國」類似今日的城市，「天下」則是無邊界的整體，君王從身邊的人開始照顧，遠方的人自然也會嚮往歸附。</div><div class="disc-sh">結論</div><div class="disc-p">修養工夫必須由內而外，從誠意、正心開始，才能真正影響外在世界。<br>八條目的實踐不在言語，而在真實的內心與行動。</div><div class="disc-sh">「碗」的比喻：清空內心的執念</div><div class="disc-p">以洗碗為喻，說明內心若積累過多執念，將失去容納善念的空間。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：碗若不洗乾淨，殘留的東西會越積越多；內心也是如此，若不清空對成敗的執念，久而久之將難以信任自己的善心。</div><div class="disc-q">點傳師：我們常常把做過的好事、壞事都留在心裡，無論是驕傲還是懊悔，都是一種積累，讓內心越來越沉重。</div><div class="disc-q">點傳師：無論是做了好事後的驕傲感,還是做錯事後的懊悔感,這些都像碗裡的殘渣一樣,不斷積累在內心。久而久之,內心會變得越來越沉重,甚至開始不信任自己的善心,懷疑自己行善的動機</div><div class="disc-sh">結論</div><div class="disc-p">應定期清空內心的執念，保持內心的清淨，才能持續行善。</div><div class="disc-sh">泰國 TED 演講的啟示：生活的複雜性是自找的</div><div class="disc-p">瑋揚分享一段泰國人的 TED 演講，反思現代人追求世俗成功的盲點。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：演講者來自泰國北部農村，原本生活簡單快樂，後來有人從城市回來說大家都太窮了，於是村民紛紛前往曼谷追求成功。</div><div class="disc-q">點傳師：演講者在曼谷待了幾年後回到農村，發現曼谷的人花了三十年才還清房貸，而農村的人三個月就能自己蓋好一棟房子。</div><div class="disc-q">點傳師：具體對比——曼谷的人需要花三十年的時間才能還清房貸買到一棟房子,而農村的人只需要三個月就能自己動手蓋好一棟房子。到底誰比較富有?誰的生活比較自由?這個對比讓人深思</div><div class="disc-q">點傳師：演講者感嘆,城市人「賺了錢,花了錢,什麼都沒留下」,生活本來很簡單,是我們自己為了符合社會期待而讓它變得複雜</div><div class="disc-q">點傳師：生活本來很簡單，是我們自己讓它變得複雜，為了符合社會期待而拼命賺錢，最後卻感到空虛。</div><div class="disc-sh">結論</div><div class="disc-p">應看清哪些目標是真正值得追求的，而非盲目跟隨世俗標準。<br>財富的積累若只是為了炫耀或符合期待，最終只會帶來疲憊與空虛。</div><div class="disc-sh">「富不過三代」的反思</div><div class="disc-p">以「富不過三代」為例，說明財富與德行的關係。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：第一代創業者深知賺錢不易，因此珍惜節儉；但財富傳到後代，後代不了解財富得來的艱辛，便容易揮霍殆盡。</div><div class="disc-q">點傳師：財富的消逝不只是金錢問題，更是德行與初心的流失。</div><div class="disc-sh">結論</div><div class="disc-p">財富能否延續，關鍵在於是否保有創業時的初心與德行。</div><div class="disc-sh">「功遂身退」精神：做完即放下</div><div class="disc-p">以「公退」（退藏於密）為主題，說明完成事情後應立即放下，不留戀結果。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：「功遂身退」意指事情做完後就離開，不帶走任何東西，如同揮一揮衣袖不帶走一片雲彩。</div><div class="disc-q">點傳師：以棒球為喻，打完一棒就是打完了，不應在下一棒時還在回想上一棒打得好不好，否則會分心出錯。</div><div class="disc-q">點傳師：棒球比喻的完整說明——打擊者上場打完一棒後,無論結果好壞(全壘打或三振),都應該立即放下。如果下一棒上場時還在回想上一棒打得如何,就會分心而影響表現。每一棒都是新的開始,專注當下才是關鍵</div><div class="disc-q">點傳師：以辦活動為例，活動結束後立刻去放下心中對成果的看法，馬上面對下一件事，不需要沉浸在成功或失敗的情緒中。</div><div class="disc-sh">結論</div><div class="disc-p">「功遂身退」是一種稅後生活（無功德的生活），做完即放下，不讓自己困在過去的成敗中。<br>真正活在當下，才能持續面對新的挑戰。</div><div class="disc-sh">「無功德」與不執著於成果</div><div class="disc-p">討論行善後不應執著於功德的重要性，以及一旦動機改變，功德便消失的道理。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：以前的副領導會提醒後學「無功無德」，意思是做了很多事，但不應覺得自己有功勞。</div><div class="disc-q">點傳師：若開始為了累積功德而行善，初心已變，功德便不復存在。</div><div class="disc-a">前賢：認同此說法，指出一旦開始計算功德，行動的出發點就已不同，原本的初心也隨之改變。</div><div class="disc-q">點傳師：以佛堂為例，許多人在不知不覺中獲得了幫助與資源，這些都是「無形的功德」，不應自居其功。</div><div class="disc-q">點傳師：在佛堂服務的例子——許多人在佛堂獲得了心靈上的安慰、人際關係的支持、甚至實際的幫助與資源,但這些都是在不知不覺中發生的。提供幫助的人不應自居其功,因為這些都是「無形的功德」,是整個道場集體的力量,而非個人的成就</div><div class="disc-sh">外語教學經驗與「借力」的體現</div><div class="disc-q">點傳師：佛堂接待許多外國人，開設了普通話班，後來也開始提供英語課程。</div><div class="disc-q">點傳師：自己英語能力有限，上課前非常緊張，擔心無法用簡單英語解釋《道德經》的深奧概念。</div><div class="disc-q">點傳師：上課當天，因為對《道德經》本身非常熟悉，講解時反而非常流暢，讓自己也感到驚訝，深感是師父與集體力量的加持。</div><div class="disc-q">點傳師：這個平台是大家共同努力創造的，不是任何一個人的功勞，這正是「無功德」與「借力」的最佳體現。</div><div class="disc-sh">結論</div><div class="disc-p">行善的動機若摻雜了對功德的期待，功德即消失。<br>真正的善行是出於本心，做完即放下，不計回報。<br>個人能力有限，但借助集體的力量與信念，可以完成超越自身能力的事。<br>成果不應歸功於個人，而應感恩整個支持系統。</div><div class="disc-sh">「坤卦」的包容與承載精神</div><div class="disc-p">以《易經》坤卦為主題，說明真正的包容是不分好壞地接納萬物，並給予平台讓人發揮。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：坤卦代表大地，處於天地之間最低的位置，卻能承載萬物，這是天地之德。</div><div class="disc-q">點傳師：「包容」與「承載」是兩個不同的概念：包容是不分好壞地接納，承載是給予平台讓人發揮、帶領大家前進。</div><div class="disc-sh">包容與承載的具體差異</div><div class="disc-a">前賢：就像「吞下去」,不論好壞都接受,不做評判,讓事物自然存在。例如看到孩子做了不好的事,包容是不立即評判對錯,而是接納這個事實</div><div class="disc-a">前賢：就像「給他空間」,主動提供平台與機會,讓對方發揮潛能並成長。例如看到孩子犯錯後,承載是給他機會改正、學習,並協助他成長</div><div class="disc-q">點傳師：承載就像地鐵或火車,承載著每一位乘客前往他們各自的目的地,提供平台讓大家實現各自的目標</div><div class="disc-q">點傳師：《道德經》第二章說，當我們說某件事「美」，就已經在貶低其他事物；真正的包容是不做好壞之分，讓萬物自然存在。</div><div class="disc-q">點傳師：以家中孩子為例，孩子做了好事給讚，打架也不過度懲罰，在眼中沒有絕對的好壞，這就是包容，。</div><div class="disc-q">點傳師：只有具備深厚德行的人，才能去乘載萬物，讓萬物一起變好，而不是盲目的包容。</div><div class="disc-sh">結論</div><div class="disc-p">真正的包容不是縱容，而是在不分好壞的前提下，給予每個人成長的空間。<br>承載是一種積極的力量，帶領眾人走向更好的方向，而非被動地接受一切。</div>`,
    en_discussion: `<div class="disc-sh">Class 10: Finding Balance in Knowing Enough — Releasing Attachment and Seeking Inner Validation in Modern Life</div><div class="disc-p">Exploring the wisdom of moderation and stepping back within, deconstructing the traps of arrogance and external approval, and cultivating inner clarity to restore true contentment.</div><div class="disc-sh">Guang Ming Advanced Academy</div><div class="disc-sh">July 8, 2026</div><div class="disc-sh">Overview</div><div class="disc-p">This session is part of the Guang Ming Advanced Academy English class. The class focused on Chapter 9 of the Tao Te Ching, titled "Knowing When Enough Is Enough," exploring themes of moderation, balance, humility, and the dangers of arrogance and excessive desire for recognition. Participants read and discussed the chapter's key passages in English, connecting ancient Taoist wisdom to personal life experiences and contemporary challenges.</div><div class="disc-sh">Key Concepts or Theories</div><div class="disc-p">Moderation and Balance: The central teaching that overextending in any area of life, such as work, wealth, or ambition, leads to loss of balance and eventual harm.<br>Non-attachment to Recognition: The Taoist principle of acting with pure intention, without seeking approval or acknowledgment from others.</div><div class="disc-q">Master: The importance of acknowledging others' contributions and not allowing arrogance to erode relationships.</div><div class="disc-p">Kindness as Foundation: Drawing from Chapter 8, "Supreme Goodness Is Like Water," the idea that kindness, rather than transactional exchange, must be the basis of all relationships.</div><div class="disc-sh">Important Questions Raised</div><div class="disc-p">How do we know when we have "enough" in our careers, relationships, and personal ambitions?<br>How do we balance doing our best with not becoming overly attached to outcomes or recognition?<br>Can relationships built on transactional motives ever be truly lasting?<br>How do we cultivate inner approval so that we do not depend on external validation?</div><div class="disc-sh">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Chapter 9 of the Tao Te Ching teaches that pushing anything to its extreme — wealth, ambition, sharpness — causes it to break down or become unsustainable.<br>Seeking recognition from others as a primary motivation undermines the purity of one's actions and leads to exhaustion and unhappiness.<br>Kindness, not transaction, must be the foundation of genuine human relationships.<br>Doing one's best while releasing attachment to results is a key Taoist practice, though finding that balance requires ongoing cultivation of wisdom.<br>Personal stories shared during the session illustrated how losing work-life balance and craving external validation can negatively impact health, family, and spiritual growth.</div><div class="disc-sh">Topic 1: Moderation and the Danger of Excess</div><div class="disc-p">Chapter 9 opens with the image of a cup filled to the brim, which is easily spilled if carried. This metaphor sets the tone for the entire chapter: more is not always better, and knowing when to stop is a form of wisdom. In everyday life, including work schedules, financial ambition, and personal relationships, losing sight of moderation when one thing becomes the singular focus destroys overall balance.</div><div class="disc-q">Master Erica shared a personal experience of working at Medtronic, a leading global medical device company, where the demands of the job led to working until 9:30 PM, skipping meals, gaining weight, and losing time with family. Despite the higher salary and career advancement, the cost to personal well-being and relationships was significant. After approximately six months of struggle, she ultimately resigned, recognizing that the salary was not worth the loss of balance and quality of life.</div><div class="disc-p">The second key image of the chapter reinforces this point, showing that a blade sharpened too much becomes dull or breaks. Overworking, over-earning, or over-striving in any domain eventually leads to diminishing returns and personal damage.</div><div class="disc-sh">Topic 2: Arrogance, Wealth, and the Attraction of "Thieves"</div><div class="disc-p">The chapter states: "A house overflowing with gold and jade cannot be guarded forever. Great wealth often attracts thieves. Likewise, those who become arrogant because of wealth and honor bring trouble upon themselves."<br>The concept of "great wealth" is not limited to money, as it can also refer to status, ego, or an inflated sense of self-worth. When a person projects superiority over others, they attract resentment, competition, and people who seek to take advantage of them. Arrogance also erodes the kindness that forms the foundation of good relationships, causing others to keep their distance.<br>Arrogance naturally creates comparison and competition, which in turn generates unhappiness. This builds on prior insights noting that competition almost universally leads to dissatisfaction. The key insight from Lao Tzu is that the problem is not wealth or honor itself, but the arrogance that can arise from it.<br>Furthermore, the principle that "no man is an island" underscores that any achievement is built on the support of others, and forgetting this leads to a distorted and ultimately fragile sense of self.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: Does "great wealth attracting thieves" only refer to money?</div><div class="disc-a">Participant: No, it also refers to ego and pride. If someone constantly projects superiority, others may take advantage of them, resent them, or simply withdraw. The real danger is arrogance, not wealth itself.</div><div class="disc-a">Participant: What happens when arrogance replaces kindness in a team or relationship?</div><div class="disc-a">Participant: Friendships and working relationships deteriorate. People stop wanting to collaborate, and the arrogant person eventually finds themselves without support when they need it most.</div><div class="disc-sh">Topic 3: Recognition, Approval, and Inner Validation</div><div class="disc-p">The final passage of Chapter 9, "When your work is accomplished and your reputation is established, step aside without clinging to power or seeking recognition. This is the Tao of Heaven," highlights the human tendency to seek external validation.<br>A participant shared the story of a former friend who was genuinely generous and caring, but who constantly craved acknowledgment. Every interaction felt like a demand for recognition, and when that recognition was not given, the friend became upset and distant. Over time, this created emotional distance in the friendship. The group reflected that this person's real need was not external approval, but self-approval, and that looking outward for something that can only be found inward is a form of misdirection.<br>Master Josh shared a story from a summer camp at Pingxi, where young volunteer high school and university students worked tirelessly to care for a 6-year-old girl who was younger than the intended age group and did not respond to their efforts. Despite receiving no positive feedback from the child, the volunteers gave their full effort with patience and pure hearts. At the debrief, they were affirmed by the group. Master Josh reflected that in that moment, the volunteers embodied a Bodhisattva-like purity, acting without seeking results, but acknowledged that even small moments of being ignored or unacknowledged can subtly pull us off the right path.<br>A participant also shared a workplace example: despite completing difficult and urgent projects, their manager never offered recognition, while less experienced team members received praise. Rather than allowing this to affect their performance, the participant asked themselves: "Do I really need her recognition?" The answer was no, as they knew their work was correct, and that was sufficient.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: How do we stop needing external recognition?</div><div class="disc-a">Participant: By asking ourselves honestly whether we truly need another person's approval to know our own worth. If we know we have done the right thing, external validation becomes unnecessary. The motivation for action should be genuine kindness and the desire to help, not a transaction expecting reward.</div><div class="disc-a">Participant: Is it wrong to want any feedback at all?</div><div class="disc-p">Answer (Master Josh): Not entirely, as sometimes we simply want a small acknowledgment. But when that desire for response begins to pull us away from acting with a pure heart, it becomes a problem. Lao Tzu repeatedly teaches to act and not seek results.</div><div class="disc-sh">Topic 4: Doing Your Best and Trusting the Arrangement</div><div class="disc-p">A central balance exists between personal effort and trust in a higher order or arrangement. For instance, during periods of career transition or temporary unemployment, inner peace can be found in believing that circumstances unfold as they should. Unexpected opportunities, such as short-notice international travel, demonstrate how positive outcomes arise when one is not rigidly attached to a fixed plan.<br>The principle "Do your best, and God will do the rest" requires subtle understanding. Simply sitting back and waiting for divine support without personal effort contradicts the Taoist way. The true balance lies in trying one's best while releasing attachment to outcomes, which is a practice requiring cultivated wisdom and ongoing self-reflection.<br>The opening line of the Tao Te Ching, "The Tao that can be spoken is not the eternal Tao," further illustrates that discussing wisdom theoretically is only a fragment of the whole. Learning is an incremental, lifelong process.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-a">Participant: How do we know the right balance between doing our best and not being overly attached?</div><div class="disc-a">Participant: It requires cultivated wisdom. One must do their best while continually pausing to listen to their inner voice, questioning true values and underlying motives. Balance is not a fixed formula, but an ongoing practice of self-awareness.</div>`
  },

    num: 10,
    title: `The Ease and Difficulty of Cultivating the Tao`,
    classical: `玄德章`,
    english: `Can you unite your spirit and body as one, and never let them part?<br>Can you gather your vital energy to the ultimate harmony, and be as pure and natural as a newborn babe?<br>Can you cleanse the deepest thoughts of your mind to perceive all things, and remain completely without blemish?<br>Can you love the people and govern the state, yet follow nature without arbitrary actions?<br>When your senses interact with the world and contemplate the laws of nature, can you maintain stillness and humility to embrace all like the feminine?<br>Though your wisdom reaches in all directions, can you refrain from using cunning schemes?<br>It causes all things to grow and develop,<br>Nourishing all creation yet never possessing it as its own,<br>Accomplishing all deeds yet never relying on its own capacity,<br>Being the leader of all things yet never dominating or interfering, <br>This is called the profound and deep Mystic Virtue.`,
    chinese: `載營魄抱一，能無離乎？專氣致柔，能如嬰兒乎？<br>滌除玄覽，能無疵乎？愛民治國，能無為乎？<br>天門開闔，能為雌乎？明白四達，能無知乎？<br>生之畜之，生而不有，為而不恃，長而不宰，是謂玄德。`,
    commentary: `精神與肉體合一，能做到不分離嗎？集結精氣達到極致的柔和，能像嬰兒般純真自然嗎？洗淨內心深處的雜念而觀照萬物，能做到沒有瑕疵嗎？愛護百姓與治理國家，能順應自然而不妄為嗎？感官與外界接觸、體察自然規律時，能守靜謙卑像雌性般包容嗎？智慧通達四方，能不運用心機巧詐嗎？讓萬物生長發育，生養了萬物卻不佔為己有，有所作為卻不仗恃才幹，身為萬物之長卻不主宰干涉，這就叫做深遠深厚的「玄德」。`,
    discussion: `<div class="disc-sh">知道・道學讀書會</div><div class="disc-sh">重點摘要</div><div class="disc-p">本次讀書會以《道德經》第十章為核心,探討「載營魄抱一」的概念、身心靈合一的修煉,以及柔軟之道在生活與運動中的應用。<br>討論了有條件之愛與無條件之愛的本質差異，並延伸至人際關係、家庭、因緣與修行實踐。<br>引用《大學》八條目（格物、致知、誠意、正心、修身、齊家、治國、平天下），說明修行是同步進行而非線性階段。<br>討論了讀書會未來的分享形式，包括感恩分享、自願填表等安排。</div><div class="disc-sh">討論主題</div><div class="disc-sh">《道德經》第十章「載營魄抱一」</div><div class="disc-p">瑋揚帶領複習上次未完成的內容,從第一句話「載營魄抱一」開始重新梳理其意涵——如何讓身心靈重新統合為一。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：「魄」是人的靈魂，古稱「三魂七魄」，是與生俱來存在於身體中的靈性。</div><div class="disc-q">點傳師：人在取得肉身之後，原本完整的靈性被分散至身體各部位，形成所謂的「魄」，就像粽子頂端被切斷一樣，失去了最關鍵的連結點。</div><div class="disc-q">點傳師：這無法用現代生理學完全解釋，但代表感知散布於全身各處。</div><div class="disc-sh">結論</div><div class="disc-p">「魄」是靈性分散於肉身各部位後的狀態，是人感知世界的基礎。</div><div class="disc-sh">身心靈合一與信心的關係</div><div class="disc-p">討論當身體、心靈、精神三者能夠統合時，所產生的信心與專注狀態。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：身心靈三者合一，才是真正信心的誕生，也是完全專注的狀態。</div><div class="disc-q">點傳師：心影響氣（身體），氣也影響心；兩者相互牽引，若不協調，就會出現身心分離的問題。</div><div class="disc-q">點傳師：孟子也提到相同觀點——心是你真正的表達，氣是你的存在與身體；意志集中，才能帶動身體行動；反之，身體狀態良好，也能支撐正向的意志與思維。</div><div class="disc-sh">結論</div><div class="disc-p">身心靈三者相互影響、同步運作，合一時方能達到真正的專注與信心。</div><div class="disc-sh">柔軟之道：老子的最高境界</div><div class="disc-p">以老子「守柔」的思想為核心，結合現代運動科學與實際案例加以說明。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：老子認為柔軟是最佳狀態，太極拳即是柔軟之道的體現。</div><div class="disc-q">點傳師：現代運動科學也強調柔韌性的重要性，以棒球為例，日本球員（如鈴木一朗、大谷翔平）雖身材較小，卻能在大聯盟中表現出色，關鍵在於柔軟度與全身肌肉的協調。</div><div class="disc-q">點傳師：以壘球教學為例,女生初學時因身體較柔軟,反而比男生更容易投出好球；全身肌肉協調統一,才能在瞬間爆發最大力量。</div><div class="disc-q">點傳師：在人際相處中，柔軟也代表在高壓情境下仍能保持冷靜，這是一種自我覺察與修煉的成果。</div><div class="disc-sh">結論</div><div class="disc-p">柔軟不是軟弱，而是身心協調、靈活應對的最高狀態，適用於運動、人際與修行各層面。</div><div class="disc-sh">嬰兒狀態與回歸純真</div><div class="disc-p">以嬰兒的純粹狀態為比喻，說明修行所追求的自然與真實。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：嬰兒的哭泣與笑容都是最自然、最純粹的情感表達，不帶任何目的或算計。</div><div class="disc-q">點傳師：嬰兒的微笑能讓所有人感到喜悅，正是因為那份純粹；隨著成長與社會化，這份純真逐漸消失。</div><div class="disc-q">點傳師：修行的目標之一，就是洗去後天的污染，回到如嬰兒般清明、自然的狀態。</div><div class="disc-sh">結論</div><div class="disc-p">回歸嬰兒般的純真狀態，是修行去除雜染、恢復本性的重要目標。</div><div class="disc-sh">有條件之愛與無條件之愛</div><div class="disc-p">引導學員討論愛的本質，探討人際關係中有條件與無條件之愛的差異。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：提問——愛是有條件還是無條件的？以友情、戀愛、婚姻、親子關係逐層討論。</div><div class="disc-a">前賢：因為想被愛，所以去愛，這本身就是一種條件。</div><div class="disc-a">前賢：戀愛關係中，雙方都有需求，本質上是條件的交換。</div><div class="disc-q">點傳師：所謂無條件之愛，是指無論對方如何，都持續付出；但若對方完全不回應，仍繼續愛，這才是真正的無條件，但現實中幾乎不可能。</div><div class="disc-q">點傳師：即使是父母對子女說「我無條件愛你」，話語本身也隱含了期待，因此仍帶有條件。</div><div class="disc-q">點傳師：有條件之愛有副作用——愛得越深，受傷越深，最終可能讓人不敢再愛。</div><div class="disc-q">點傳師：無條件之愛是完美的愛，沒有副作用，但在凡人之間幾乎無法實現；上帝創造這種不完美的愛，是為了讓人從小愛開始練習，逐步擴展到更大的愛。</div><div class="disc-sh">結論</div><div class="disc-p">人間之愛多為有條件之愛，帶有副作用；無條件之愛是修行的目標，需透過不斷練習才能趨近。</div><div class="disc-sh">《大學》八條目與修行的同步性</div><div class="disc-p">引用《大學》的八條目，說明修行並非線性階段，而是同步進行的過程。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：《大學》的格物、致知、誠意、正心、修身、齊家、治國、平天下，許多人讀後因第一步就做不到而放棄。</div><div class="disc-q">點傳師：以燈泡被灰塵覆蓋為比喻——燈泡是以同心圓為比喻,格物是最內圈,平天下是最外圈。燈泡本身一直在發光,只是被遮蔽；當格物做到了一點,去除了一點塵垢,露出了一點光,那麼其他七個德目就會同時亮了一點。由此說明八個德目只要從格物致知做起,修身、齊家、治國、平天下的能力都會同時提升。</div><div class="disc-q">點傳師：現代修行者如同搭飛機，古人如同走路；雖然飛行有風險，但若能善用，進步速度遠超過一步一步走。</div><div class="disc-q">點傳師：修行是各個層面同步發展，而非必須完成前一階段才能進入下一階段。</div><div class="disc-sh">結論</div><div class="disc-p">修行是同步、多維度的成長過程,八個德目以同心圓方式相互關聯,格物致知在最內圈,只要內圈進步一點,外圈各層面都會同時顯現進步。</div><div class="disc-sh">因緣、業力與人際關係</div><div class="disc-p">探討人與人之間的因緣連結，以及業力在家庭與人際關係中的體現。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：家庭關係是因緣的顯現，有些是報恩，有些是報怨，有些是財緣。</div><div class="disc-q">點傳師：因緣如同一條線，可以將人往下拉，也可以將人往上提；因此修行場所中的佛像與同修都很重要。</div><div class="disc-q">點傳師：以「給一杯水」為比喻，說明善緣的建立——今日無條件給予，未來某一世在對方需要時，緣分自然成熟。</div><div class="disc-q">點傳師：在修行道場中，與眾人結下的善緣，就是一種無條件之愛的實踐。</div><div class="disc-sh">結論</div><div class="disc-p">人際關係與家庭皆是業力因緣的顯現，透過無條件的給予可以建立善緣、化解業力。</div><div class="disc-sh">《道德經》「天門開闔」與包容之道</div><div class="disc-p">討論「天門開闔」的意涵，以及如何在紛亂的世界中保持開放與包容。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：「天門開闔」比喻開放自己的感知與良知，讓內在的孩子（良知）引導自己。</div><div class="disc-q">點傳師：如同母親保護孩子，我們也傾向關閉心門以避免受傷；但過度保護反而是一種傷害。</div><div class="disc-q">點傳師：在五濁惡世中，開放心門會遇到更多考驗，但也因此能更快成長。</div><div class="disc-q">點傳師：真正的包容是接納一切，包括不完美與傷害，仍願意保持開放。</div><div class="disc-sh">結論</div><div class="disc-p">「天門開闔」代表保持內心開放、以良知回應萬事，是修行中包容之道的體現。</div><div class="disc-sh">真誠溝通與技巧的局限</div><div class="disc-p">討論溝通技巧的有限性，以及真誠才是最根本的溝通之道。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：溝通技巧（如三明治溝通法）一旦被對方識破，效果立即消失。</div><div class="disc-q">點傳師：所有技巧終究有其局限，最終只剩下一個選擇——真誠。</div><div class="disc-q">點傳師：真誠不代表完美無缺，而是放下目的、放下自我，真正接納對方；真正的溝通是雙向的接納，而非單方面的說服。</div><div class="disc-q">點傳師：聆聽的本質是先放下自己，這也是為何讀經典如此重要。</div><div class="disc-sh">結論</div><div class="disc-p">真誠是溝通的最終核心，所有技巧都只是輔助，唯有真誠才能建立真正的連結。</div><div class="disc-sh">《道德經》「生而不有，為而不恃，長而不宰」</div><div class="disc-p">以大地之德為比喻，說明無條件給予、不求回報的聖人之道。</div><div class="disc-sh">詳細內容</div><div class="disc-q">點傳師：大地養育萬物，任人踩踏，卻從不索取；我們種什麼，它就給什麼，這是大地之德。</div><div class="disc-q">點傳師：「生而不有，為而不恃，長而不宰」——養育、幫助、成就他人，卻不佔有、不自恃、不主宰，這是最高的無條件之愛。</div><div class="disc-q">點傳師：歷史上許多偉大人物背後，往往有一位默默付出、不求名聲的偉大母親，這正是此道的體現。</div><div class="disc-q">點傳師：修行者在道場中照顧學員，也應以此精神為依歸——盡力付出，不執著於結果。</div><div class="disc-sh">結論</div><div class="disc-p">大地之德是無條件之愛的最高典範，修行者應學習這種給予而不求回報的精神。</div>`,

  {
    num: 11,
    title: `The Usefulness of "Nothingness"`,
    classical: `虛中章`,
    english: `Thirty spokes unite at the hub,<br>Yet it is on the empty space that the usefulness of the wheel depends.<br>Clay is molded to form a vessel,<br>Yet it is on the empty space inside that the usefulness of the vessel depends.<br>Doors and windows are cut to make a house,<br>Yet it is on the empty space within that the usefulness of the house depends.<br>Therefore, while "Being" brings convenience,<br>It is "Non-being" that provides the actual function.`,
    chinese: `三十輻，共一轂，當其無，有車之用。 <br>埏埴以為器，當其無，有器之用。<br>鑿戶牖以為室，當其無，有室之用。 <br>故有之以為利，無之以為用。<br>`,
    commentary: `三十根輻條匯集在一個車軸轂中心，正是因為中心留有空虛處，車輪才能轉動，發揮車子的功用。揉和陶土製作器皿，正是因為器皿中間有空虛處，才能用來盛裝東西，發揮器皿的功用。開鑿門窗建造房屋，正是因為室內留有空虛處，人才能居住其中，發揮房屋的功用。所以，「有」給人帶來便利，是因為「無」發揮了它的實質功能。`,
    discussion: ``,
    en_discussion: ``

  {
    num: 12,
    title: `Those Who Pursue<br>the External <br>`,
    classical: `為腹章`,
    english: `The five colors blind the eye;<br>The five sounds deafen the ear;<br>The five flavors dull the palate.<br>Racing and hunting madden the mind;<br>Rare treasures cause one's behavior to go astray.<br>Therefore, the Sage provides for the belly and inner fulfillment,<br>And not for the temptations of the eye.<br>He rejects the outward desires,<br>And chooses the inward simplicity.`,
    chinese: `五色令人目盲； 五音令人耳聾； 五味令人口爽； <br>馳騁畋獵，令人心發狂； 難得之貨，令人行妨。 <br>是以聖人為腹不為目，故去彼取此。 <br>`,
    commentary: `繽紛的色彩使人眼花繚亂而失去辨色力；嘈雜的音樂使人聽覺麻木而失去辨音力；濃郁的滋味使人味覺遲鈍而食不知味；縱情於騎馬狩獵，會使人心境放蕩而狂亂不安；稀有珍貴的財寶，會使人行為偏差而誤入歧途。因此，聖人的治理是為了求得溫飽、充實內在，而不追求感官欲望的誘惑，所以會捨棄外在的物欲，選擇內在的質樸。`,
    discussion: `<div class="disc-sh">知道・道學讀書會</div><div class="disc-sh">概覽</div><div class="disc-p">本次讀書會以「知道・道學」為主題，內容涵蓋兩大部分：其一為活動財務報告與行政事務的說明，其二為以《道德經》相關章節為核心的讀書討論。讀書會針對「五色令人目盲、五音令人耳聾」等經典語句展開深入探討，並延伸至靈魂層次、修道目的、真我探尋，以及如何善用感官工具等哲學議題。此外，會中亦討論了未來讀書會的新進行格式調整，並以禪宗六祖惠能與神秀的偈語故事作為漸修與頓悟的對比案例。</div><div class="disc-sh">核心概念與理論</div><div class="disc-p">五色、五音、五味：過度的感官刺激會令人迷失自我，喪失對內在真實聲音的感知能力<br>真我與小我：區分以自我為中心的「小我」與無私廣大的「大我／真我」，是修道的核心課題<br>神秀與惠能的偈語:以兩位禪師的偈語為例,說明修行語言是否「見性」的關鍵差異——未見性的善語雖能引導向善,但可能帶有執著的副作用,僅能讓人不落惡道;而見性的偈語則能讓人耳聰目明、真正明心見性</div><div class="disc-q">點傳師：感官、媒體、社群軟體等工具本身無善惡之分，關鍵在於使用者的心態與出發點</div><div class="disc-p">無緣大慈、同體大悲：聖人以無我之心體察眾生苦難，進而找到真正的自我</div><div class="disc-sh">重要提問</div><div class="disc-p">聖歌算不算五音？<br>廣義上的五色是否涵蓋社群媒體、影視娛樂等現代刺激？<br>感官工具究竟是幫助我們找到真我，還是讓我們迷失？<br>神秀與惠能的偈語各自說明了什麼修行觀點？可能產生什麼執著？<br>如何在日常生活中區分「大我」與「小我」的行動？</div><div class="disc-sh">主題一：《道德經》章節討論——五色、五音、五味</div><div class="disc-p">本次讀書會針對「五色令人目盲；五音令人耳聾；五味令人口爽；馳騁畋獵，令人心發狂；難得之貨，令人行妨」進行逐句解析與討論。<br>成員們共同探討「五色」在現代生活中的具體呈現，包括：各種視覺刺激（影視、動漫、遊戲）、社群軟體、不必要的消費衝動（如網購滿額免運的行銷陷阱）等。討論結論認為，這些事物本身並非絕對的善或惡，關鍵在於是否能啟發自我、是否對自身有正面幫助，以及使用者能否保持清醒的覺察。<br>瑋揚 以個人音樂聆聽習慣的轉變為例，說明當一個人從被動接收轉為主動選擇，對感官刺激的敏感度與辨別力會隨之提升。五音的討論中，成員提問聖歌是否屬於五音，瑋揚 回應：廣義上確實可算，但核心在於這些聲音是否能引導自我提升，並非非黑即白。</div><div class="disc-sh">相關問答</div><div class="disc-q">問：聖歌算不算五音？</div><div class="disc-a">答：同學們認為，聖歌雖然廣義上可算是五音，但聖歌並不使人耳聾，反而讓人更耳聰目明。這連結到後面提到的「見性」概念——聖歌是讓人更加明心見性的工具，而非令人迷失的感官刺激。</div><div class="disc-q">問：社群軟體是否屬於五色的範疇？</div><div class="disc-a">答：是的，社群軟體屬於廣義的五色，但重點在於使用者如何運用，是否能從中獲得正面引導。</div><div class="disc-q">問：不必要的消費衝動是否也屬於五色的影響？</div><div class="disc-a">答：是的，網購滿額免運等行銷手法正是利用人的感官與欲望，讓人在不知不覺中超出原本的需求，這正是五色令人「目盲」的現代體現。</div><div class="disc-sh">主題二：真我探尋與修道目的</div><div class="disc-p">瑋揚 引導成員深入思考修道的根本目的：不僅是靈魂層次的提升，更是找回與天地合一的「大我／真我」。討論中提及，人的感官本是上天賦予的工具，目的是幫助我們體驗生命、感受眾生苦難，進而找到真正的自我。<br>什麼是真正的大我？大我就是宇宙，宇宙就是我。當一個人以大我的視角去看待世界，便會自然而然地珍惜一切，因為萬物皆是大我的一部份。修行者能夠感知世界眾生的苦難，並想盡辦法去渡化眾生，讓大家離苦得樂——這正是因為人人都是大我的一部份。《道德經》中說：「聖人無常心，以百姓心為心」，正是在說明這個境界。歷代聖人正是因為找到了這個大我，因此能夠成就聖人之位。而這，就是明心見性之人在真正耳聰目明之後，所看見的宇宙的真實相。<br>「無緣大慈、同體大悲」八字被引用為核心修行目標：當一個人真正體認到眾生皆是自己的一部分，便能自然生起慈悲心，不再以小我的執著行事。瑋揚 以「大我」與「小我」的對比說明：小我追求的是個人欲望的滿足，而大我則是以道心（無私的善心）回應世界。<br>此外，瑋揚 以禪宗神秀與惠能的偈語故事為例進行說明。神秀的偈語「身是菩提樹，心如明鏡台，時時勤拂拭，勿使惹塵埃」強調勤於修持、保持覺察，方向本身正確，能引導人謹慎護持身心、不落惡道。然而，這樣的善語尚未真正「見性」，若對修行的方法與概念產生執著，便可能帶來副作用，成為修行的障礙。相對地，惠能的偈語「菩提本無樹，明鏡亦非台，本來無一物，何處惹塵埃」則是真正見性的語言，能讓人耳聰目明、明心見性，直接指向究竟的無我境界，不會產生執著的副作用。</div><div class="disc-sh">相關問答</div><div class="disc-q">問:神秀的偈語有什麼問題嗎?</div><div class="disc-a">答:神秀的偈語方向正確,能引導人謹慎護持身心、勤於修持、不落惡道。但這樣的善語尚未真正「見性」,若對修行方法與概念本身產生執著,便可能帶來副作用,成為修行的障礙,無法讓人真正明心見性、達到究竟的無我境界。相對地,惠能的偈語則是真正見性的語言,能讓人耳聰目明、直接見性。</div><div class="disc-q">問：感官工具究竟應該如何使用？</div><div class="disc-a">答：應以「大我／真我」為出發點，用道心（善心）來引導感官工具的使用，自然能辨別什麼是真正需要的，而不被小我的欲望所驅使。</div><div class="disc-q">問：靈魂層次的高低是如何決定的？</div><div class="disc-a">答：靈魂層次取決於累世修行的積累，如同考試成績，每個人的起點與能達到的境界不同，因此天界有不同的層次；但最終目標是所有人都要達到圓滿，回歸本源。</div>`,
