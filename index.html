<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道德經 · Tao Te Ching</title>
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Spectral+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #f4f5f8;
      --sidebar-bg:  #eceff7;
      --surface:     #ffffff;
      --border:      #d6d9e8;
      --border-soft: #e2e5f2;
      --blue:        #494F9F;
      --blue-light:  #6d73b5;
      --teal:        #629595;
      --teal-light:  #7aadad;
      --teal-pale:   #e4eded;
      --text:        #3F4849;
      --text-mid:    #586869;
      --text-muted:  #7a9090;
      --text-light:  #a0b5b5;
      --highlight:   rgba(98,149,149,0.20);
      --sidebar-w:   272px;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Spectral', 'Georgia', 'Noto Serif TC', serif; background: #0a1a1a url('bg-dark.png') center/cover no-repeat fixed; color: var(--text); }

    /* ══ LANDING ══ */
    #landing {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,18,18,0.32); z-index: 10;
      transition: opacity 0.3s;
    }
    #landing.hidden { display: none; }
    #landing-inner {
      position: relative; z-index: 2;
      text-align: center; width: 100%; max-width: 640px; padding: 20px 28px;
    }
    #l-calligraphy { height: 130px; width: auto; margin-bottom: 14px; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.4)); }
    .l-en  { font-family: 'Spectral SC', serif; font-size: 20px; color: rgba(255,255,255,0.80); font-weight: 300; letter-spacing: 0.18em; margin-bottom: 18px; }
    .l-rule { width: 50px; height: 1px; background: rgba(255,255,255,0.35); margin: 0 auto 14px; }
    .l-desc { font-size: 13px; font-style: italic; color: rgba(255,255,255,0.50); line-height: 1.8; font-weight: 300; margin-bottom: 36px; }
    #l-select {
      width: 100%; padding: 14px 18px;
      font-family: 'Spectral', serif; font-size: 16px;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px; color: rgba(255,255,255,0.90); outline: none;
      cursor: pointer; margin-bottom: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: auto;
      text-align-last: center;
    }
    #l-select option { background: #1a2e2e; color: #fff; text-align: left; }
    #l-select:focus { border-color: var(--teal-light); box-shadow: 0 0 0 3px rgba(98,173,173,0.18); }
    #l-btn-present {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 22px; border-radius: 3px;
      background: transparent; color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
      font-family: 'Spectral SC', serif; font-size: 12px; letter-spacing: 0.1em;
      transition: all 0.2s;
    }
    #l-btn-present:hover { background: var(--teal); color: #fff; border-color: var(--teal); }

    /* ══ READER ══ */
    #reader { display: none; height: 100vh; overflow: hidden; background: transparent; }
    #reader.active { display: flex; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--sidebar-bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: width 0.28s ease, min-width 0.28s ease, border-color 0.28s ease;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border-right-color: transparent; }
    #sidebar-header { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: #fff; }
    #sidebar-logo { display: flex; align-items: flex-start; gap: 12px; }
    #sidebar-cjk { font-size: 38px; line-height: 1; color: var(--teal); font-weight: 300; }
    #sidebar-en h1 { font-family: 'Spectral SC', serif; font-size: 15px; font-weight: 400; color: var(--blue); letter-spacing: 0.12em; padding-top: 4px; }
    #sidebar-en p  { font-size: 11px; color: var(--text-light); margin-top: 3px; letter-spacing: 0.08em; font-style: italic; }
    #chapter-list { overflow-y: auto; flex: 1; padding: 6px 0; }
    #chapter-list::-webkit-scrollbar { width: 3px; }
    #chapter-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .ch-item { display: flex; align-items: center; padding: 6px 18px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; gap: 10px; }
    .ch-item:hover { background: rgba(74,148,144,0.08); border-left-color: var(--teal-light); }
    .ch-item.active { background: rgba(74,148,144,0.12); border-left-color: var(--teal); }
    .ch-item-num { font-family:'Spectral SC',serif; font-size:10px; color:var(--teal); min-width:22px; flex-shrink:0; }
    .ch-item-names { display:flex; flex-direction:column; flex:1; min-width:0; }
    .ch-item-en { font-size:11.5px; color:var(--text-mid); font-style:italic; line-height:1.4; }
    .ch-item-classical { font-size:10px; color:var(--text-muted); letter-spacing:0.06em; margin-top:2px; }
    .ch-item.active .ch-item-en { color:var(--teal); }
    .ch-item.active .ch-item-classical { color:var(--text-mid); }

    /* Reader main */
    #reader-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* Reader topbar */
    #reader-topbar {
      padding: 8px 20px; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.88); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #btn-home {
      padding: 6px 12px; border-radius: 3px;
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      cursor: pointer; font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.08em;
      transition: all 0.15s; flex-shrink: 0; white-space: nowrap;
    }
    #btn-home:hover { background: var(--bg); color: var(--text); }
    #btn-toggle-sidebar {
      background: none; border: 1px solid transparent; cursor: pointer;
      font-size: 15px; color: var(--text-muted); padding: 5px 10px; border-radius: 3px;
      transition: all 0.15s; flex-shrink: 0; line-height: 1;
    }
    #btn-toggle-sidebar:hover { color: var(--teal); border-color: var(--border); }
    .view-toggles { display: flex; gap: 6px; margin-left: auto; }
    .view-tog {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: 3px;
      background: #fff; color: var(--text-muted); cursor: pointer;
      font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.08em;
      transition: all 0.15s; white-space: nowrap;
    }
    .view-tog.on { background: var(--teal); color: #fff; border-color: var(--teal); }
    #btn-present {
      padding: 6px 14px; border-radius: 3px; background: var(--teal); color: #fff;
      border: none; cursor: pointer; font-family: 'Spectral SC', serif;
      font-size: 12px; letter-spacing: 0.1em; transition: background 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    #btn-present:hover { background: var(--teal-light); }

    /* Reader content */
    #reader-content { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    #reader-content::-webkit-scrollbar { width: 5px; }
    #reader-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .reader-inner { max-width: 820px; margin: 0 auto; padding: 32px 36px 60px; }

    /* Chapter header */
    .ch-header { display:flex; align-items:stretch; background: var(--surface); border: 1px solid var(--border); }
    .ch-header-main { flex:1; padding:16px 24px 14px; }
    .ch-header-label { font-family:'Spectral SC',serif; font-size:9px; letter-spacing:0.3em; color:var(--text-light); margin-bottom:5px; }
    .ch-header-en { font-size:20px; font-style:italic; color:var(--blue); font-weight:400; }
    .ch-header-classical-inline { font-size:14px; color:var(--teal); letter-spacing:0.12em; margin-top:6px; }
    .ch-header-num { font-family:'Spectral SC',serif; font-size:22px; font-weight:300; color:var(--text-light); letter-spacing:0.05em; padding:14px 18px; display:flex; align-items:center; justify-content:center; border-left:1px solid var(--border-soft); min-width:62px; flex-shrink:0; }

    /* Reader sections */
    .reader-section { background: var(--surface); border: 1px solid var(--border); border-top: none; padding: 20px 24px; }
    .reader-section.hidden { display: none; }
    .reader-sec-label { font-family:'Spectral SC',serif; font-size:8.5px; letter-spacing:0.3em; color:var(--text-light); margin-bottom:12px; }
    .reader-english { font-size: 15.5px; line-height: 2.1; color: var(--text-mid); font-weight: 300; }
    .reader-chinese { font-size: 16px; line-height: 2.2; color: var(--text); letter-spacing: 0.06em; }
    .reader-commentary { font-size: 14px; line-height: 2.0; color: var(--text-muted); font-style: italic; font-weight: 300; }

    /* Discussion tabs */
    #sec-dis { background: var(--surface); border: 1px solid var(--border); border-top: none; padding: 0; overflow: hidden; }
    .dis-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); }
    .dis-tab-btn {
      flex: 1; padding: 12px 20px; background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.1em;
      color: var(--text-muted); transition: all 0.15s;
    }
    .dis-tab-btn:hover { color: var(--teal); }
    .dis-tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); background: #fff; }
    .dis-panel { padding: 22px 24px; }
    .dis-panel.hidden { display: none; }
    .reader-discussion { font-size: 14.5px; line-height: 1.9; color: var(--text-mid); font-weight: 300; }
    .disc-h  { font-weight: 700; color: var(--teal); font-size: 15px; margin: 1.2em 0 0.3em; letter-spacing: 0.03em; }
    .disc-sh { font-weight: 600; color: var(--text); font-size: 14px; margin: 0.8em 0 0.2em; }
    .disc-p  { margin: 0 0 0.6em; }
    .disc-q  { font-weight: 500; color: var(--text); margin: 0.7em 0 0.1em; }
    .disc-a  { padding-left: 1em; margin: 0 0 0.4em; border-left: 2px solid var(--teal-pale); }
    .disc-ul { margin: 0.3em 0 0.6em 1.5em; padding: 0; list-style: disc; }
    .disc-ul li { margin-bottom: 0.25em; }
    .disc-heading { font-weight: 600; color: var(--teal); font-size: 15px; letter-spacing: 0.04em; }
    .dis-coming-soon { color: var(--text-light); font-style: italic; font-size: 14px; }

    mark { background:var(--highlight); color:var(--teal); border-radius:2px; padding:0 1px; }

    /* Reader nav */
    #reader-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; padding: 14px 28px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(6px); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 6px; padding: 8px 22px; border-radius: 3px;
      border: 1px solid var(--border); background: #fff; color: var(--text-mid);
      cursor: pointer; font-family: 'Spectral SC', serif; font-size: 12px;
      letter-spacing: 0.1em; transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--teal); color: #fff; border-color: var(--teal); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    #reader-ch-info { font-family: 'Spectral SC', serif; font-size: 13px; color: var(--text-muted); letter-spacing: 0.1em; min-width: 180px; text-align: center; }

    /* ══ PRESENTATION MODE ══ */
    #present-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: transparent; flex-direction: column; }
    #present-overlay.active { display: flex; }
    #present-bar { display: flex; align-items: center; gap: 12px; padding: 10px 28px; background: rgba(255,255,255,0.88); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #present-chapter-jump { flex: 1; max-width: 420px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 5px 10px; font-family: 'Spectral SC', serif; font-size: 13px; color: var(--text); outline: none; }
    #present-chapter-jump:focus { border-color: var(--teal); }
    .present-view-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 3px; background: #fff; color: var(--text-muted); cursor: pointer; font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.08em; transition: all 0.15s; }
    .present-view-btn.on { background: var(--teal); color: #fff; border-color: var(--teal); }
    #present-progress { font-family: 'Spectral SC', serif; font-size: 11px; color: var(--text-light); letter-spacing: 0.1em; white-space: nowrap; }
    #btn-exit-present { padding: 5px 14px; border-radius: 3px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); cursor: pointer; font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.1em; transition: all 0.15s; }
    #btn-exit-present:hover { background: var(--bg); color: var(--text); }
    #present-slide { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; padding: 28px 32px 48px; background: transparent; }
    #present-slide::-webkit-scrollbar { width: 5px; }
    #present-slide::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .slide-inner { width: 100%; max-width: min(98vw, 1920px); background: #fff; border: 1px solid var(--border); padding: 52px 72px 60px; height: auto; }
    #present-font-ctrl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    #font-slider { width: 110px; accent-color: var(--teal); cursor: pointer; }
    #present-font-label { font-family: 'Spectral SC', serif; font-size: 10px; color: var(--text-light); letter-spacing: 0.08em; min-width: 32px; text-align: right; }
    .slide-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border-soft); }
    .slide-header-left { flex: 1; }
    .slide-chapter-label { font-family: 'Spectral SC', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--teal); margin-bottom: 10px; }
    .slide-title-en { font-size: clamp(24px, 2.2vw, 34px); font-style: italic; color: var(--blue); font-weight: 400; line-height: 1.2; }
    .slide-classical-inline { font-size: clamp(14px, 1.2vw, 18px); color: var(--teal); letter-spacing: 0.14em; margin-top: 8px; }
    .slide-section { margin-top: 32px; }
    .slide-section-label { font-family: 'Spectral SC', serif; font-size: 10px; letter-spacing: 0.35em; color: var(--text-light); margin-bottom: 16px; text-transform: uppercase; }
    .slide-english { font-size: clamp(17px, 1.5vw, 22px); line-height: 2.15; color: var(--text-mid); font-weight: 300; }
    .slide-chinese { font-size: clamp(18px, 1.6vw, 24px); line-height: 2.25; color: var(--text); letter-spacing: 0.08em; padding: 22px 28px; background: rgba(74,148,144,0.04); border-left: 3px solid var(--teal-pale); }
    .slide-commentary { font-size: clamp(14px, 1.25vw, 18px); line-height: 2.05; color: var(--text-muted); font-style: italic; font-weight: 300; }
    .slide-discussion { font-size: clamp(14px, 1.2vw, 17px); line-height: 1.95; color: var(--text-mid); font-weight: 300; }
    .slide-en-discussion { font-size: clamp(14px, 1.2vw, 17px); line-height: 2.1; color: var(--text-mid); font-weight: 300; }
    .slide-section.hidden { display: none; }
    #present-nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 28px; background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; }
    #present-chapter-info { font-family: 'Spectral SC', serif; font-size: 12px; color: var(--text-muted); letter-spacing: 0.1em; min-width: 120px; text-align: center; }
    #present-hint { font-size: 11px; color: var(--text-light); font-style: italic; margin-left: auto; padding-right: 4px; }

    /* ══ MOBILE ══ */
    @media (max-width: 640px) {
      /* Viewport height: use dvh so iOS browser chrome doesn't cut off */
      #reader { height: 100dvh; }

      /* Hide Present everywhere */
      #btn-present, #l-btn-present { display: none !important; }

      /* Topbar: hide Home + all view toggles, keep only ☰ */
      #btn-home { display: none; }
      .view-toggles { display: none; }
      #reader-topbar { padding: 6px 12px; gap: 8px; }

      /* Always show all content sections on mobile (toggles hidden) */
      .reader-section.hidden { display: block !important; }
      #sec-dis { display: block !important; }

      /* Reduce inner padding for narrow screens */
      .reader-inner { padding: 14px 10px 36px; }
      .ch-header-main { padding: 12px 14px 10px; }
      .reader-section { padding: 14px 14px; }
      .dis-panel { padding: 14px; }
      .dis-tab-btn { padding: 10px 12px; font-size: 10px; }

      /* Bottom nav: safe area + compact */
      #reader-nav {
        padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        gap: 8px;
      }
      .nav-btn { padding: 8px 18px; font-size: 12px; }
      #reader-ch-info { min-width: 0; flex: 1; font-size: 11px; }

      /* Desktop-only chapter info (long form) */
      .ch-info-full { display: none; }
      /* Mobile-only chapter info (short form) */
      .ch-info-short { display: inline; }
    }
    @media (min-width: 641px) {
      .ch-info-short { display: none; }
      .ch-info-full  { display: inline; }
    }
  </style>
</head>
<body>

<!-- ══ LANDING PAGE ══ -->
<div id="landing">
  <div id="landing-inner">
    <img id="l-calligraphy" src="calligraphy.png" alt="道德經">
    <div class="l-en">Tao Te Ching</div>
    <div class="l-rule"></div>
    <p class="l-desc">81 chapters on the Way, Virtue, and the nature of all things.<br>English translation with Chinese original text and commentary.</p>
    <select id="l-select" onchange="if(this.value!=='') openChapter(+this.value)">
      <option value="">— Select a Chapter —</option>
    </select>
    <button id="l-btn-present" onclick="enterPresent(0)">▶ Present Mode</button>
  </div>
</div>

<!-- ══ READER ══ -->
<div id="reader">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-logo">
        <div id="sidebar-cjk">道</div>
        <div id="sidebar-en">
          <h1>Tao Te Ching</h1>
          <p>道德經 · 81 Chapters</p>
        </div>
      </div>
    </div>
    <div id="chapter-list"></div>
  </nav>

  <!-- Reader main -->
  <div id="reader-main">
    <div id="reader-topbar">
      <button id="btn-home" onclick="goHome()">← Home</button>
      <button id="btn-toggle-sidebar" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
      <div class="view-toggles">
        <button class="view-tog on" id="tog-en"  onclick="toggleSection('en')">English</button>
        <button class="view-tog on" id="tog-cn"  onclick="toggleSection('cn')">原文</button>
        <button class="view-tog on" id="tog-cmt" onclick="toggleSection('cmt')">注釋</button>
      </div>
      <button id="btn-present" onclick="enterPresent()">▶ Present</button>
    </div>

    <div id="reader-content">
      <div class="reader-inner">
        <div id="chapter-view"></div>
      </div>
    </div>

    <div id="reader-nav">
      <button class="nav-btn" id="btn-prev-ch" onclick="prevChapter()">← Prev</button>
      <div id="reader-ch-info"></div>
      <button class="nav-btn" id="btn-next-ch" onclick="nextChapter()">Next →</button>
    </div>
  </div>
</div>

<!-- ══ PRESENTATION OVERLAY ══ -->
<div id="present-overlay">
  <div id="present-bar">
    <select id="present-chapter-jump" onchange="jumpToSlide(+this.value)"></select>
    <button class="present-view-btn on" id="btn-show-en"     onclick="toggleView('en')">English</button>
    <button class="present-view-btn on" id="btn-show-cn"     onclick="toggleView('cn')">原文</button>
    <button class="present-view-btn on" id="btn-show-cmt"    onclick="toggleView('cmt')">注釋</button>
    <button class="present-view-btn on" id="btn-show-dis"    onclick="toggleView('dis')">討論</button>
    <button class="present-view-btn on" id="btn-show-en-dis" onclick="toggleView('en-dis')">Eng Discussion</button>
    <span id="present-progress"></span>
    <div id="present-font-ctrl">
      <input type="range" id="font-slider" min="50" max="250" step="10" value="100" oninput="adjustFont(this.value)">
      <span id="present-font-label">100%</span>
    </div>
    <button id="btn-exit-present" onclick="exitPresent()">✕ Exit</button>
  </div>
  <div id="present-slide">
    <div class="slide-inner" id="slide-content"></div>
  </div>
  <div id="present-nav">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()">← Prev</button>
    <div id="present-chapter-info"></div>
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">Next →</button>
    <span id="present-hint">← → arrow keys to navigate · Esc to exit</span>
  </div>
</div>

<script>
const introSections = [
  {
    title: `Laozi`,
    paragraphs: [
    `Laozi was a great Chinese thinker and philosopher. He is the founder of Taoism (Daoism) and the progenitor of the Taoist school of thought, revered as the Supreme Patriarch of Taoism. In the lineage of the Great Tao (Tao Tong), he is honored as the 14th Patriarch of the Former Oriental Generation.`,

    chinese: `道可道，非常道。名可名，非常名。 <br>無，名天地之始；有，名萬物之母。 <br>故常無，欲以觀其妙；常有，欲以觀其徼。 <br>此兩者同出而異名，同謂之玄。玄之又玄，眾妙之門。`,
    commentary: `可以用言語表達出來的道，就不是永恆不變的「道」；可以被定義稱呼的名，就不是永恆不變的「名」。「無」是用來形容天地渾沌未開的初始狀態，而「有」則是萬物具象生長後的根源。因此，我們常從「無」中去觀察道那深不可測的奧妙，也常從「有」中去觀察到道孕育萬物的廣大無邊。這兩者雖然名稱不同，其實都源自於同一個根源，同樣可以稱之為「玄」。這種深奧再深奧、難以窮盡的境界，正是通往宇宙萬物一切奧祕的正門。`,
    discussion: `<div class="disc-h">知道・道學讀書會</div><div class="disc-h">概述</div><div class="disc-p">本次讀書會聚焦於《道德經》的導讀,這是一部由老子撰寫於2500年前的中國經典著作,全書共81章、約5000字,分為「道經」(前37章)和「德經」(後44章)。講師強調台灣人最有資格理解《道德經》,因為語言和文化的優勢使我們能夠超越翻譯的限制,直接領悟原文的多層次意涵。課程透過探討「道可道,非常道;名可名,非常名」這一開篇經句,引導學員理解「道」的不可定義性,以及如何在生活中打破對人事物的既定框架。<br>核心概念或理論:<br>道的不可定義性:真正的「道」無法用語言文字完全描述或定義,任何定義都只能呈現其部分面向<br>定義即限制:當我們定義某事物時,就限制了它的其他可能性,使其「死亡」<br>知行合一:真正的理解不來自文字閱讀,而需要親身實踐體驗<br>破除成見:不應對自己或他人預設定義,避免用偏見看待一切<br>翻譯的局限:《道德經》的外文翻譯只能傳達一層意義,無法呈現中文原文的豐富內涵<br>提出的重要問題:<br>什麼是「道」?如何理解「道可道,非常道」?<br>為什麼台灣人最有資格理解《道德經》?<br>我們是否經常在生活中定義自己或他人,因而產生限制?<br>如何在閱讀經典時避免只停留在文字表面,而能真正實踐?<br>什麼是真正的「好人」?是否可以被定義?</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">《道德經》是僅次於《聖經》被翻譯成最多外語版本的文化經典<br>老子是道家學派創始人,曾任東周國家圖書館館長,孔子曾兩次向他請教<br>《道德經》誕生於周朝衰敗時期,老子西出函谷關時應尹喜之請而著此書<br>Bruce Lee的名言「Be water my friend」和心理學大師榮格都深受《道德經》影響<br>真正理解經典需要實踐體驗,不能只停留在文字閱讀和考試層面<br>定義會限制事物的無限可能性,我們應該學習打破既有框架<br>閱讀《道德經》的目的是建立正確心態,在生活中不斷實踐和領悟</div><div class="disc-h">主題一:《道德經》的歷史背景與作者</div><div class="disc-p">老子是中國偉大的思想家和哲學家,道家學派的創始人,被尊為道教始祖和第一代宗師,同時也是先秦道統的第十四代傳人。他生活在東周時期,與孔子同時代但年長於孔子,曾擔任東周的國家圖書館館長,因職務之便閱讀了大量典籍,發展出自己的思想體系。<br>當時正值周朝衰敗,出現「三家分晉」的局面,天子已成為傀儡,實權掌握在三大家族手中。孔子曾在51歲(知天命之年)時向老子請教,老子指出孔子過於執著於外在形式和禮儀,這次對話成為儒道兩家思想交流的經典時刻。<br>《道德經》的誕生源於老子西出函谷關準備隱退時,遇到守關的尹喜。尹喜觀察到東方有紫氣而來,預知將有聖人經過,便懇請老子留下畢生智慧。老子因此著述《道德經》,全書共81章、約5000字,分為「道經」37章和「德經」44章,核心思想是「道法自然」。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:你們對《道德經》有什麼印象?知道是誰寫的嗎?</div><div class="disc-a">前賢:有聽過,但沒有看過。</div><div class="disc-a">前賢丙:看不懂的東西。</div><div class="disc-q">點傳師:為什麼台灣人最有資格讀《道德經》?</div><div class="disc-q">點傳師:因為我們能讀懂中文原文,而外國人只能看翻譯,翻譯只能呈現一層意義,無法完整傳達「道」的多重含義。</div><div class="disc-h">主題二:「道可道,非常道」的深層意涵</div><div class="disc-p">課程重點解析《道德經》開篇第一句「道可道,非常道;名可名,非常名」。第一個「道」是名詞,指宇宙萬物運行的法則;第二個「道」是動詞,意為「說出來、描述、定義」;「非常道」的「常」指恆常、永恆,整句意為:能夠被說出來、被定義的道,就不是真正永恆不變的道。<br>講師透過多個例子說明「定義即限制」的概念。例如將某物定義為「水壺」,就限制了它只能裝水的功能,而忽略了它還可以用來敲打、當作武器等其他用途。同樣地,當我們用「兒子」、「哥哥」來定義一個人時,這些稱謂只對特定關係(母親、弟弟)有意義,無法完整代表這個人的全部。<br>在修行和生活中,我們經常不自覺地定義自己和他人。例如認為「他很小氣」、「我還不夠資格講課」、「這個人是新生所以不懂」等,這些定義都會限制我們看待事物的角度,產生偏見。老子在開篇就要告訴我們:真正的「道」無法用語言文字完全表達,任何定義都只是片面的,我們需要打破這些框架,才能真正理解和實踐。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:什麼是「道」?</div><div class="disc-a">前賢丙:無法定義。</div><div class="disc-a">線上學員:這個世界運行的規則。</div><div class="disc-q">點傳師:都對,但這些解釋仍然無法完整代表「道」的真正意涵,因為「道」超越了所有定義。</div><div class="disc-q">點傳師:這個水壺有沒有「道理」?</div><div class="disc-a">前賢丙:沒有。</div><div class="disc-q">點傳師:有,它能裝多少水是有道理的,春夏秋冬的運行也有道理,但這些事物本身並不知道什麼是「道理」,道理是我們人為賦予的解釋。</div><div class="disc-h">主題三:定義的限制與生活實踐</div><div class="disc-p">講師透過多個實例說明「定義」如何在生活中造成限制。首先以「好人」的定義為例:如果說好人要有禮貌、樂於助人、有能力,那麼一個每天幫老太太過馬路、讓座、努力學習的人就是好人嗎?表面看似如此,但這只是外在表現,無法真正定義一個人的內在本質。孔子也曾說過,當別人問他某個學生是否符合「好人」標準時,他總是回答「不知道是否符合標準」,因為真正的好人無法被定義。<br>講師引用《六祖壇經》的故事:神秀大師寫下「身是菩提樹,心如明鏡台,時時勤拂拭,勿使惹塵埃」,而不識字的慧能卻說出更高的見解。慧能說「我很恐怖」,意思是「不要輕視任何人,最有智慧的人有時看起來什麼都不懂」。這個故事告訴我們不要用外在條件定義一個人的修行程度。<br>另一個例子是《孟子》中記載的柳下惠和曾子。遇到戰爭時,曾子選擇跟隨主人共存亡,而柳下惠選擇先離開並囑咐家人保護好財產。表面上看起來完全相反,但孟子說兩人都對,因為曾子是下屬有責任守護,而柳下惠是長者需要被保護。這說明不能只看外在行為,要理解背後的處境和用心。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:我們是否經常定義自己?例如「這個人很新,要用淺顯的方式跟他講話」?</div><div class="disc-q">點傳師:有位外國學員第一次來就想直接讀《道德經》,我們是否因為定義他「是外國人、不懂中文、沒上過幾堂課」而限制了他?結果他反而覺得進階班太簡單。</div><div class="disc-q">點傳師:如果只為了考試讀書,考完就算了,這樣對嗎?</div><div class="disc-q">點傳師:不對,但也不是說考試不重要。重要的是要超越「為考試而讀書」的定義,而是真正將書中智慧運用在生活中,幫助自己和他人。</div><div class="disc-h">主題四:Bruce Lee與榮格對《道德經》的實踐</div><div class="disc-p">講師特別介紹了兩位深受《道德經》影響的世界名人。首先是功夫巨星Bruce Lee,他的名言「Be water my friend」(像水一樣)就是源自《道德經》中「上善若水」的思想。Bruce Lee不只是武術高手,更是一位學識淵博的哲學家,他將太極和道家思想融入武術中,創造出「攻即是守,守即是攻」的武學理念。<br>中國武術之所以聞名世界,就是因為融入了陰陽哲學。例如出拳時,拳頭在攻擊的同時,另一隻手在防守;踢腿時,雙手也在做防禦動作。這種「攻守合一」的概念與西方拳擊「攻擊就是攻擊、防守就是防守」的邏輯完全不同,而這正是源自《道德經》的智慧。<br>另一位是心理學大師榮格(Jung),他是西方心理學界第一代將東方思想融入心理學理論的大師。榮格在自傳中提到,他深受一本名為《太乙金華宗旨》的中國典籍影響,這本書正是道家用來解釋《道德經》的經典。榮格從中獲得啟發,發展出後來的心理學理論模型。許多被認為是西方的思想,實際上都深受《道德經》影響。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:為什麼Bruce Lee的武術這麼厲害?</div><div class="disc-q">點傳師:因為他將道家思想融入武術,理解「攻即是守,守即是攻」的道理,這就是中國武術的精髓。</div><div class="disc-q">點傳師:為什麼說台灣人最有資格理解《道德經》?</div><div class="disc-q">點傳師:因為即使是會說英文的人,也無法完全理解英文文學的深度;同樣地,《道德經》即使被翻譯成多國語言,外國人也只能理解一層意義,而我們能直接閱讀中文原文,理解其豐富的內涵。</div><div class="disc-h">主題五:實踐重於文字的修行觀</div><div class="disc-p">講師強調《道德經》開篇就告訴我們:真正的理解不來自文字,而需要親身實踐。就像介紹羅馬再詳細,看再多照片和影片,都比不上親自去一趟。文字、圖片、影片都是有限制的,無法傳達真實體驗。同樣地,讀再多關於日月潭的描述,都比不上前賢丙親自去過一次的體驗。<br>在佛堂修行也是如此。不能只是為了考試而讀書,考完就結束。有些人沒讀書反而考得比認真讀書的人高分,這說明考試成績不能真正代表一個人的理解程度。真正重要的是將經典智慧內化,運用在生活中,用來幫助自己轉化和渡化眾生。<br>講師提醒學員不要自我設限,例如認為「我還是新生,不用聽這些」、「我還沒講師資格,不用想這些事」。這些都是自我定義造成的限制。真正的修行可以隨時開始,不需要等到某個階段或具備某種資格。就像有學員雖然還沒有講師身分,但已經在外面接引新人,這就是超越定義的實踐。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:如果今天花一小時準備PowerPoint介紹日月潭的體驗,對沒去過的人有什麼幫助?</div><div class="disc-q">點傳師:完全沒有幫助。因為真正的體驗無法透過文字和圖片傳達,必須親自去經歷。</div><div class="disc-q">點傳師:什麼時候可以開始渡人?</div><div class="disc-q">點傳師:現在就可以開始,不需要等到有球場(講師資格)才能打球(渡人)。有學員在沒有正式身分的情況下就已經在外面接引新人,這才是真正的實踐。</div><div class="disc-h">可行的後續步驟/作業</div><div class="disc-p">購買《道德經》課本(福慧佛堂販售版本),此版本為考試指定用書<br>準備筆記本,在閱讀《道德經》時直接在書上做筆記,記錄自己的理解和心得<br>反思自己在生活中是否經常定義自己或他人,練習打破這些既定框架<br>將本次課程學到的「道可道,非常道」概念應用在日常生活中,觀察自己的思維模式<br>準備下次讀書會繼續深入研讀《道德經》後續章節</div><div class="disc-h">補充資源</div><div class="disc-p">NA</div><div class="disc-p">---</div><div class="disc-h">知道・道學讀書會</div><div class="disc-h">概覽</div><div class="disc-p">本次讀書會探討《道德經》第一章與第二章的核心思想,重點在於「道」的不可言說性以及「有」與「無」的辯證關係。講師透過現代生活實例,引導學員理解老子哲學中關於本質與現象、相對與絕對的深層概念。討論涵蓋了宇宙起源、人性本質,以及如何在日常生活中實踐「無為而治」的智慧。<br>核心概念或理論:<br>道可道,非常道:真正的「道」無法用語言完整定義或描述<br>無名天地之始,有名萬物之母:「無」是宇宙創生的本源,「有」是萬物顯現的狀態<br>相對性概念:美醜、善惡、難易、長短等對立概念實為相互依存、相輔相成<br>無為而治:聖人以身作則,不刻意追求,順應自然而為<br>生而不有,為而不恃,功成而弗居:創造而不佔有,付出而不依賴,成就而不居功<br>提出的重要問題:<br>如何理解「道」這個無法言說的概念?<br>為什麼定義「善」反而會產生「惡」的概念?<br>在現代社會中,我們如何實踐「無為而治」的智慧?<br>為什麼聖人要「生而不有,為而不恃,功成而弗居」?</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">理解《道德經》第一章關於「道」的不可言說性與超越性<br>認識「有」與「無」的辯證關係及其在宇宙創生中的意義<br>掌握相對概念(美醜、善惡、難易等)的相互依存性<br>學習「無為而治」的實踐方法與生活應用<br>體會「生而不有,為而不恃,功成而弗居」的修行境界<br>反思現代社會中的價值判斷與分別心<br>培養以平等心看待世界的視角</div><div class="disc-h">主題一:道的本質與不可言說性</div><div class="disc-p">《道德經》開篇即指出「道可道,非常道;名可名,非常名」,強調真正的「道」無法用語言完整描述。講師以磁鐵為例說明:磁鐵原本是山中的磁鐵礦,與其他礦物混在一起時並無特別之處,但經過開採加工後,人們發現其內在能量,形成了磁場,產生了正負極。這個過程說明了「無」到「有」的轉化——原本看不見的能量(無)經過顯現後成為可見的磁性(有)。<br>講師進一步引用宇宙大爆炸理論來闡釋「無名天地之始,有名萬物之母」。科學家推測宇宙起源於46億年前的大爆炸,但在大爆炸之前,必定有某種能量體存在。這個充滿能量但尚未顯現的狀態就是「無」,是天地創生的開始;而大爆炸後形成的太陽系、行星、小行星帶等可見物質,就是「有」,是萬物之母。<br>「常無欲以觀其妙,常有欲以觀其徼」這句話說明了兩種觀察角度。「常無」是用本性、用靈性去看事物的本質,就像嬰兒看世界時沒有分別心,看每個人都是一樣的,能看到許多成人看不到的境界。「常有」則是用後天的眼睛去看有形的一面,看到的是表象、情緒、行為等外在現象。這兩者「同出而異名」,都源自於道,只是觀察角度不同。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:為什麼「道」不能被定義?</div><div class="disc-q">講師:因為一旦定義了,就被限制了。例如你定義「道」是回天之路,那它就只能用在歸空時,但人生在世難道不也是道嗎?真正的道是無所不在、無法被限制的。</div><div class="disc-q">點傳師:如何理解「玄之又玄,眾妙之門」?</div><div class="disc-q">講師:「玄」本身就是一團黑,就像宇宙中的黑洞,裡面包含了一切。當我們越深入探索,發現這個「黑」不是我們想像的黑,而是更廣大、更深邃的存在,這就是通往一切奧妙的門徑。</div><div class="disc-h">主題二:相對概念的相互依存</div><div class="disc-p">《道德經》第二章指出「天下皆知美之為美,斯惡已;皆知善之為善,斯不善已」,揭示了一個重要概念:當我們定義什麼是「美」或「善」時,「醜」和「惡」的概念也同時產生了。講師以烹飪為例說明:當你煮飯時,如果只是盡力把飯煮好,心中沒有好壞的念頭,這時你的心是在中道。但當別人稱讚你煮得好吃後,下次你就會開始想「怎麼煮才好吃」,這時分別心就產生了,你就落入了兩端。<br>講師進一步舉例:當有人稱讚「你今天很漂亮」時,聽者可能會想「所以我昨天不漂亮嗎?」這就是分別心的展現。在佛堂中也常見這種情況:有人講課講得好,就會有人覺得自己講得不好;有人渡了很多人,就會有人覺得自己渡人不夠。但實際上,在佛堂中掃地、煮飯、講課,功德都是一樣的,沒有高低之分。<br>「故有無相生,難易相成,長短相形,高下相傾,音聲相和,前後相隨」這段話說明了所有相對概念都是相互依存、相輔相成的。講師請學員舉例說明這些相對關係:有iPhone的人才會說沒有iPhone;跑半馬的人覺得全馬很難,但對跑全馬的人來說半馬很簡單;唱歌有高音低音相互配合才好聽;走路時左右腳前後交替才能前進。這些例子都說明了相對概念不是對立的,而是互補的、相互成就的。</div><div class="disc-h">相關問答</div><div class="disc-a">前賢乙:如何理解「音聲相和,前後相隨」?</div><div class="disc-q">講師:就像走路一樣,一定是一隻腳在前、一隻腳在後。如果左腳和右腳比較誰比較重要,最後只會跌倒。前後相隨是很自然的過程,不需要比較。</div><div class="disc-a">學員:在合唱團中,唱高音是不是比較厲害?</div><div class="disc-q">講師:音樂老師不會這樣說。如果一群人都只唱高音,可能會很難聽。高音低音相互配合,才能成就美妙的音樂,沒有誰比較好的問題。</div><div class="disc-h">主題三:無為而治的實踐智慧</div><div class="disc-p">「是以聖人處無為之事,行不言之教」說明了聖人的處世方式。「無為」不是什麼都不做,而是順應自然、不刻意造作。講師舉例:太陽不需要有人叫它出來,它自然會升起;春夏秋冬的更替,動植物在該出現的季節自然出現,螢火蟲在四五月自然會出現,這些都是「無為」的展現。<br>「不言之教」是指以身作則,而不是只用嘴巴說。講師分享了一位「豬哥姊」的例子:這位學員不識字,每次上台報告都要背稿,常常忘詞而哭。但他從不放棄,每週持續上課、上台練習。經過長期的努力,在最近一次課程中,他在沒有準備的情況下,自己講了十分鐘,連他自己都沒有察覺到這個改變。這就是「不言之教」的力量——透過環境的薰陶和自己的實踐,不知不覺中就進步了。<br>講師也提到在佛堂中的實踐:當小朋友不聽話、到處跑時,與其一直用嘴巴說教,不如大家認真做自己該做的事,小朋友看到這個環境,自然會受到影響。這就是「無為而治」——不是刻意去教導,而是創造一個好的環境,讓改變自然發生。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:如何在教導孩子時實踐「不言之教」?</div><div class="disc-q">講師:當孩子不聽話時,與其一直說教,不如自己認真做該做的事。孩子看到大家都在認真做事,自然會受到影響。這就是環境的力量,也是「無為而治」的實踐。</div><div class="disc-a">學員:「無為」是不是什麼都不做?</div><div class="disc-q">講師:不是。「無為」是順應自然,做該做的事,但不刻意造作,不帶著目的去做。就像地球孕育萬物,但從不要求回報,這就是「無為」。</div><div class="disc-h">主題四:生而不有,為而不恃,功成而弗居</div><div class="disc-p">《道德經》最後強調「生而不有,為而不恃,功成而弗居,夫唯弗居,是以不去」,這是修行的最高境界。「生而不有」是指創造了、生養了,但不去佔有。講師以大地為例:大地孕育萬物,給我們食物、資源,但從不說「你們要對我好一點,要尊敬我」。大地不斷被我們踩踏,但它從不抱怨,這就是「生而不有」。<br>「為而不恃」是指做了很多事,但不依賴這些功勞。講師分享了佛堂三十週年的例子:佛堂能有今天,是因為有很多前人默默付出,包括提供場地的人、負責音樂的黃點傳師等。但這些人做完後就離開了,不會說「這是我做的」,也不會居功。黃點傳師編寫了佛堂90%的聖歌,但做完後就默默離開,讓後人繼續傳承,這就是「為而不恃」。<br>「功成而弗居」是指成就了很大的功德,但不居功。講師強調:當我們今天想要被記住時,反而會很快被遺忘。因為這時我們有私心,有「我要成為好人」的念頭,就無法真正做到無私。真正偉大的人,往往是在無私的付出中,不知不覺成就了自己。<br>講師以佛堂的例子說明:許多領導者只是做好自己的本分,但卻在不知不覺中成為他人的榜樣,種下了善的種子。這些種子發芽後,又去幫助更多人,形成了無法計算的功德。這就是「夫唯弗居,是以不去」——正因為不居功,所以功德永遠不會消失。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:為什麼「功成而弗居」反而功德不去?</div><div class="disc-q">講師:因為當你不居功時,你沒有私心,做的是真正無私的付出。這種付出會影響更多人,形成連鎖效應,功德反而無法計算、永不消失。</div><div class="disc-a">學員:在佛堂中不同的工作,功德有差別嗎?</div><div class="disc-q">講師:沒有差別。掃地、煮飯、講課,功德都是一樣的。就像NASA的清潔工說「我在幫助太空人飛上太空」,每個角色都同等重要,缺一不可。</div><div class="disc-h">主題五:現代生活中的應用與反思</div><div class="disc-p">講師強調,現代人往往放棄了很多本能和天性,選擇跟隨社會的框架和趨勢。社會教導我們「成功」就是要賺很多錢,要努力讀書、考好成績、上好大學、出國讀博士、在公司升職加薪。但在追求這些的過程中,我們常常不快樂,不知道自己真正的意義是什麼,感覺像被關在牢籠中無法逃脫。<br>講師指出,我們的大腦只開發了4%到9%,還有90%以上的能量沒有被開發。我們已經擁有這些能量,只是不知道,甚至把它丟在一邊。就像有人四肢強健、頭腦聰明,卻只願意相信自己能在電腦世界中有所成就,忘記了我們真正的身體、真正的本質。<br>講師以報告為例說明:一開始我們沒有信心,會完全照著講稿念,但最好的狀態是看一眼講稿就知道要講什麼,甚至忘記講稿,完全從內心流露出來。這就是回到本性的狀態。雖然這聽起來很難,但實際上我們都做得到,只是我們習慣用有限的眼光看待自己。<br>講師鼓勵學員要「改脾氣、去毛病」,從改變看待世界的方式開始。不要用分別心看待事物,不要比較好壞、高低,而是用平等心看待每個人、每件事。因為每個人都有同樣的靈性,都是我們的兄弟姊妹,都值得尊重和善待。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:我們如何在現代社會中實踐這些智慧?</div><div class="disc-q">講師:從改變看待世界的方式開始。不要用分別心看待事物,不要比較好壞。做該做的事,但不帶目的,不求回報。在佛堂中,每個人做好自己的本分,就是最好的實踐。</div><div class="disc-a">學員:為什麼我們會感到被社會框架束縛?</div><div class="disc-q">講師:因為我們放棄了天性,選擇跟隨社會定義的「成功」。但這不是我們與生俱來的使命,所以會感到痛苦。解決方法是覺醒,從這些後天的框架中醒來,回到本性。</div><div class="disc-h">行動步驟/作業</div><div class="disc-p">NA</div><div class="disc-h">補充資源</div><div class="disc-p">NA</div>`,
    en_discussion: `<div class="disc-h">Class 1: Introduction to Tao Te Ching - The Eternal Tao</div><div class="disc-p">Exploring Laozi's timeless wisdom on the nature of Tao and Te<br>Guang Ming Advanced Academy<br>May 6, 2026</div><div class="disc-h">Key Takeaways</div><div class="disc-p">Explored Chapter 1 of Tao Te Ching, focusing on the concepts of Tao (the primordial source/way) and Te (manifestation through virtue)<br>Traced the evolution of spiritual cultivation from ancient monastic isolation to the modern White Yang Era, where we practice benevolence within daily secular life.<br>Wu Wei (non-action): Defined not as "doing nothing," but as acting spontaneously without ego or ulterior motives, like instinctively saving a child from danger<br>Key insight: "The Tao that can be spoken is not the eternal Tao" - understanding comes through direct experience, not words alone</div><div class="disc-h">Discussion Highlights</div><div class="disc-p">Understanding Tao Te Ching's Depth<br>The class explored why Tao Te Ching is considered Eastern philosophy's masterpiece and how it reveals different meanings at different life stages.</div><div class="disc-h">Key Points</div><div class="disc-q">Master: "The English translation may seem simple, but the text has multiple layers. It's a sacred text that reveals different meanings upon repeated reading."</div><div class="disc-p">The text invites profound realization that transcends literal interpretation.<br>What is Tao?<br>Discussion on Tao as the path home to our true nature.</div><div class="disc-h">Key Insights</div><div class="disc-q">Master: "We're like children who've forgotten their way home. God sends prophets and sages to guide us back."</div><div class="disc-p">Heaven isn't a physical place - it's a state of purified heart achieved in the present moment<br>All religions share the same purpose: purifying hearts and recovering inner nature<br>Three Spiritual Eras<br>Master explained how spiritual cultivation methods evolved across three periods.</div><div class="disc-h">The Evolution</div><div class="disc-p">Green Yang Era (3,000 years ago): Patriarchs were sovereign rulers who provided for humanity's basic needs and physical survival.<br>Red Yang Era (2,500 years ago): Patriarchs took the form of monastics and scholars, establishing the world's major religions.<br>White Yang Era (120 years ago): Cultivation is integrated into society. Maitreya Buddha teaches us to discover profound joy through altruistic service in our everyday lives.</div><div class="disc-q">Master: "People today are moving away from asceticism and temple seclusion. We seek fulfillment by serving others while remaining fully engaged in our modern lives."</div><div class="disc-p">Maitreya Buddha's Teaching<br>The story of how Maitreya asked for an easier path to enlightenment.</div><div class="disc-h">The Story</div><div class="disc-q">Master: " Maitreya Buddha asked Gautama Buddha if there was an easier way than strict monastic life. Gautama praised him for asking on behalf of all people whose circumstances made that path unreachable."</div><div class="disc-p">The answer: Follow mercy, compassion, and benevolence<br>Modern application: Learn through service and helping others<br>Finding Life's Meaning Through Service<br>A powerful analogy about discovering purpose.<br>Key Insight</div><div class="disc-q">Master: "Life's meaning is defined by others, not ourselves - like how the market determines a product's value."</div><div class="disc-p">Preparing to teach requires learning, so self-improvement and helping others happen simultaneously<br>Laozi and the Patriarch Lineage<br>Background on Laozi's place in spiritual transmission.</div><div class="disc-h">Historical Context</div><div class="disc-p">Laozi was the 14th patriarch, living 2,500 years ago<br>There were 64 total patriarchs in the first two eras (64 being a complete number in Yi Jing)<br>White Yang Era changed from single patriarch to multiple masters<br>Structure of Tao Te Ching<br>The text's systematic organization.</div><div class="disc-h">Organization</div><div class="disc-p">81 chapters total, divided into two parts<br>First 37 chapters: Tao Jing (discussing the essence of Tao)<br>Remaining chapters: Te Jing (discussing the application of Te)<br>Tao versus Te: A Rich Discussion<br>Participants explored this fundamental distinction through metaphors and examples.</div><div class="disc-h">The Dialogue</div><div class="disc-q">Master 's electricity metaphor: "Tao is like electricity - the original energy. Te is like light - the visible manifestation."</div><div class="disc-q">Master: "A kind heart is Tao, but we can only observe it through actions, which is Te."</div><div class="disc-p">Mavis: "Tao is essence while Te is the manifestation. Tao is fundamental principle while Te is practical application."<br>Dom's understanding: "Tao is the internal energy and purpose, while Te is the actual results and actions."<br>Conclusion: Tao is the invisible source; Te is the visible expression. Both are essential.<br>Wu Wei: The Art of Selfless Action<br>An engaging exploration of acting without selfish purpose.</div><div class="disc-h">The Discussion</div><div class="disc-p">Dom: "Wu Wei means acting without selfish motives - acting without acting. Doing what should be done purely, without ulterior intention."</div><div class="disc-q">Master: "Is it easy or difficult?"</div><div class="disc-p">Dom: "Both! Easy in concept but hard in practice due to life pressures and potential consequences."<br>Mencius's example: Seeing a child near a well, your instinct to save them without thinking of reward or consequences - that's Wu Wei</div><div class="disc-q">Master: "Wu Wei doesn't mean doing nothing. It means doing everything without selfish purpose."</div><div class="disc-p">Dom: "Does nothing yet nothing is left undone."<br>Chapter 1:  The Tao and Names<br>Deep analysis of the opening verse: Tao Ke Tao, Fei Chang Tao.</div><div class="disc-h">Memorable Exchange</div><div class="disc-q">Master: "The Tao that can be spoken is not the eternal Tao."</div><div class="disc-p">Dom: "When we try to understand Tao like a physical object, we miss the point. It's like the Buddhist saying: the finger pointing to the moon is not the moon itself."</div><div class="disc-q">Master: "100 percent correct!"</div><div class="disc-p">Bruce Lee's wisdom: "Don't think, feel."</div><div class="disc-q">Master: "Reading books about swimming doesn't mean you can swim. Gautama Buddha also warned not to claim there's one fixed way to enlightenment."</div><div class="disc-p">Names and Eternal Truth<br>Why Laozi emphasized that names are not eternal.</div><div class="disc-h">The Insight</div><div class="disc-p">Dom: "Names can change and everything changes, but truth doesn't change. Different religions use different names but aim for the same truth."</div><div class="disc-q">Master: "100 percent! What matters is the truth at the center, not the words used. Spirits and souls are the same regardless of religious labels."</div><div class="disc-p">Metaphor: A cup made of china will eventually become dust - the name "cup" won't last eternally, but the truth behind it will.<br>The Four Stages of Existence<br>Understanding impermanence through Buddhist wisdom.</div><div class="disc-h">The Cycle</div><div class="disc-p">Everything experiences these stages - humans, the sun, all phenomena</div><div class="disc-q">Master: "This cycle itself represents the truth that never changes."</div><div class="disc-p">Dom: "I appreciate understanding that all things will eventually be gone."<br>Tao's Omnipresence<br>The eternal Tao cannot be seen but exists everywhere.</div><div class="disc-h">Beautiful Imagery</div><div class="disc-p">Dom: "Tao is like a net that is extremely large but nothing ever slips through."</div><div class="disc-q">Master: "Exactly. Tao has no limits. Because it's unlimited, everything exists within it."</div>`
  },
