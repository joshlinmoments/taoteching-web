    english: `Between birth and death, Three in ten are followers of life; Three in ten are followers of death; And those whose movements lead them to the land of death are also three in ten. Why is this? Because they live their lives too intensely. But I have heard that he who is a good preserver of his life Never meets tiger or wild bull when he travels, And is not touched by weapons of war on the battlefield. The wild bull finds no place to thrust its horns; The tiger finds no place to set its claws; The weapon finds no place to lodge its point. And why? Because in him there is no place for death.<br><br>The Tao gives them life; Virtue (De) nurses them; The world of matter shapes them; their environment completes them. Therefore, among the ten thousand creatures, there is none that does not pay homage to the Tao and assign a high value to Virtue. This homage to the Tao and valuing of Virtue is not commanded by anyone, but is always so, naturally of itself. Thus, the Tao gives them life, but it is Virtue that nurses them, raises them, fosters them, shelters them, feeds them, and protects them. To give life but not to own; To act but not to rely on one's ability; To lead but not to master; This is what is called Mysterious Virtue (Xuan De).`,
    chinese: `上士聞道，勤而行之；中士聞道，若存若亡；<br>下士聞道，大笑之，不笑不足以為道。<br><br>故建言有之：<br>明道若昧；進道若退；夷道若類；上德若谷；<br>大白若辱；廣德若不足；建德若偷；<br>質真若渝；大方無隅；大器晚成；大音希聲；大象無形；<br>道隱無名。夫唯道，善貸且成。`,
    commentary: `上等的人得聞道，會努力不懈地去實踐；中等的人得聞道，似懂非懂，時而相信時而懷疑；下等資質的人得聞道，會大聲嘲笑，如果道不被嘲笑，那就不足以稱為真正的「道」了。所以古人曾說：明瞭道的人看起來昏庸愚昧；精進修道的人總是禮讓無爭，看起來像是退縮；真修道的人不標新立異，看起來平易近人；具有高尚品德的人能虛懷若谷；擁有潔淨的心靈，卻總是不計較是非得失，就像受侮辱；廣大的德性的人積極改過，看起來像老是做錯事；默默建功立德不令人見，就像小偷；本性純真質樸看起來卻像經歷了改變而混濁。包容萬物卻沒有稜角，不分黨結派；有用的器物需要耐心打磨而成；最偉大的聲音（成全）聽起來沒有聲響（以身作則），最大的形象看起來反而沒有形跡。道幽隱而沒有名稱，但也只有道，善於資助並成就萬物。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 42,
    title: ``,
    classical: `沖和章`,
    english: `Everything under heaven had a beginning which may be called the Mother of all things. He who has found the Mother can from her know the children (the manifestations). He who, having known the children, still holds fast to the Mother, will be free from danger all his life. Close the mouth, shut the gates (of the senses), and to the end of life you will have no trouble. Open the mouth, meddle with affairs, and to the end of life there will be no help for you. To see the small is called Illumination; To hold on to the soft is called strength. Use the light, but return to your Inner Illumination (the Source); Then you will not leave yourself exposed to peril. This is called "clinging to the always-so."`,
    chinese: `道生一，一生二，二生三，三生萬物。<br>萬物負陰而抱陽，沖氣以為和。<br>人之所惡，唯孤、寡、不穀，而王公以為稱。<br>故物或損之而益，或益之而損。<br>人之所教，我亦教之。<br>強梁者，不得其死，吾將以為教父。`,
    commentary: `道生成了原始的統一體「一」，「一」分化出對立的陰陽兩氣「二」，陰陽兩氣交感產生了第三種中和的力量<br>「三」，再由這三者生成了宇宙間的萬事萬物。萬物背負著陰氣而懷抱著陽氣，在兩氣的互相激盪中達成和諧。人<br>們所厭惡的，往往是「孤」、「寡」、「不善」這些名詞，但王公貴族卻用這些詞來自我稱呼，作為自我警惕。所<br>以事物有時看似受損，結果反而得到補益；有時看似得到補益，結果反而受損。別人所教導的道理，我也用來教導<br>人：那些橫行霸道、強悍好勝的人，通常得不到好下場，我將把這條道理視為父親的教誨，永遠記住。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 43,
    title: ``,
    classical: `至柔章`,
    english: `If I had but a little knowledge, I should walk in the Great Tao, and my only fear would be wandering from it. The Great Tao is very smooth and straight, but the people love the mountain paths. When the court is very clean, the fields are full of weeds, and the granaries are quite empty. To wear fine clothes, to carry sharp swords, to be filled with food and drink, and to have more wealth than one can use—this is what I call "the pride of robbers." It is certainly not the Tao.`,
    chinese: `天下之至柔，馳騁天下之至堅。無有入無間。<br>吾是以知無為之有益。<br>不言之教，無為之益，天下希及之。<br>`,
    commentary: `天下最柔弱的東⻄，竟然能穿梭在天下最堅硬的東⻄之中。無形的力量能進入沒有縫隙的空間，我因此體會到「無<br>為」的好處。這種不靠言語來教化、不帶目的而得到的益處，普天之下很少有人能趕得上這種境界。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 44,
    title: ``,
    classical: `知止章`,
    english: `What is well planted cannot be uprooted; what is well embraced cannot slip away. Through the Virtue (De) of the ancestors, the sacrifices will never cease. Cultivate it in your own person, and its Virtue will be real; Cultivate it in the family, and its Virtue will be abundant; Cultivate it in the village, and its Virtue will endure; Cultivate it in the state, and its Virtue will be flourishing; Cultivate it in the world, and its Virtue will be universal. Therefore, by one's own person, one may judge other persons; By one's own family, one may judge other families; By one's own village, one may judge other villages; By one's own state, one may judge other states; By one's own world, one may judge the world. How do I know that the world is so? By this.`,
    chinese: `名與身孰親？身與貨孰多？得與亡孰病？<br>是故甚愛必大費；多藏必厚亡。<br>故知足不辱，知止不殆，可以長久。`,
    commentary: `名聲與生命相比，哪一個更親切？生命與財富相比，哪一個更貴重？獲得名利與失去生命相比，哪一個更有害？所<br>以說，過分的貪名求愛必會付出巨大的代價，過多的財物收藏必會招致慘重的損失。因此，懂得滿足就不會受到羞<br>辱，懂得適可而止就不會遭遇危險，如此才能保持⻑久的平安。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 45,
    title: ``,
    classical: `清靜章`,
    english: `He who possesses the fullness of Virtue (De) is like a little child. Poisonous insects will not sting him; wild beasts will not seize him; birds of prey will not strike him. His bones are soft, his sinews are weak, yet his grip is firm. He does not yet know the union of male and female, yet his organ can be stirred; this is because his Vital Essence is at its height. He can cry all day without becoming hoarse; this is because his Innate Harmony is at its height. To know harmony is to know the "always-so"; To know the "always-so" is to be Illumined. To force the growth of life is an ill omen; For the heart to direct the breath is called violence. Things that grow to their full strength soon begin to decay. This is called "not being in the Tao." Whatever is not in the Tao soon comes to an end.`,
    chinese: `大成若缺，其用不弊。<br>大盈若沖，其用不窮。<br>大直若屈，大巧若拙，大辯若訥。<br>躁勝寒，靜勝熱。清靜為天下正。`,
    commentary: `最圓滿的成就看起來好像有欠缺，但它的作用卻永遠不會衰竭；最充盈的狀態看起來好像很空虛，但它的作用卻無<br>窮無盡。最正直的東⻄看起來好像有彎曲，最靈巧的表現看起來好像很笨拙，最卓越的辯才看起來好像不善言辭。<br>縱使奔跑躁動可以戰勝寒冷，安靜守候可以克服炎熱。唯有清靜無為，才是治理天下的準則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 46,
    title: ``,
    classical: `知足章`,
    english: `Those who know do not speak; those who speak do not know. Close the mouth; shut the gates (of the senses). Blunt the sharpness; unravel the knots; Temper the brightness; identify yourself with the dust. This is what is called Mysterious Unity (Xuan Tong). Therefore, no one can be intimate with him, nor can anyone be distant from him. No one can benefit him, nor can anyone harm him. No one can ennoble him, nor can anyone debase him. Therefore, he is the most noble thing under heaven.`,
    chinese: `天下有道，卻走馬以糞。<br>天下無道，戎馬生於郊。<br>禍莫大於不知足；咎莫大於欲得。<br>故知足之足，常足矣。`,
    commentary: `當天下太平、符合自然之道時，人們不需要戰爭，原本用來作戰的駿馬都被退還到田裡拉車、施肥耕種。當天下紛<br>亂、背離自然之道時，兵馬也難免要生死於荒郊野外。災禍沒有比不知足更嚴重的了，過錯沒有比貪得無厭更巨大<br>的了。所以，唯有明白「真正的滿足」而得到的滿足，才是永恆且恆久的滿足。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 47,
    title: ``,
    classical: `天道章`,
    english: `Govern a state with righteousness; conduct a war with craft; but win the world by Non-interference (Wu-Shi). How do I know this is so? By this: The more prohibitions there are, the poorer the people become. The more sharp weapons the people have, the more troubled is the state. The more cunning and skill man possesses, the more strange things happen. The more laws and edicts are multiplied, the more thieves and robbers there are. Therefore the Sage says: I take Non-action (Wu-Wei), and the people transform themselves; I love quietude, and the people right themselves; I do not meddle, and the people prosper by themselves; I have no desires, and the people return to Simplicity (the Uncarved Block).`,
    chinese: `不出戶，知天下；<br>不窺牖，見天道。<br>其出彌遠，其知彌少。<br>是以聖人不行而知，不見而明，不為而成。`,
    commentary: `不出門戶，就能推知天下大事的道理；不望向窗外，就能察覺自然運行的規律。向外奔波得越遠，對生命本質的體<br>認反而越少。因此，聖人不必親身奔波就能明瞭事理，不必親眼窺察就能洞見真相，不刻意妄為就能成就萬物。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 48,
    title: ``,
    classical: `日損章`,
    english: `When the government is muddled and dull, the people are simple and honest. When the government is alert and vigilant, the people are anxious and dissatisfied. Disaster is that on which happiness relies; Happiness is that in which disaster is hidden. Who knows where the end will be? Is there no "Right"? What is "Right" turns into "Strange," and what is "Good" turns into "Evil." Truly, man has been deluded for a long time. Therefore the Sage is square but does not cut; He has edges but does not wound; He is straight but not unrestrained; He is bright but does not dazzle.`,
    chinese: `為學日益，為道日損。<br>損之又損，以至於無為。無為而無不為矣。<br>故取天下，常以無事，<br>及其有事，不足以取天下。<br>`,
    commentary: `追求學問是每天都在增加知識與技能，但體悟大道卻是每天都在減損執念與欲求。不斷地減損再減損，直到進入不<br>刻意妄為的境界。達到「無為」之後，反而因為順應自然，沒有什麼事情是做不成的。所以，想要治理天下，通常<br>應當採取不干擾百姓、清靜無事的方法，如果非要將天下佔為己有，以私心行事，那就不具備治理天下的資格了。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 49,
    title: ``,
    classical: `德善章`,
    english: `In ruling men and serving Heaven, there is nothing like Frugality (Storing up the Virtue). Frugality means to prepare early. To prepare early means to accumulate an abundance of Virtue (De). If there is an abundance of Virtue, there is nothing that cannot be overcome. If there is nothing that cannot be overcome, then no one knows his limits. If no one knows his limits, he can possess the state. The Mother of the state (the Tao) can endure for long. This is called having "deep roots and a firm foundation." It is the way to long life and lasting vision.`,
    chinese: `聖人常無心，以百姓之心為心。<br>善者，吾善之；不善者，吾亦善之；德善矣。<br>信者，吾信之；不信者，吾亦信之；德信矣。<br>聖人之在天下，歙歙焉，<br>為天下渾其心，百姓皆注其耳目，聖人皆孩之。`,
    commentary: `聖人沒有私心，而是以百姓的意願作為自己的心願。良善的人，我善待他；不良善的人，我也善待他，如此便能使<br>眾人趨於向善，成就德性的圓滿。誠信的人，我信任他；不誠信的人，我也信任他，如此便能使眾人守信，成就信<br>實的本質。聖人活在世界上，總是為眾生擔憂，為了天下人的福祉而混濁自己清靜的性體；所以百姓們都專注地觀<br>看聆聽著聖人的教導，而聖人則像看待孩子一樣，慈愛且平等地呵護著每一位百姓。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 50,
    title: ``,
    classical: `生死章`,
    english: `Ruling a large state is like frying a small fish (it must not be over-handled). When the world is governed according to the Tao, the spirits of the dead do not show their power. It is not that they lack power, but that their power does not harm men. Not only does their power do no harm, but the Sage also does no harm to the people. Since neither does any harm, their Virtues (De) meet and return to the same Source.`,
    chinese: `出生入死。<br>生之徒，十有三；死之徒，十有三；<br>人之生，動之死地者，亦十有三。<br>夫何故？以其生生之厚。<br>蓋聞善攝生者，路行不遇兕虎，入軍不被甲兵；<br>兕無所投其角，虎無所用其爪，兵無所容其刃。<br>夫何故？以其無死地。`,
    commentary: `人生即是從出生到死亡。正在生⻑的孩子約佔十分之三，邁向死亡的老人也約佔十分之三；而原本可以⻑壽，卻因<br>為過度耽溺於養生享樂、反使自己走向死地的，也佔了十分之三。這是什麼原因呢？是因為他們汲汲營營謀求衣⻝，<br>而傷害了生命。聽說善於攝養生命的人，在陸地上行走不會遇到犀牛或猛虎，進入軍隊也不會受到兵刃傷害。犀牛<br>對他無處投以利角，猛虎對他無處施以利爪，武器對他無處刺以鋒刃。這是什麼原因呢？因為他順應自然，心中沒<br>有對立與殺機，所以他的生命中沒有進入死地的缺口。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 51,
    title: ``,
    classical: `尊貴章第五十一
`,
    english: `A large state is like the low-lying land where all streams flow. It is the Universal Mother, the meeting-place of the world. The Feminine always overcomes the Masculine by stillness; and because she is still, she takes the lower place. Therefore, if a large state takes a lower place than a small state, it wins the small state. If a small state takes a lower place than a large state, it wins the large state. One wins by taking the lower place; the other wins by being already low. A large state only desires to protect and nourish all alike; a small state only desires to enter and serve. Both get what they wish; but it is for the great to practice humility (the lower place).`,
    chinese: `道生之，德畜之，物形之，勢成之。<br>是以萬物莫不尊道而貴德。<br>道之尊，德之貴，夫莫之命而常自然。<br>故道生之，德畜之；長之育之；成之熟之；養之覆之。<br>生而不有，為而不恃，長而不宰。是謂玄德。`,
    commentary: `萬物由「道」所化生，由「德」所撫育，由物質構成形態，由環境促成生⻑。因此，萬物沒有不尊崇道、不珍貴德<br>的。道之所以受尊崇，德之所以顯珍貴，是因為它們從不干涉萬物，而是任由萬物順應自然地生⻑。所以說，道生<br>化萬物，德養育萬物，使它們成⻑、發育，使它們成熟、結果，並對其愛護與庇蔭。生養了萬物而不據為己有，成<br>就了萬物而不自恃有功，引領著萬物而不主宰控制，這就是最深奧、最幽微的「玄德」。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 52,
    title: ``,
    classical: `守⺟章`,
    english: `The Tao is the sanctuary of all things; The treasure of the good man, the protector of the bad. Fine words may be used for marketing; noble deeds may be used to gain respect. Even if a man is bad, why should he be abandoned? Therefore, at the enthronement of an Emperor or the appointment of the Three Ministers, though one may have large jewels and a team of four horses to precede him, it is better to remain still and offer this Tao. Why did the ancients so highly value this Tao? Was it not because they said: "Seek and you shall find; sin and you shall be forgiven"? Therefore, it is the greatest treasure under heaven.`,
    chinese: `天下有始，以為天下母。<br>既得其母，以知其子，既知其子，復守其母，沒身不殆。<br>塞其兌，閉其門，終身不勤。<br>開其兌，濟其事，終身不救。<br>見小曰明，守柔曰強。<br>用其光，復歸其明，無遺身殃；是為襲常。`,
    commentary: `天地萬物的化生都有一個原始的開端，這個開端可以看作是天下萬物的⺟親。既然掌握了這位「⺟」，就能進一步<br>認識由它所衍生的「子」；而在認識了萬物之後，又能返回守住那根本的道，如此一生都不會遭遇危險。收斂感官<br>的孔竅，關閉欲念的門戶，一輩子都不會感到勞頓疲憊。相反地，如果放任感官去追求外物，並耗費心機去處理各<br>種繁雜的俗事，那這輩子就沒救了。能察覺到隱微的意念叫做「明」，能守住柔弱順應之姿的叫做「強」。運用智<br>慧的光芒，再返回來照徹內心的清明，不讓真我留下遺憾，這就是所謂的承襲永恆不變的自然法則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 53,
    title: ``,
    classical: `大道章`,
    english: `Practice Non-action (Wu-Wei); attend to nothingness; taste the flavourless. Consider the small as large and the few as many; requite hatred with Virtue (De). Deal with the difficult while it is still easy; manage the great while it is still small. The difficult things of the world must once have been easy; the great things of the world must once have been small. Therefore, the Sage never attempts anything great, and thus his greatness is achieved. He who promises lightly will rarely keep his word; he who considers everything easy will find many difficulties. Therefore, the Sage considers everything difficult, and so in the end he finds no difficulty.`,
    chinese: `使我介然有知，行於大道，惟施是畏。大道甚夷，而民好捷徑。朝<br>甚除，田甚蕪，倉甚虛；服文采，帶利劍，厭飲食，財貨有餘；是<br>謂盜誇。非道也哉！`,
    commentary: `假使我稍微有一點覺悟與智慧，並行走於自然大道之中，我最擔心的就是怕自己走入歧路而流於炫耀。大道本來是<br>非常平坦好走的，但百姓卻偏偏喜歡走那些險峻的捷徑。看看現在的朝廷都不保了，田園卻荒蕪不堪，糧倉也空虛<br>無物。然而統治者仍穿著華美的衣服，佩帶著鋒利的寶劍，吃厭了精緻的美⻝，還囤積了剩餘過多的財物，這簡直<br>就是強盜自誇其富有。這完全是背離大道、違背自然規律的啊！`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 54,
    title: ``,
    classical: `善建章`,
    english: `What is well planted cannot be uprooted; what is well embraced cannot slip away. Through the Virtue (De) of the ancestors, the sacrifices will never cease. Cultivate it in your own person, and its Virtue will be real; Cultivate it in the family, and its Virtue will be abundant; Cultivate it in the village, and its Virtue will endure; Cultivate it in the state, and its Virtue will be flourishing; Cultivate it in the world, and its Virtue will be universal. Therefore, by one's own person, one may judge other persons; By one's own family, one may judge other families; By one's own village, one may judge other villages; By one's own state, one may judge other states; By one's own world, one may judge the world. How do I know that the world is so? By this.`,
    chinese: `善建者不拔，善抱者不脫，子孫以祭祀不輟。<br>修之於身，其德乃真；修之於家，其德乃餘；<br>修之於鄉，其德乃長；修之於國，其德乃豐；<br>修之於天下，其德乃普。<br>故以身觀身，以家觀家，<br>以鄉觀鄉，以國觀國，以天下觀天下。<br>吾何以知天下之然哉？以此。`,
    commentary: `善於建立道德的人，其根基不會被拔除；善於持守道心的人，其信念堅定而不會脫失。如果能將這種精神傳承下去，<br>子孫的祭祀將會世代延續，永不間斷。將這種道的修養落實在自身，德性就會純真切實；落實在家庭，其德性能庇<br>蔭家人；落實在鄉里，鄉里就會德性增⻑；落實在國家，國家就會繁榮豐沛；落實在天下，天下就會使道普及。<br><br>所以，要以個人處境來觀察他人，以自己的家庭的來觀察他人的家庭，以自己的鄉里來觀察其他的鄉里，以自己的<br>國家來觀察其他的國家，以當今天下的動向來觀察天下的趨勢。我憑什麼知道天下運行的規律與現狀呢？就是這樣。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 55,
    title: ``,
    classical: `含德章`,
    english: `He who possesses the fullness of Virtue (De) is like a little child. Poisonous insects will not sting him; wild beasts will not seize him; birds of prey will not strike him. His bones are soft, his sinews are weak, yet his grip is firm. He does not yet know the union of male and female, yet his organ can be stirred; this is because his Vital Essence is at its height. He can cry all day without becoming hoarse; this is because his Innate Harmony is at its height. To know harmony is to know the "always-so"; To know the "always-so" is to be Illumined. To force the growth of life is an ill omen; For the heart to direct the breath is called violence. Things that grow to their full strength soon begin to decay. This is called "not being in the Tao." Whatever is not in the Tao soon comes to an end.`,
    chinese: `含德之厚，比於赤子。<br>毒蟲不螫，猛獸不據，攫鳥不搏。<br>骨弱筋柔而握固。未知牝牡之合而脧作，精之至也。<br>終日號而不嗄，和之至也。<br>知和曰常，知常曰明，益生曰祥。<br>心使氣曰強，物壯則老，是謂不道，不道早已。`,
    commentary: `道德涵養深厚的人，就如同剛出生的嬰兒一般純真質樸。毒蟲不會螫咬他，猛獸不會抓捕他，鳥禽也不會搏擊他。<br>他的筋骨雖然柔弱，但小手卻能握得很緊；他雖然還不懂男女交合之事，但陽物卻會自然勃起，這是因為精氣充沛<br>到了極點。他整天大聲啼哭，嗓子卻不會沙啞，這是因為體內的太和之氣達到了極致。能保守太和之器叫做「常」，<br>能體認永恆大道叫做「明」。能保養⻑生之道叫做「祥」。妄動暴躁，自以為剛強叫做「逞強」。事物如果強大壯<br>盛，就會走向衰老；背離了自然之道，生命就會提早終結。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 56,
    title: ``,
    classical: `道貴章`,
    english: `Those who know do not speak; those who speak do not know. Close the mouth; shut the gates (of the senses). Blunt the sharpness; unravel the knots; Temper the brightness; identify yourself with the dust. This is what is called Mysterious Unity (Xuan Tong). Therefore, no one can be intimate with him, nor can anyone be distant from him. No one can benefit him, nor can anyone harm him. No one can ennoble him, nor can anyone debase him. Therefore, he is the most noble thing under heaven.`,
    chinese: `知者不言，言者不知。<br>塞其兌，閉其門，挫其銳，解其紛，和其光，同其塵，是謂玄同。<br>故不可得而親，亦不得而疏；<br>不可得而利，亦不可得而害；<br>不可得而貴，亦不可得而賤。故為天下貴。`,
    commentary: `真正領悟大道的人知道「道」無法用言語表達，而到處宣揚的人往往並非真正體悟。收斂感官的孔竅，關閉欲念的<br>門戶，消解原本銳利的鋒芒，排解紛擾的糾結，將光芒含藏而顯得柔和，將自己混同於塵世的平凡之中，這就叫做<br>深奧微妙的「玄同」境界。達到這種境界的人，已經超越了世俗的情感與利害，你既無法親近他，也無法疏遠他；<br>既無法給予他利益，也無法對他造成傷害；既無法使他變得尊貴，也無法使他顯得卑賤。正因為他超脫了這一切對<br>立與牽絆，所以才成為天下最尊貴的存在。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 57,
    title: ``,
    classical: `治國章`,
    english: `Govern a state with righteousness; conduct a war with craft; but win the world by Non-interference (Wu-Shi). How do I know this is so? By this: The more prohibitions there are, the poorer the people become. The more sharp weapons the people have, the more troubled is the state. The more cunning and skill man possesses, the more strange things happen. The more laws and edicts are multiplied, the more thieves and robbers there are. Therefore the Sage says: I take Non-action (Wu-Wei), and the people transform themselves; I love quietude, and the people right themselves; I do not meddle, and the people prosper by themselves; I have no desires, and the people return to Simplicity (the Uncarved Block).`,
    chinese: `以正治國，以奇用兵，以無事取天下。吾何以知其然哉？以此：<br>天下多忌諱，而民彌貧；人多利器，國家滋昏；<br>人多伎巧，奇物滋起；法令滋彰，盜賊多有。<br>故聖人云：<br>我無為而民自化；我無事而民自富；我好靜而民自正；<br>我無欲而民自樸；我無情而民自清。`,
    commentary: `治理國家要用光明正大的法制，帶兵作戰要用出奇制勝的謀略，而治理天下則要以使百性平安無事，來取得天下百姓的心。<br>我憑什麼知道是這樣呢？是根據這些：天下的禁令與忌諱越多，百姓就越陷於貧窮；民間的權謀與利器越多，國家就越陷入<br>昏亂；人們的鑽營巧思越多，各種稀奇古怪的事物就越層出不窮；法律條文制定得越繁瑣嚴苛，盜賊反而越加橫行。所以聖<br>人說：只要我守住「無為」，百姓自然會順應本性而自我化育；只要我不生事干擾，百姓自然會富庶康樂；只要我喜好清靜，<br>百姓自然會歸於端正；只要我沒有貪欲，百姓自然會回歸淳樸；只要我摒除私情偏執，百姓的心境自然會清澈安寧。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 58,
    title: ``,
    classical: `察政章`,
    english: `When the government is muddled and dull, the people are simple and honest. When the government is alert and vigilant, the people are anxious and dissatisfied. Disaster is that on which happiness relies; Happiness is that in which disaster is hidden. Who knows where the end will be? Is there no "Right"? What is "Right" turns into "Strange," and what is "Good" turns into "Evil." Truly, man has been deluded for a long time. Therefore the Sage is square but does not cut; He has edges but does not wound; He is straight but not unrestrained; He is bright but does not dazzle.`,
    chinese: `其政悶悶，其民淳淳；其政察察，其民缺缺。<br>禍兮福所倚，福兮禍所伏。孰知其極？其無正耶。<br>正復為奇，善復為妖。人之迷也，其日固久矣。<br>是以聖人，方而不割，廉而不劌，直而不肆，光而不耀。`,
    commentary: `政府的治理寬厚隨和，百姓就會淳樸敦厚；政府的治理嚴苛精明，百姓就會狡詐缺憾。災禍中往往依傍著福分，福分中也常常隱藏著災禍。誰能知道它們的究竟呢？難道沒有一個絕對的標準嗎？原本的正道會被當成奇怪的言論，原本的良善也被認為是為妖邪。人們對這種變幻無常的道理感到迷惘，確實經很久了。因此，聖人處事方正卻不割傷他人，銳利卻不傷人皮肉，直率卻不放肆傲慢，光亮卻不刺眼。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 59,
    title: ``,
    classical: `⻑生章`,
    english: `In ruling men and serving Heaven, there is nothing like Frugality (Storing up the Virtue). Frugality means to prepare early. To prepare early means to accumulate an abundance of Virtue (De). If there is an abundance of Virtue, there is nothing that cannot be overcome. If there is nothing that cannot be overcome, then no one knows his limits. If no one knows his limits, he can possess the state. The Mother of the state (the Tao) can endure for long. This is called having "deep roots and a firm foundation." It is the way to long life and lasting vision.`,
    chinese: `治人事天，莫若嗇。夫唯嗇，是謂早服；早服謂之重積德；重積德<br>則無不克；無不克，則莫知其極；莫知其極，可以有國；有國之母，<br>可以長久；是謂深根固蒂，長生久視之道。`,
    commentary: `治理百姓和事奉自然，沒有比即愛惜精神、不輕易外洩更重要的了。所謂愛惜精神，就是指早起穿衣服一樣，都是<br>每天必要的日常，而行善積德就像日常一樣，就能積累深厚德行。不斷積累深厚的德行，就沒有什麼困難是不能克<br>服的；既然沒有什麼不能克服，就沒有人能測量出他力量的極限。擁有了這種不可限量的力量，就可以擔負起治理<br>國家的重任。能勝任國家的保⺟，治理天下就能⻑治久安。這就是所謂的根基深厚、基礎牢固，是生命⻑久延續、<br>永恆存在的根本法則。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 60,
    title: ``,
    classical: `治大國章`,
    english: `Ruling a large state is like frying a small fish (it must not be over-handled). When the world is governed according to the Tao, the spirits of the dead do not show their power. It is not that they lack power, but that their power does not harm men. Not only does their power do no harm, but the Sage also does no harm to the people. Since neither does any harm, their Virtues (De) meet and return to the same Source.`,
    chinese: `治大國，若烹小鮮。<br>以道蒞天下，其鬼不神；<br>非其鬼不神，其神不傷民；<br>非其神不傷民，聖人亦不傷民。<br>夫惟兩不相傷，故德交歸焉。`,
    commentary: `治理大國就像烹煮小魚一樣，不能隨意翻動，否則魚肉就會碎掉，比喻治理應當清靜無為，不可朝令夕改。當以<br>「道」來治理天下時，那些鬼怪邪祟就不再顯靈作祟。不只鬼怪不作祟，神明也不再懲罰百姓。不僅神明不再懲罰<br>百姓，連有道的聖人也不會為了匡正百姓而去傷害百姓。因為鬼神與聖人都不傷害百姓，所以這份祥和的德性會相<br>互交融，最終歸結到百姓身上，使天下太平。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 61,
    title: ``,
    classical: `為下章`,
    english: `A large state is like the low-lying land where all streams flow. It is the Universal Mother, the meeting-place of the world. The Feminine always overcomes the Masculine by stillness; and because she is still, she takes the lower place. Therefore, if a large state takes a lower place than a small state, it wins the small state. If a small state takes a lower place than a large state, it wins the large state. One wins by taking the lower place; the other wins by being already low. A large state only desires to protect and nourish all alike; a small state only desires to enter and serve. Both get what they wish; but it is for the great to practice humility (the lower place).`,
    chinese: `大國者下流，天下之交。<br>天下之交，牝常以靜勝牡，以靜為下。<br>故大國以下小國，則取小國；小國以下大國，則取大國。<br>故或下以取，或下而取。<br>大國不過欲兼畜人，小國不過欲入事人。<br>兩者各得所欲，故大者宜為下。`,
    commentary: `大國應該像江河的下游一樣，是天下交流匯聚之處。在天下的交際往來中，柔弱的雌性經常以寧靜勝過剛強的雄性，<br>因為其處於謙下的地位。所以，大國如果對小國表現謙下，就能贏得小國的信服；小國如果對大國表現謙下，就能<br>得到大國的接納與包容。所以，有的是透過謙下來取得對方的信任，有的是因為以卑下自處而獲得庇護。大國的願<br>望不過是想兼容並蓄，照顧天下，小國的願望不過是想事奉大國尋求百姓的安定。為了讓兩者都能各取所需、達成<br>願望，大國更應該展現謙下、包容的姿態。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 62,
    title: ``,
    classical: `道奧章`,
    english: `The Tao is the sanctuary of all things; The treasure of the good man, the protector of the bad. Fine words may be used for marketing; noble deeds may be used to gain respect. Even if a man is bad, why should he be abandoned? Therefore, at the enthronement of an Emperor or the appointment of the Three Ministers, though one may have large jewels and a team of four horses to precede him, it is better to remain still and offer this Tao. Why did the ancients so highly value this Tao? Was it not because they said: "Seek and you shall find; sin and you shall be forgiven"? Therefore, it is the greatest treasure under heaven.`,
    chinese: `道者萬物之奧。善人之寶，不善人之所保。<br>美言可以市，尊行可以加人。人之不善，何棄之有？<br>故立天子，置三公，雖有拱璧，以先駟馬，不如坐進此道。<br>古之所以貴此道者？何不曰求以得，有罪以免耶？故為天下貴。`,
    commentary: `「道」是萬物最深奧的歸宿，是善人的法寶，也是不善之人用來保全自己的依賴。美好良善的言語可以使人心悅誠<br>服，尊嚴高尚的行為可以讓人高於他人；未明理的不善之人，見了嘉言善行幡然改過，難道道有遺棄他們嗎？所以，<br>世人皆以成為天子，擁有文武百官為貴，雖然擁有巨大的玉璧、配備華麗車隊，這些榮耀，都遠遠不如坐下來潛心<br>進修這大道。古人之所以如此推崇這大道，是為什麼呢？不正是因為「道」能讓人求而得之，且能讓有罪的人能得<br>到洗滌與寬恕、免於禍害嗎？正因如此，「道」才是天下最尊貴的存在。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 63,
    title: ``,
    classical: `無難章`,
    english: `Practice Non-action (Wu-Wei); attend to nothingness; taste the flavourless. Consider the small as large and the few as many; requite hatred with Virtue (De). Deal with the difficult while it is still easy; manage the great while it is still small. The difficult things of the world must once have been easy; the great things of the world must once have been small. Therefore, the Sage never attempts anything great, and thus his greatness is achieved. He who promises lightly will rarely keep his word; he who considers everything easy will find many difficulties. Therefore, the Sage considers everything difficult, and so in the end he finds no difficulty.`,
    chinese: `為無為，事無事，味無味。<br>大小多少，報怨以德。<br>圖難於其易，為大於其細；<br>天下難事，必作於易；天下大事，必作於細。<br>是以聖人，終不為其大，故能成其大。<br>夫輕諾必寡信，多易必多難。<br>是以聖人猶難之故，終無難。`,
    commentary: `以「無為」的態度去作為，以「不生事」的方式去處事，以「恬淡無味」去品味人生。無論面對的是大事或小事、多數或少<br>數，都應抱持平常心，甚至能以德報怨。想要解決困難的事，要從容易的地方著手；想要成就遠大的目標，要從微小的細節<br>開始。天下的難事，必定是從容易的地方發展而來的；天下的大事，也必定是從細微的地方累積而成的。因此，聖人始終不<br>刻意追求宏大，反而能成就其偉大。輕易許下諾言的人，必然缺乏誠信；把事情看得太過容易的人，必然會遭遇許多困難。<br>所以聖人遇事總能謹慎、嚴肅地看待其中的困難，最終反而能化險為夷，一生沒有解決不了的難題。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 64,
    title: ``,
    classical: `輔物章`,
    english: `What is at rest is easy to hold; what has not yet appeared is easy to prevent. What is frail is easy to break; what is minute is easy to scatter. Deal with a thing before it comes into being; put it in order before it becomes confused. A tree as big as a man's embrace grows from a tiny sprout; a tower nine stories high rises from a heap of earth; a journey of a thousand miles begins with a single step. He who acts, spoils it; he who grasps, loses it. Because the Sage does not act, he does not spoil; because he does not grasp, he does not lose. In their business, people often fail when they are on the verge of succeeding. If one is as careful at the end as at the beginning, there will be no failure. Therefore, the Sage desires to have no desire, and does not value rare treasures. He learns what is unlearned and returns to the source that the multitude has passed by. He helps the ten thousand creatures to find their own nature (Ziran), but he does not dare to act.`,
    chinese: `其安易持，其未兆易謀。其脆易泮，其微易散。<br>為之於未有，治之於未亂。<br>合抱之木，生於毫末；<br>九層之臺，起於累土；<br>千里之行，始於足下。<br><br>為者敗之，執者失之。<br>是以聖人無為故無敗，無執故無失。<br>民之從事，常幾於成而敗之。慎終如始，則無敗事。<br>是以聖人，<br>欲不欲，不貴難得之貨；學不學，復眾人之所過。<br>以輔萬物之自然，而不敢為。`,
    commentary: `事物在安定時容易持守，在徵兆未顯時容易謀劃。脆弱的容易消解，微小的容易散失。要在事情尚未發生前就先處<br>理，要在動亂尚未產生前就先治理。數人才能合抱的大樹是由細小的幼苗⻑成的；九層的高台是從第一筐泥土築起<br>的；千里的遠行是從腳下的第一步開始的。<br><br>刻意強求的人往往會失敗，執著不放的人往往會失去。因此聖人順應自然、不妄為，所以不會失敗；不偏執，所以<br>不會有損失。一般人做事，常在接近成功時卻失敗了。如果能像剛開始時那樣謹慎地對待結束，就不會有失敗的事<br>了。所以聖人追求眾人所不追求的，不珍視難得的財物；學習眾人所忽略的，去補救大眾常犯的過錯。他只是輔助<br>萬物順應自身的天性發展，而不敢依照私欲妄加干預。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 65,
    title: ``,
    classical: `玄德章`,
    english: `In ancient times, those who were skilled in the Tao did not use it to make the people clever, but to keep them simple. The reason why the people are difficult to govern is that they have too much (worldly) knowledge. Therefore, to govern a state by cleverness is to ruin the state; to govern a state without cleverness is a blessing to the state. He who knows these two things knows the Standard. To be always mindful of this Standard is what is called Mysterious Virtue (Xuan De). Mysterious Virtue is deep and far-reaching; it returns with all things to the Source. Only then is the Great Harmony achieved.`,
    chinese: `古之善為道者，非以明民，將以愚之。<br>民之難治，以其智多。<br>故以智治國，國之賊；不以智治國，國之福。知此兩者，亦楷式。<br>常知楷式，是謂玄德。<br>玄德深矣，遠矣，與物反矣，然後乃至大順。`,
    commentary: `古時候善於實踐大道的人，並不是教導百姓運用心機與巧詐，而是要讓他們回歸純真質樸的本性。百姓之所以難以<br>治理，是因為他們充滿了過多的心機與狡詐。所以，用權謀智慧來治理國家，反而是對國家的傷害；不用權謀、而<br>以淳樸自然來治理國家，才是國家的福氣。能明白這兩種治理方式的差別，就是成為了治國的榜樣。能恆常守住這<br>個榜樣準則，就稱為「玄德」。玄德是如此幽深、如此遼遠，它引導萬物回歸本真，雖然其表現與世俗的認知相反，<br>但最終能帶領世間達到最完美的和諧與順遂。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 66,
    title: ``,
    classical: `江海章`,
    english: `The reason why the River and the Sea are able to be the kings of a hundred mountain streams is that they take the lower place. Therefore, they can be the kings of them all. So, if the Sage wishes to be above the people, he must speak as though he were below them; if he wishes to lead them, he must place himself behind them. In this way, though he is above them, the people do not feel his weight; though he is in front of them, the people do not feel his obstruction. Therefore, the whole world delights in praising him and never tires of him. Because he does not strive, no one in the world can strive against him.`,
    chinese: `江海之所以能為百谷之王者，以其善下之，故能為百谷王。<br>是以聖人，欲上民，必以言下之；欲先民，必以身後之。<br>是以聖人，處上而民不重，處前而民復害。<br>是以天下樂推而不厭。以其不爭，故天下莫能與之爭。`,
    commentary: `江海之所以能成為千百條河流匯聚的王者，是因為它甘願處於低下的地位，所以能成為百谷之王。因此，聖人若想<br>居於百姓之上，言談間必定對人謙下；若想領導百姓，行為上必定將自己的利益置於人後。因為聖人如此謙卑、無<br>私，所以他雖然身處高位，百姓也不會覺得沉重負累；雖然走在前面，百姓也不會感到受威脅或妨礙。正因如此，<br>普天下的人都樂意推舉他而不感到厭倦。因為他不與人競爭，所以天下也沒有人能跟他競爭。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 67,
    title: ``,
    classical: `三寶章`,
    english: `Every one under heaven says that my Tao is great, yet it seems unlike anything else. It is precisely because it is great that it seems unlike anything else. If it were like anything else, it would have become small long ago. I have Three Treasures which I hold fast and watch over: The first is Compassion (Ci); The second is Frugality (Jian); The third is Not daring to be first in the world. Because I am compassionate, I can be brave; Because I am frugal, I can be generous; Because I dare not be first in the world, I can become the leader of all vessels. Nowadays, people leave compassion and try to be brave; they leave frugality and try to be generous; they leave the hindmost place and try to be first. This leads only to death. For compassion wins in the attack and is firm in the defense. Heaven will arm with compassion those whom it would not see destroyed.`,
    chinese: `天下皆謂我道大，似不肖。夫唯大，故似不肖。<br>若肖久矣，其細也夫！<br>我有三寶，持而保之。一曰慈，二曰儉，三曰不敢為天下先。<br>夫慈故能勇；儉故能廣；不敢為天下先，故能成器長。<br>今捨其慈且勇；捨其儉且廣；捨其後且先；死矣！<br>夫慈以戰則勝，以守則固。天將救之，以慈衛之。`,
    commentary: `天下人都說我所說的道過於博大，以至於不像任何具體的東⻄；正因為它博大，所以才顯得不像具體之物，如果像<br>具體之物，它早就變得微不足道了。我有三件寶貝，始終持守著：一是仁慈，二是儉約，三是不敢居於天下人的領<br>先地位。因為仁慈所以能產生勇氣，因為儉約所以能蓄積廣大力量，因為不敢爭先所以能成為萬物的首⻑。如果現<br>在的人捨棄仁慈而追求勇敢、捨棄儉約而追求擴張、捨棄退後而爭取領先，那就是走向死亡。仁慈用來作戰就能獲<br>勝，用來守禦就能堅固，上天如果要救助誰，就會用慈愛來保護他。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 68,
    title: ``,
    classical: `不爭章`,
    english: `A good warrior is not violent; A good fighter is not angry. A good winner does not strive; A good employer of men takes a lower place. This is called the Virtue of Non-striving; This is called the power of using men; This is called matching the sublimity of Heaven, the highest principle of old.`,
    chinese: `善為士者不武；善勝者不怒；<br>善戰敵者不與；善用人者為之下。<br>是謂不爭之德，<br>是謂用人之力，<br>是謂配天，古之極。`,
    commentary: `最好的勇士不逞強好勇；最好的戰士不輕易暴躁動怒；善於打勝仗的人不輕易與對方交鋒；善於用人的人待人謙卑<br>低下。這就叫作不與人爭的美德，這就是用人的真正力量，這就適配合天地的德行，順應古道最極致的表現。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 69,
    title: ``,
    classical: `用兵章`,
    english: `The strategists have a saying: "I dare not be the host (take the offensive), but prefer to be the guest. I dare not advance an inch, but prefer to retreat a foot." This is called marching without moving; rolling up one's sleeves without baring the arms; capturing the enemy without a confrontation; arming oneself without weapons. There is no greater disaster than underestimating the enemy. To underestimate the enemy is to risk losing my Three Treasures. Therefore, when opposing armies meet, the one who feels pity (sorrow) will be the victor.`,
    chinese: `用兵有言：<br>吾不敢為主而為客；不敢進寸而退尺。<br>是謂行無行；扔無臂；仍無敵；執無兵。<br>禍莫大於輕敵，輕敵則幾喪吾寶。<br>故抗兵相加，哀者勝矣。`,
    commentary: `用兵的人有句名言：我不敢主動採取攻勢而是不得已而應戰，不敢前進一寸爭奪敵方地盤而寧願後退一尺。這就是<br>行軍佈陣沒有一定的行列陣式，雖然要舉臂卻像沒有手臂可舉；沒有敵意使敵人自願跟隨我方，雖然要執持武器卻<br>像沒有拿著兵器。災禍沒有比輕視敵人更大的了，輕視敵人幾乎會喪失我所珍視的三寶。所以當兩軍實力相當、陷<br>入僵持時，能悲天憫人的一方終能獲得勝利。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 70,
    title: ``,
    classical: `懷玉章`,
    english: `My words are very easy to understand and very easy to practice. Yet no one in the world can understand them or practice them. My words have an Ancestor (the Source); my deeds have a Master (the Tao). It is because people do not know this that they do not understand me. Because those who understand me are few, those who follow me are distinguished. Therefore, the Sage wears coarse cloth on the outside, but carries Jade (the True Essence) within his breast.`,
    chinese: `吾言甚易知，甚易行。天下莫能知，莫能行。<br>言有宗，事有君。<br>夫唯無知，是以不我知。知我者希，則我貴矣。<br>是以聖人被褐懷玉。`,
    commentary: `我的話非常容易理解，也非常容易實行，但天下卻沒有人能真正理解，也沒有人能真正實行。言語都有其宗旨，行<br>事都有其根據。正因為眾人不能理解這些道理，所以才不了解我。了解我的人越稀少，我的道也就越顯得珍貴。因<br>此聖人就像外表穿著粗布衣裳，卻懷抱著美玉。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 71,
    title: ``,
    classical: `不病章`,
    english: `To know that one does not know is the highest attainment. Not to know, yet to think that one knows, is a disease. Only by recognizing this disease as a disease can one be free from it. The Sage is free from this disease. Because he recognizes it as a disease, he is free from it.`,
    chinese: `知不知上；不知知病。<br>夫唯病病，是以不病。<br>聖人不病，以其病病。`,
    commentary: `知道自己還有所不知，這是最上等的；不知道卻自以為知道，這是嚴重的毛病。唯有把這種「自以為知」當作是病，<br>才能不犯這種病。聖人之所以沒有這種毛病，是因為他把這種毛病當作病來警惕，所以才不會犯病。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 72,
    title: ``,
    classical: `畏威章`,
    english: `When the people do not fear your power, a greater power will descend upon them. Do not restrict their living space; do not weigh down their lives. It is only because you do not oppress them that they will not grow weary of you. Therefore, the Sage knows himself but does not show himself; He loves himself (his True Self) but does not exalt himself. He rejects the "one" (outward display) and chooses the "other" (inner reality).`,
    chinese: `民不畏威，則大威至。<br>無狹其所居，無厭其所生。<br>夫唯不厭，是以不厭。<br>是以聖人，自知不自見；自愛不自責。<br>故去彼取此。`,
    commentary: `當百姓不再畏懼統治者的威權時，那麼真正可怕的大災難或大變動就要降臨了。不要限制百姓的生存空間使其感到<br>狹隘，不要壓迫百姓的生活使其感到厭惡。正因為統治者不讓百姓感到厭惡，百姓才不會厭惡統治者。因此聖人有<br>自知之明，卻不自我顯揚；愛惜自己，卻不自顯尊貴。所以要捨棄自我顯揚與尊貴，採取自知與自愛的態度。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 73,
    title: ``,
    classical: `天網章`,
    english: `He who is brave in daring will be killed; He who is brave in not daring will survive. Of these two, one is profitable and the other is harmful. Who knows the reason for Heaven's dislikes? Even the Sage finds this a difficult question. The Tao of Heaven does not strive, yet it excels in conquering; It does not speak, yet it excels in responding; It does not summon, yet things come of their own accord; It is quiet, yet it excels in planning. The Net of Heaven is vast; its meshes are wide, yet nothing slips through.`,
    chinese: `勇於敢則殺，勇於不敢則活。<br>此兩者，或利或害。天下所惡。<br>孰知其故？是以聖人，猶難之矣。<br>天之道，不爭而善勝，不言而善應，不召而自來，<br>繟然而善謀。天網恢恢，疏而不失。`,
    commentary: `勇於表現剛強果敢的就會招致死亡，勇於表現柔弱退讓的就能活命。這兩種勇氣，一種有利，一種有害。上天所厭<br>惡的，誰能知道其中的原因呢？所以即使是聖人也感到難以解說。道的規律是：不與人爭卻讓萬物自然順應其發展，<br>不用說話但能得到萬物自然地響應，不召喚而萬物自動歸附。道總是從容不迫卻好像早已安排好了一切。上天的法<br>網廣大無邊，雖然網目稀疏，卻不會漏掉任何一件事。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 74,
    title: ``,
    classical: `司殺章`,
    english: `If the people do not fear death, what is the use of trying to frighten them with death? If we make the people constantly fear death, and we seize and kill those who do wrong, who would dare to act? There is always the Master Executioner (Heavenly Law) who kills. To take the place of the Master Executioner is like trying to do the work of a master carpenter. He who tries to do the master carpenter's chipping will rarely escape cutting his own hands.`,
    chinese: `民常不畏死，奈何以死懼之。<br>若使民常畏死，而為奇者，吾得執而殺之，孰敢？<br>常有司殺者殺。<br>夫代司殺者，是謂代大匠斲，<br>夫代大匠斲者，希有不傷其手矣。`,
    commentary: `百姓如果已經窮困痛苦到不再害怕死亡，又怎麼能用死刑來威脅他們呢？假使百姓真的畏懼死亡，而對於那些作亂<br>違法的人，我們抓來處死，那麼還有誰敢作亂？冥冥中自有主宰殺伐的人負責執行。如果人要代替上天主掌殺伐，<br>就好比替高明的木匠砍伐木材；代替高明的木匠砍伐木材的人，很少有不傷到自己手的。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 75,
    title: ``,
    classical: `貴生章`,
    english: `The people are starving because those above them eat too much in taxes; that is why they starve. The people are difficult to govern because those above them interfere too much; that is why they are difficult to govern. The people lightheartedly face death because those above them live too luxuriously; that is why they face death lightheartedly. Truly, only those who do not strive after the "fullness of life" are the truly wise in valuing life.`,
    chinese: `民之飢，以其上食稅之多，是以饑。<br>民之難治，以其上之有為，是以難治。<br>民之輕死，以其求生之厚，是以輕死。<br>夫唯無以生為者，是賢於貴生。`,
    commentary: `百姓之所以遭受飢荒，是因為統治者徵收的稅收太多，所以才陷入飢餓。百姓之所以難以治理，是因為統治者喜歡<br>多事妄為，所以才難以治理。百姓之所以輕視死亡，是因為統治者過度追求奢華的生活，厚斂民財，使得百姓生活<br>不下去，所以才輕視死亡。只有那種不為了生活享受而強作妄為的人，才比過於看重自身生命享樂的人更加賢明。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 76,
    title: ``,
    classical: `柔弱章`,
    english: `When a man is born, he is soft and weak; when he dies, he is stiff and hard. When the ten thousand creatures, the plants and trees, are born, they are soft and tender; when they die, they are withered and brittle. Therefore, the stiff and hard are the companions of death; The soft and weak are the companions of life. Thus, if an army is too strong, it will not conquer; If a tree is too stiff, it will break. The hard and strong will be brought low; the soft and weak will be exalted.`,
    chinese: `人之生也柔弱，其死也堅強。<br>萬物草木之生也柔脆，其死也枯槁。<br>故堅強者死之徒，柔弱者生之徒。<br>是以兵強則不勝，木強則拱。堅強居下，柔弱居上。<br>`,
    commentary: `人活著的時候身體是柔軟的，死後就變得僵硬；萬物草木活著的時候是柔嫩脆弱的，死後就變得乾枯凋零。所以，<br>堅硬強大是屬於死亡的一類，柔弱細嫩是屬於生存的一類。因此，軍隊過於強大就不能獲勝，樹木過於強大就會被<br>砍伐。堅強的處於劣勢，柔弱的反而佔據優勢。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 77,
    title: ``,
    classical: `天道章`,
    english: `Is not the Tao of Heaven like the drawing of a bow? It brings down that which is high and raises up that which is low. It takes from those who have too much and gives to those who have not enough. The Tao of Heaven takes from the surplus to supplement the deficient. The way of man is not so; it takes from the deficient to serve those who have a surplus. Who is there that can use his surplus to serve the world? Only he who possesses the Tao. Therefore, the Sage acts but does not rely on his own ability; His work is done, but he does not stay in it; He has no desire to display his merits.`,
    chinese: `天之道，其猶張弓乎？<br>高者抑之，下者舉之。有餘者損之，不足者與之。<br>天之道，損有餘而補不足。人之道則不然，損不足以奉有餘。<br>孰能以有餘奉天下？唯有道者。<br>是以聖人為而不恃，功成而不處，不欲見賢。`,
    commentary: `自然的規律，難道不像張開弓弦嗎？往上拉就被壓低，往下拉就被抬高；有多的就減少一些，不足就增加一些。道<br>的規律就是減少多餘的來補貼不足。但人類社會的規則卻不是這樣，反而是犧牲不足的人，來奉獻給富有餘裕的人。<br>誰能把多餘的力量奉獻給天下人呢？唯有領悟了大道的人才能做到。因此聖人有所作為，卻不自恃己能，成就了功<br>業卻不歸功於自己，他不希望彰顯自己的賢能。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 78,
    title: ``,
    classical: `水德章`,
    english: `Nothing in the world is softer and weaker than water. Yet, for attacking the hard and strong, nothing can surpass it, because nothing can change it. That the weak overcomes the strong, and the soft overcomes the hard—everyone in the world knows this, yet no one can practice it. Therefore, the Sage says: "He who takes upon himself the disgrace of the state is called the lord of the shrines; He who takes upon himself the misfortunes of the state is called the King of the world." True words often seem paradoxical.`,
    chinese: `天下柔弱，莫過乎水，<br>而攻堅強者，莫之能勝，其無以易之。<br>故柔勝剛，弱勝強，天下莫不知，天下莫能行。<br>故聖人云：受國之垢，是謂社稷主；受國不祥，是為天下。<br>正言若反。`,
    commentary: `天下萬物中沒有比水更柔弱的了，但在攻擊堅強的事物時，卻沒有什麼能勝過水，因為沒有什麼能取代它。所以柔<br>弱能戰勝剛強，這道理天下沒有人不知道，卻沒有人能真正實行。因此聖人說：肯承擔全國的屈辱，才稱得上是國<br>家的主人；肯承擔全國的災難，才稱得上是天下的君王。正直的真理聽起來往往像是反話。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 79,
    title: ``,
    classical: `左契章`,
    english: `When a great hatred is reconciled, some hatred is bound to remain. How can this be made good? Therefore, the Sage holds the left-hand tally (the debtor's side) and does not demand payment from others. The man of Virtue (De) attends to his obligations; the man without Virtue attends to his claims. The Tao of Heaven has no favourites; it is always on the side of the good man.`,
    chinese: `和大怨，必有餘怨；安可以為善。<br>是以聖人，執左契，而不責於人。<br>故有德司契，無德司徹。<br>天道無親，常與善人。`,
    commentary: `和解重大的怨恨，必然還會殘留餘怨；這樣又怎麼能算是完美的處置呢？ 因此聖人就像放款的官員，雖然持有放款<br>憑據，卻不要求他人償還。 也就是說，有德的人就像持有借據一樣，只管盡到自己的義務而不苛求他人；沒有德的<br>人就像負責徵稅的人一樣，只會一味地對人索取與苛責。 上天之道是對萬物公正無私的，但它卻經常眷顧並助益那<br>些遵循自然、心存良善的人。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 80,
    title: ``,
    classical: `不徙章`,
    english: `Let the state be small and the people few. Even if there are tools that could do the work of ten or a hundred men, let them not be used. Let the people value their lives and not travel far. Though there be boats and carriages, let there be no occasion to ride in them; Though there be armour and weapons, let there be no occasion to display them. Let the people return to the use of knotted cords (simplicity). Let them find their food savoury, their clothes beautiful, their homes comfortable, and their customs joyful. Though the next state be within sight, and the crowing of cocks and the barking of dogs be heard from it, let the people grow old and die without ever having been there.`,
    chinese: `小國寡民。<br>使有什伯之器而不用；使民重死而不遠徙。<br>雖有舟車，無所乘之，雖有甲兵，無所陳之。<br>使民復結繩而用之。甘其食，美其服，安其居，樂其俗。<br>鄰國相望，雞犬之音相聞，民至老死，不相往來。<br>`,
    commentary: `最純樸的世界就是：國家很小，人口稀少。即使有各種效率極高的器械也不去使用；使百姓看重生命，而不向遠方<br>遷徙。雖然有船隻與車輛，卻沒有必要去乘坐；雖然有鎧甲與兵器，卻沒有地方去陳放。使百姓恢復到古代結繩記<br>事的生活方式。這時百姓就會覺得⻝物甘甜，衣服精美，居住安穩，體會風俗習慣的樂趣。鄰國之間可以互相望見，<br>雞鳴狗吠的聲音也都能聽聞，但百姓直到老死，彼此之間都不需要互相往來交易或爭鬥。`,
    discussion: ``,
    en_discussion: ``
  },
  {
    num: 81,
    title: ``,
    classical: `不積章`,
    english: `Sincere words are not beautiful; beautiful words are not sincere. The good man does not argue; the man who argues is not good. He who knows is not learned (in mere facts); he who is learned does not know (the Tao). The Sage does not hoard. The more he does for others, the more he has for himself; The more he gives to others, the more he possesses. The Tao of Heaven is to benefit and not to harm. The Way of the Sage is to act and not to strive.`,
    chinese: `信言不美，美言不信。<br>善者不辯，辯者不善。<br>知者不博，博者不知。<br>聖人不積，既以為人己愈有，既以與人己愈多。<br>天之道，利而不害；聖人之道，為而不爭。`,
    commentary: `真實的話不一定好聽，好聽的話往往不真實。善良的人不巧辯，巧辯的人不善良。真正通達真理的人不一定見聞廣<br>博，見聞廣博的人不一定通達真理。聖人沒有私藏，他盡力幫助別人，自己反而更充足；他盡力給予別人，自己反<br>而更豐富。自然的規律是利濟萬物而不加傷害；聖人的準則是施予作為而不與人競爭。`,
    discussion: ``,
    en_discussion: ``
  },
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let currentChIdx = null;
let showEn = true, showCn = true, showCmt = true;
let currentDis = 'zh';
let sidebarBuilt = false;

/* ══════════════════════════════════════
   LANDING PAGE
══════════════════════════════════════ */
// Populate chapter dropdown
(function buildLandingSelect() {
  const sel = document.getElementById('l-select');
  chapters.forEach((ch, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${String(ch.num).padStart(2,'0')} · ${ch.classical || '第'+ch.num+'章'}　${ch.title || ''}`;
    sel.appendChild(opt);
  });
})();

function openChapter(idx) {
  currentChIdx = idx;
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('reader').classList.add('active');
  buildSidebar();
  renderChapter();
  if (localStorage.getItem('sidebar-collapsed') !== 'false') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
}

function goHome() {
  document.getElementById('reader').classList.remove('active');
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('l-select').value = '';
}

/* ══════════════════════════════════════
   SIDEBAR
══════════════════════════════════════ */
function buildSidebar() {
  if (sidebarBuilt) return;
  sidebarBuilt = true;
  const navList = document.getElementById('chapter-list');
  chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = 'nav-' + ch.num;
    div.innerHTML =
      `<span class="ch-item-num">${String(ch.num).padStart(2,'0')}</span>` +
      `<div class="ch-item-names">` +
        `<span class="ch-item-en">${ch.title || '—'}</span>` +
        `<span class="ch-item-classical">${ch.classical || '第'+ch.num+'章'}</span>` +
      `</div>`;
    div.onclick = () => openChapter(i);
    div.addEventListener('dblclick', () => enterPresent(i));
    navList.appendChild(div);
  });
}

function setActiveNav(id) {
  document.querySelectorAll('.ch-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  s.classList.toggle('collapsed');
  localStorage.setItem('sidebar-collapsed', s.classList.contains('collapsed'));
}

/* ══════════════════════════════════════
   CHAPTER READER
══════════════════════════════════════ */
function fmtEng(t) { return t.replace(/;[ \t]*(<br>)?[ \t]*/g, ';<br>'); }

function renderChapter() {
  const ch = chapters[currentChIdx];
  const view = document.getElementById('chapter-view');

  const header =
    `<div class="ch-header">` +
      `<div class="ch-header-main">` +
        `<div class="ch-header-label">Chapter ${String(ch.num).padStart(2,'0')}</div>` +
        `<div class="ch-header-en">${ch.title || '—'}</div>` +
        (ch.classical ? `<div class="ch-header-classical-inline">${ch.classical}</div>` : '') +
      `</div>` +
      `<div class="ch-header-num">${String(ch.num).padStart(2,'0')}</div>` +
    `</div>`;

  const engSec = ch.english ?
    `<div class="reader-section${showEn?'':' hidden'}" id="sec-en">` +
      `<div class="reader-sec-label">English Translation</div>` +
      `<div class="reader-english">${fmtEng(ch.english)}</div>` +
    `</div>` : '';

  const cnSec = ch.chinese ?
    `<div class="reader-section${showCn?'':' hidden'}" id="sec-cn">` +
      `<div class="reader-sec-label">原文 · Original Text</div>` +
      `<div class="reader-chinese">${ch.chinese}</div>` +
    `</div>` : '';

  const cmtSec = ch.commentary ?
    `<div class="reader-section${showCmt?'':' hidden'}" id="sec-cmt">` +
      `<div class="reader-sec-label">白話注釋 · Commentary</div>` +
      `<div class="reader-commentary">${ch.commentary}</div>` +
    `</div>` : '';

  const hasDis = ch.discussion || ch.en_discussion;
  const zhContent = ch.discussion
    ? `<div class="reader-discussion">${ch.discussion}</div>`
    : `<p class="dis-coming-soon">尚未提供，敬請期待。</p>`;
  const enContent = ch.en_discussion
    ? `<div class="reader-discussion">${ch.en_discussion}</div>`
    : `<p class="dis-coming-soon">Coming soon.</p>`;

  const disSec = hasDis || true ?
    `<div id="sec-dis">` +
      `<div class="dis-tabs">` +
        `<button class="dis-tab-btn${currentDis==='zh'?' active':''}" onclick="switchDis('zh')">道學讀書會討論摘要</button>` +
        `<button class="dis-tab-btn${currentDis==='en'?' active':''}" onclick="switchDis('en')">English Discussion</button>` +
      `</div>` +
      `<div class="dis-panel${currentDis==='zh'?'':' hidden'}" id="dis-zh">${zhContent}</div>` +
      `<div class="dis-panel${currentDis==='en'?'':' hidden'}" id="dis-en">${enContent}</div>` +
    `</div>` : '';

  view.innerHTML = header + engSec + cnSec + cmtSec + disSec;
  document.getElementById('reader-content').scrollTop = 0;

  document.getElementById('reader-ch-info').textContent =
    `${String(ch.num).padStart(2,'0')} · ${ch.classical || '第'+ch.num+'章'} · ${ch.title || ''}`;
  document.getElementById('btn-prev-ch').disabled = currentChIdx === 0;
  document.getElementById('btn-next-ch').disabled = currentChIdx === chapters.length - 1;

  setActiveNav('nav-' + ch.num);
}

function prevChapter() {
  if (currentChIdx > 0) { currentChIdx--; renderChapter(); }
}
function nextChapter() {
  if (currentChIdx < chapters.length - 1) { currentChIdx++; renderChapter(); }
}

function toggleSection(which) {
  if (which === 'en')  { showEn  = !showEn;  document.getElementById('tog-en').classList.toggle('on',showEn); }
  if (which === 'cn')  { showCn  = !showCn;  document.getElementById('tog-cn').classList.toggle('on',showCn); }
  if (which === 'cmt') { showCmt = !showCmt; document.getElementById('tog-cmt').classList.toggle('on',showCmt); }
  renderChapter();
}

function switchDis(which) {
  currentDis = which;
  document.querySelectorAll('.dis-tab-btn').forEach(b => b.classList.remove('active'));
  const btn = which === 'zh' ? document.querySelector('.dis-tab-btn') : document.querySelectorAll('.dis-tab-btn')[1];
  if (btn) btn.classList.add('active');
  document.getElementById('dis-zh').classList.toggle('hidden', which !== 'zh');
  document.getElementById('dis-en').classList.toggle('hidden', which !== 'en');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('present-overlay').classList.contains('active')) return;
  if (document.activeElement === document.getElementById('l-select')) return;
  if (!document.getElementById('reader').classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextChapter(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevChapter(); }
});

/* ══════════════════════════════════════
   PRESENTATION MODE
══════════════════════════════════════ */
let presentIdx = 0;
let pShowEn = true, pShowCn = true, pShowCmt = true, pShowDis = true, pShowEnDis = true;

const jumpSel = document.getElementById('present-chapter-jump');
chapters.forEach((ch, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${String(ch.num).padStart(2,'0')} · ${ch.classical||'第'+ch.num+'章'}  ${ch.title?'— '+ch.title:''}`;
  jumpSel.appendChild(opt);
});

function enterPresent(startIdx) {
  presentIdx = (startIdx !== undefined) ? startIdx : (currentChIdx || 0);
  document.getElementById('present-overlay').classList.add('active');
  document.getElementById('reader').style.visibility = 'hidden';
  document.getElementById('landing').style.visibility = 'hidden';
  document.body.style.overflow = 'hidden';
  renderSlide();
}
function exitPresent() {
  document.getElementById('present-overlay').classList.remove('active');
  document.getElementById('reader').style.visibility = '';
  document.getElementById('landing').style.visibility = '';
  document.body.style.overflow = '';
}

function renderSlide() {
  const ch = chapters[presentIdx];
  jumpSel.value = presentIdx;
  document.getElementById('present-progress').textContent = `${presentIdx+1} / ${chapters.length}`;
  document.getElementById('present-chapter-info').textContent = `${String(ch.num).padStart(2,'0')} · ${ch.classical||'第'+ch.num+'章'}`;
  document.getElementById('btn-prev').disabled = presentIdx === 0;
  document.getElementById('btn-next').disabled = presentIdx === chapters.length - 1;

  const header =
    `<div class="slide-header">` +
      `<div class="slide-header-left">` +
        `<div class="slide-chapter-label">Chapter ${String(ch.num).padStart(2,'0')}</div>` +
        `<div class="slide-title-en">${ch.title || '—'}</div>` +
      `</div>` +
      (ch.classical ?
        `<div class="slide-classical-block"><span class="slide-classical-name">${ch.classical}</span></div>` : '') +
    `</div>`;

  const engSec =
    `<div class="slide-section${pShowEn?'':' hidden'}" id="slide-en">` +
      `<div class="slide-section-label">English Translation</div>` +
      `<div class="slide-english">${fmtEng(ch.english)}</div>` +
    `</div>`;
  const cnSec = ch.chinese ?
    `<div class="slide-section${pShowCn?'':' hidden'}" id="slide-cn">` +
      `<div class="slide-section-label">原文 · Original Text</div>` +
      `<div class="slide-chinese">${ch.chinese}</div>` +
    `</div>` : '';
  const cmtSec = ch.commentary ?
    `<div class="slide-section${pShowCmt?'':' hidden'}" id="slide-cmt">` +
      `<div class="slide-section-label">白話注釋 · Commentary</div>` +
      `<div class="slide-commentary">${ch.commentary}</div>` +
    `</div>` : '';
  const disSec = ch.discussion ?
    `<div class="slide-section${pShowDis?'':' hidden'}" id="slide-dis">` +
      `<div class="slide-section-label">道學讀書會討論摘要</div>` +
      `<div class="slide-discussion">${ch.discussion}</div>` +
    `</div>` : '';
  const enDisSec = ch.en_discussion ?
    `<div class="slide-section${pShowEnDis?'':' hidden'}" id="slide-en-dis">` +
      `<div class="slide-section-label">English Discussion</div>` +
      `<div class="slide-en-discussion">${ch.en_discussion}</div>` +
    `</div>` : '';

  document.getElementById('slide-content').innerHTML = header + engSec + cnSec + cmtSec + disSec + enDisSec;
  document.getElementById('present-slide').scrollTop = 0;
}

function nextSlide() { if (presentIdx < chapters.length-1) { presentIdx++; renderSlide(); } }
function prevSlide() { if (presentIdx > 0) { presentIdx--; renderSlide(); } }
function jumpToSlide(idx) { presentIdx = idx; renderSlide(); }

function toggleView(which) {
  if (which==='en')     { pShowEn     = !pShowEn;     document.getElementById('btn-show-en').classList.toggle('on',pShowEn); }
  if (which==='cn')     { pShowCn     = !pShowCn;     document.getElementById('btn-show-cn').classList.toggle('on',pShowCn); }
  if (which==='cmt')    { pShowCmt    = !pShowCmt;    document.getElementById('btn-show-cmt').classList.toggle('on',pShowCmt); }
  if (which==='dis')    { pShowDis    = !pShowDis;    document.getElementById('btn-show-dis').classList.toggle('on',pShowDis); }
  if (which==='en-dis') { pShowEnDis  = !pShowEnDis;  document.getElementById('btn-show-en-dis').classList.toggle('on',pShowEnDis); }
  renderSlide();
}

document.addEventListener('keydown', e => {
  const overlay = document.getElementById('present-overlay');
  if (!overlay.classList.contains('active')) return;
  if (e.key==='ArrowRight'||e.key==='ArrowDown') { e.preventDefault(); nextSlide(); }
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   { e.preventDefault(); prevSlide(); }
  if (e.key==='Escape') exitPresent();
});
</script>
</body>
</html>
