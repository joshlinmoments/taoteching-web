    num: 2,
    title: `Relativity`,
    classical: `觀徼章`,
    english: `When everyone under Heaven recognizes beauty as beauty, the concept of ugliness arises. <br>When everyone recognizes goodness as goodness, the concept of badness arises.<br>Thus, Being and Non-being give birth to each other; <br>Difficult and easy complete each other. <br>Long and short define each other; <br>High and low lean toward each other. <br>Sound and tone harmonize with each other; <br>Front and back follow each other.<br><br>Therefore, the Sage abides in Non-action (Wu-Wei) and carries out the teaching without words.<br>The myriad things arise, and he does not turn away; <br>He nurtures them but does not possess them; <br>He acts but does not cling to his own ability; <br>His work is accomplished, but he claims no credit.<br>Precisely because he does not claim credit, <br>His merit never fades away.`,
    chinese: `天下皆知美之為美，斯惡已。<br>皆知善之為善，斯不善已。<br>故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。<br>是以聖人處無為之事，行不言之教；萬物作焉而不辭，<br>生而不有，為而不恃，功成而弗居。夫唯弗居，是以不去。`,
    commentary: `當天下人都知道什麼是「美」的時候，醜的觀念也就產生了；當大家都公認什麼是「善」的時候，不善的定義也就隨之出現。 這說明了世間的價值判斷都是相對的。因此，有與無相互產生，難與易相互完成，長與短相互比較，高與下相互依存，聲音相互和諧，前後相互跟隨。 基於這種體悟，聖人以「無為」的態度處理事務，施行「不言」的教化。 他順應萬物自然生長而不橫加干涉；有所作為卻不自恃己能，成就了功勞卻不據為己有。正因為他不居功、不執著於成就，所以他的功德與貢獻反而永遠不會消失。`,
    discussion: `<div class="disc-h">知道・道學讀書會</div><div class="disc-h">概述</div><div class="disc-p">本次讀書會深入探討《道德經》第一章與第二章的核心思想,重點聚焦於「道」的本質、「無」與「有」的關係,以及「不二法門」的修行概念。講者點傳師透過現代生活的比喻(如電池、水分子等)來闡釋古典哲學中抽象的概念,幫助學員理解道家思想中「無名」與「有名」、「玄之又玄」的深層意涵。討論延伸至儒家思想,探討如何透過「無分別心」來解決現代社會問題,如霸凌、教育不平等等議題。<br>核心概念或理論:<br>道的本質:道是萬物之源,既是「無」(未顯化的狀態)也是「有」(顯化的狀態),兩者本質相同<br>無與有的關係:如同電池中的能量,未使用時為「無」,使用時顯現為「有」,但本質未變<br>不二法門:超越二元對立的修行方法,強調「無分別」的重要性<br>玄之又玄:指道的深奧難測,需透過內在觀照才能理解<br>無分別心:消除內在的分別與比較,達到真正的平等狀態<br>提出的重要問題:<br>為什麼「天下皆知美之為美,斯惡已」?為何眾人認為美好的事物反而會產生惡?<br>如何從根本上解決霸凌問題,而非僅依賴法律規範?<br>真正的平等是什麼?如何在保持多樣性的同時實現無分別?<br>家庭教育與學校教育在品格培養上的差異為何?<br>關鍵要點與學習目標總結<br>《道德經》第一章闡述「道」作為萬物之母的本質,以及「無」與「有」同出而異名的關係<br>透過日常生活比喻(電池、水分子)理解抽象的道家哲學概念<br>「不二法門」是超越二元對立、消除分別心的修行核心<br>真正的教育與反霸凌需從消除內在的分別心做起,而非僅依賴外在規範<br>家庭教育的身教重於言教,父母的行為示範比道德說教更有影響力<br>社會平等的實現需要從個人內在消除分別心開始,而非僅追求外在形式的平等</div><div class="disc-h">主題一:《道德經》第一章——道的本質與「無」「有」的關係</div><div class="disc-p">《道德經》第一章開宗明義指出「道可道,非常道;名可名,非常名」,說明真正的「道」是無法用語言完全表達的。講者點傳師透過電池的比喻來解釋這個概念:電池中的電能在未被使用時,人們不知道它能做什麼,這是「無」的狀態;當電池被放入鬧鐘、遙控器、電風扇等不同器具中,電能的功用才顯現出來,這是「有」的狀態。但無論是「無」還是「有」,電池中的能量本質並未改變。<br>「無名天地之始,有名萬物之母」這句話說明:在天地創生之前,道處於「無」的狀態,這是一種充滿創造宇宙能量但尚未顯化的狀態;當道開始創造萬物時,就進入了「有」的狀態,成為萬物之母。講者強調,「無」並非真的什麼都沒有,而是蘊含著無限可能性,只是我們尚未觀察到。<br>「故常無欲以觀其妙,常有欲以觀其徼」說明了觀察道的兩種方式:保持「無」的狀態可以觀察到道的奧妙本質;在「有」的狀態下則可以觀察到道的具體顯現。講者用水的三態(水、水蒸氣、冰)來說明:雖然形態不同,但本質都是水分子,只是分子結構排列不同。同樣地,「無」與「有」本質相同,只是顯化程度不同。<br>「玄之又玄,眾妙之門」指出道的深奧難測。講者解釋,「玄」代表深不可測、難以理解的狀態,就像在完全黑暗的房間裡,雖然看不見任何東西,但東西依然存在。只有透過內在的觀照與修行,才能打開這扇「眾妙之門」,探索宇宙的奧秘。</div><div class="disc-h">相關問答</div><div class="disc-a">前賢:反光的問題還好嗎?</div><div class="disc-q">點傳師:應該可以,我們試試看用白板來呈現,看效果如何。</div><div class="disc-q">點傳師:大家能理解「無」與「有」的關係嗎?</div><div class="disc-p">(學員透過聊天室表示清楚)</div><div class="disc-h">主題二:《道德經》第二章——美醜善惡的相對性與不二法門</div><div class="disc-p">第二章開頭「天下皆知美之為美,斯惡已;皆知善之為善,斯不善已」提出了一個顛覆性的觀點:當所有人都認為某事物是美的、善的時候,反而會產生醜惡與不善。講者請學員思考為什麼會這樣,學員前賢甲回應指出這會產生「比較」。<br>講者進一步解釋,當我們建立了「美」的標準,就必然會產生「醜」的概念;當我們定義了「善」,就會有「不善」的對立面。這種二元對立的思維方式會產生分別心,進而導致各種社會問題。講者分享了童年經驗:在家族聚會玩開店遊戲時,因為堂哥選了最受歡迎的餐廳,自己只能選擇沒人需要的店,因此產生了被排斥的感受和分別心。<br>「故有無相生,難易相成,長短相形,高下相傾,音聲相和,前後相隨」說明了所有對立的概念都是相互依存、相互產生的。沒有「無」就沒有「有」,沒有「難」就沒有「易」,這些都是相對的概念。<br>講者引用孔子「聽訟,吾猶人也,必也使無訟乎」來說明真正的治理之道。孔子說自己審理訴訟的能力和別人一樣,但真正重要的是讓訴訟根本不發生。這就是「無訟」的境界,不是透過嚴刑峻法來懲罰,而是讓人們從內心就不想做壞事。<br>講者以現代反霸凌議題為例:如果只是制定更嚴格的法律來懲罰霸凌者,只是治標不治本。真正要解決霸凌,需要從消除「分別心」做起。霸凌者往往也是受害者,因為內心有分別心(我比你強/我比你弱),才會產生霸凌行為。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:為什麼大家都說這個很美、很善良,反而會產生惡?</div><div class="disc-a">前賢甲:因為會有比較。</div><div class="disc-q">點傳師:對,有了比較就會有分別心,這就是問題的根源。</div><div class="disc-q">點傳師:如何才能不產生霸凌?</div><div class="disc-a">前賢:當大家都沒有分別心的時候,可能就不會有霸凌了。</div><div class="disc-a">前賢丙:從溝通開始,讓大家都是平等的,沒有分別。</div><div class="disc-h">主題三:教育、品格培養與無分別心的實踐</div><div class="disc-p">討論延伸到現代教育問題。學員透過聊天室提出「品格教育」和「家庭教育」的重要性。講者指出,現代社會不缺品格教育的口號,學校也有公民與道德課程,但為什麼問題依然存在?<br>講者強調「家庭教育大於學校教育」,因為孩子容易受到父母的「耳濡目染」影響。真正的教育不在於口頭說教,而在於身教。如果父母自己說不要講髒話,卻自己滿口髒話,孩子學到的就是言行不一。過去的父母雖然可能教育方式不夠現代化,但他們有謙卑的心和對社會的責任感,擔心孩子給別人添麻煩,這種內在的道德感才是真正的教育核心。<br>講者對比了過去與現在的教育觀念:過去的父母認為「我要對社會負責,不能讓孩子變壞」;現在的父母則常常認為「社會要對我的孩子負責,學校應該教好我的孩子」。這種心態的轉變導致了教育效果的差異。<br>關於「無分別心」的實踐,講者引用了秦朝的一個故事:有位老者非常正直,看到別人做得好就像自己做的一樣開心,沒有嫉妒或威脅感。這種「容人之量」才是真正的無分別心。講者強調,天道不是在尋找能力最強的人,而是在尋找心胸最寬廣、能包容一切的人。<br>講者用NASA的例子說明:太空人、科學家、清潔工在組織中都同等重要,缺一不可。真正的平等不是讓所有人做同樣的事、穿同樣的衣服,而是在內心消除分別心,尊重每個人的獨特性和貢獻。就像一歲的小孩看所有人都一樣,不會因為你是副領導就特別對待,這才是真正的無分別。</div><div class="disc-h">相關問答</div><div class="disc-q">點傳師:為什麼現在品格教育這麼多,問題還是沒解決?</div><div class="disc-p">(學員透過聊天室回應):從小的品格教育、從家教開始培養道德、家庭教育大於學校教育,學校教育有限、小孩耳濡目染,容易受到父母的影響。</div><div class="disc-q">點傳師:如何實踐無分別心?</div><div class="disc-p">講者說明:不是外在的控制讓大家都一樣,而是內心摘下有色眼鏡,像小孩一樣看待每個人都平等,同時保持每個人的獨特性和多樣性。<br>後續行動步驟/作業<br>NA</div><div class="disc-h">補充資源</div><div class="disc-p">NA</div><div class="disc-p">---</div><div class="disc-h">知道・道學讀書會</div><div class="disc-h">概覽</div><div class="disc-p">本次讀書會以《道德經》為核心文本，延續前次內容進行研讀與討論。課程聚焦於「分別心」的概念，探討人類如何因設立標準而產生對立與執著，並進一步延伸至「無為而治」、「不言之教」及「為而不恃、功成而弗居」等道家核心思想。課程中穿插大量生活實例與前人故事，引導學員將道家哲學內化為日常實踐。</div><div class="disc-h">核心概念與理論</div><div class="disc-p">二元對立（分別心）：當人們對美醜、善惡、難易等事物設立標準，便自然產生分別與執著，進而帶來痛苦。<br>無為而治：聖人以不強求、不刻意的方式行事，順應自然而非主動控制。<br>不言之教：透過身體力行而非言語說教來影響他人，以行動示範道理。<br>為而不恃、功成而弗居：做事不求回報、不執著於成果，成功後不居功自傲。<br>生而不有：萬物生長而不佔有，付出而不強求，此為道的自然體現。</div><div class="disc-h">重要提問</div><div class="disc-p">當我們對美醜、善惡設立標準時，是否就已陷入分別心？<br>如何在現代生活中實踐「無為」，而不是完全放棄判斷力？<br>面對他人的情緒問題，言語說教是否真的有效？<br>「為而不恃、功成而弗居」在實際行動中如何落實？</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">《道德經》第二章指出，美與醜、善與惡皆為相對概念，有標準便有分別，有分別便有痛苦。<br>打破二元對立的分別心，是讓自己更自在、讓慈悲自然流露的關鍵。<br>「無為」並非什麼都不做，而是不帶私心、不計得失地去做當下該做的事。<br>「不言之教」強調以身作則的力量遠勝於言語說教。<br>前人（如廣裕大帝、黃老師等）的故事說明，真正的道行者從不計較個人利益，卻往往成就非凡。<br>幫助他人時若帶有期待，一旦未達預期便會失落；若能放下期待，則付出本身即是圓滿。<br>「生而不有，為而不恃，功成而弗居」是本次讀書會最重要的實踐指引。</div><div class="disc-h">主題一：分別心與二元對立</div><div class="disc-p">《道德經》第二章開宗明義指出，當世人皆知美之為美時，醜的概念便隨之而生；當善被確立為標準，惡便同時存在。點傳師以此為基礎，說明人類一旦建立標準，便會自動進入比較與分別的狀態，進而對自己和他人產生評判。<br>課程中舉出多個生活實例：台灣人引以為傲的美食文化，對印度移民而言卻未必可口；在柬埔寨時，簡單的食物也能令人感到滿足；過去在北京時，大家不假思索地參與各種活動，如今卻開始挑選行程。這些例子說明，所謂的「標準」往往是相對且主觀的。<br>點傳師進一步指出，當我們放下這些既定標準，不再以個人喜好評判事物，慈悲心便會自然流露。例如，在幫助印度朋友時，若不帶任何預設立場，便能真誠地給予關懷，而非受外界評價左右。</div><div class="disc-h">相關問答</div><div class="disc-q">問：過去在北京時，大家為何會不假思索地參與所有活動？</div><div class="disc-a">答：點傳師指出，那時有使命感與向心力作為驅動，不會去評估活動對自己是否有利，只要是團體的事，便全力投入，這正是沒有分別心的體現。</div><div class="disc-q">問：現在為何開始對行程有所取捨？</div><div class="disc-a">答：因為隨著個人意識增強，開始以「我喜不喜歡」、「這對我有沒有好處」來衡量事物，分別心便由此而生。</div><div class="disc-h">主題二：不言之教與無為而治</div><div class="disc-p">本段聚焦於《道德經》中「是以聖人處無為之事，行不言之教」的詮釋。點傳師以萬良蔚的故事為例，說明真正的「無為」並非刻意學習或追求，而是在幫助他人的過程中自然習得。萬良蔚成為電腦專家，並非因為主動鑽研，而是因為不斷有人請他幫忙，他便一次次想辦法解決，最終累積了深厚的能力，甚至在台電、台大等機構任職，成就遠超預期。<br>「不言之教」的概念則透過黃老師的故事加以說明。黃老師雖不善言辭，但其身體力行的態度深深影響了周遭的人，讓大家自然而然地跟隨效法。點傳師強調，對於情緒問題，言語往往無法真正解決，真正有效的是讓對方看見不同的處理方式，從而開啟新的可能性。</div><div class="disc-h">相關問答</div><div class="disc-q">問：面對容易發怒的人，說道理有用嗎？</div><div class="disc-a">答：點傳師指出，對方之所以發怒，是因為不知道還有其他解決方式。此時說理往往無效，更重要的是讓他親眼看見不同的回應方式，讓他知道面對同樣情境，還有其他選擇，如接納、理解、換個角度看待等。</div><div class="disc-q">問：「不言之教」在現代如何實踐？</div><div class="disc-a">答：就是做好自己，讓行動說話。當我們真誠地活出道理，周遭的人自然會受到影響，無需刻意說教。</div><div class="disc-h">主題三：前人故事——廣裕大帝與道場的建立</div><div class="disc-p">點傳師分享了廣裕大帝與黃老師創建道場的艱辛歷程，作為「為而不恃、功成而弗居」的具體示範。廣裕大帝出身貧寒，早年流落台北，甚至曾棲身橋下。後來受到木吉大師的引導，走上修道之路，並以賣清潔劑起家，逐步建立事業。<br>道場在發展過程中歷經十餘次搬遷，最困難時租用的空間僅有三坪，神明的法器幾乎因繳不出租金而被搬走。即便如此，廣裕大帝從未退縮，始終堅持下去。後來因誠信經營，獲得大公司的信任，事業才得以轉機。他將所得土地全數捐出，建立道場，並親自帶領眾人挖掘地基，蓋起廟宇。<br>點傳師強調，這些前人從未想過「這對我有什麼好處」、「我能得到什麼」，只是一心一意做當下該做的事，最終成就了超乎預期的結果。這正是「無為」與「不居功」的最佳詮釋。</div><div class="disc-h">相關問答</div><div class="disc-q">問：為何了解前人故事如此重要？</div><div class="disc-a">答：點傳師說明，能夠說出前人的故事，代表真正將其精神放在心上，這才是真正的感恩。若只說「父母對我很好」卻說不出具體事蹟，那只是表面的感謝，而非真正的孝道或感恩。</div><div class="disc-q">問：Hub House（道場）名稱的由來為何？</div><div class="disc-a">答：老孫努將土地捐出後，主動將自己的名字從道場名稱中移除，體現了「功成而弗居」的精神，這也是道場命名的由來之一。</div><div class="disc-h">主題四：生而不有、為而不恃、功成而弗居</div><div class="disc-p">本段為本次讀書會的核心結語。點傳師詳細解析《道德經》中「生而不有，為而不恃，功成而弗居，夫唯弗居，是以不去」的深意。<br>「生而不有」意指萬物生長，但不佔有；「為而不恃」意指付出，但不依賴回報；「功成而弗居」意指成功後不居功。點傳師指出，正因為不執著於成果，這些功德才不會消失。反之，若過度在意自己的付出與成就，反而會因執著而失去道心，甚至讓善行的能量消散。<br>以洗碗為例，若洗碗時心中想著「我今天洗碗有多少功德」，便已落入計較；若只是自然地做當下需要做的事，不想任何回報，那才是真正的「無為」。點傳師也以在安養院服務為例，說明若帶著期待去付出，達不到目標時便會失落，甚至下次不願再去；若能放下期待，每次付出都是完整的，不會因結果而動搖。</div><div class="disc-h">相關問答</div><div class="disc-q">問：「功成而弗居，是以不去」如何理解？</div><div class="disc-a">答：點傳師解釋，正因為不執著於功勞，功德才不會消失。你的善意不會消失，你的努力不會消失，你的功德也不會消失。但若開始計較今天賺了多少、得到了多少，道心便會在那一刻消失。</div><div class="disc-q">問：放下得失心真的很難嗎？</div><div class="disc-a">答：點傳師認為，其實並不難，難的是我們自己開始思考、計較，才讓事情變得複雜。若能回到當下，只做眼前該做的事，自然就能做到。</div><div class="disc-p">行動事項與作業<br>本次讀書會未明確指派具體作業，但點傳師建議學員：<br>將「生而不有，為而不恃，功成而弗居」這段經文熟記於心，因其在《道德經》中多次出現，是修道實踐的重要指引。<br>在日常生活中觀察自己是否帶有分別心，並嘗試放下對美醜、好壞、得失的執著。<br>反思自己在幫助他人時，是否帶有期待或計較，並練習以「無為」的心態付出。</div><div class="disc-h">補充資源</div><div class="disc-p">本次讀書會未提供具體補充閱讀材料或外部資源連結，主要以《道德經》原文為研讀基礎，並輔以口述故事與生活實例進行說明。</div>`,
    en_discussion: `<div class="disc-h">Class 2: From Non-being to Wu Wei — The Art of Natural Flow</div><div class="disc-p">Exploring the manifestation of Tao through sincerity and effortless action.<br>Guang Ming Advanced Academy<br>May 13, 2026</div><div class="disc-h">Key Takeaways</div><div class="disc-p">The group conducted an in-depth discussion of Chapter 1 of the Tao Te Ching, covering the concepts of Tao, Non-being (Wu), Being(You), Wu Wei, and the mystery (Xuan).<br>Key philosophical insights were drawn from participants' personal and professional experiences, connecting ancient Daoist thought to modern life.<br>Review of the First Two Sentences of the Tao Te Ching (Chapter 1)<br>The group reviewed the previous week's discussion on "The Tao that can be spoken is not the eternal Tao" and "The name that can be named is not the eternal name."<br>Details<br>Emily: Explained that Tao is very hard to describe because it is unlimited and profound — it is intangible (cannot be seen, heard, tasted, or touched).<br>Dom: Shared that the more you talk about what the Tao is, the less you understand it — speaking about it actually distances you from it.</div><div class="disc-q">Master Chen: Reflected that principles and guidelines in our minds can limit our perception; the same principle may not apply equally across all situations or people, which is why we sometimes feel unhappy when we rigidly apply fixed rules.</div><div class="disc-q">Master: Connected Master Chen's point to the Tao Te Ching verse on water (Shang Shan Ruo Shui — "Highest excellence is like water"), noting that water occupies low places all men disdain, illustrating acceptance without resistance.</div><div class="disc-q">Master: Also referenced the Confucian saying "Jun Zi Bu Qi" (a noble person is not a tool), meaning a wise person should not limit themselves to a single function but has many dimensions of potential.</div><div class="disc-h">Conclusion</div><div class="disc-p">Tao is intangible and cannot be fully captured in words or names.<br>Names and principles are not eternal — they are contextual and subject to change.<br>Everything has a life cycle (Birth, Existence, Destruction, Emptiness), so no name or label is permanent.<br>Non-being (Wu) as the Primordial State of Heaven and Earth<br>Details</div><div class="disc-q">Master: Described Non-being as the original state before anything existed — the foundation and mother of all things, where Tao is the nature and principle of everything.</div><div class="disc-q">Master Erica: Connected Non-being to the concept of the Holy Portal (spiritual origin within a person), explaining that one's spirituality originates from Tao. —  this is the Non-being within each person.</div><div class="disc-q">Master: Drew a parallel between Non-being and the soul: the soul is Non-being, the body is Being. Without the soul, the body is just a dead body; with the soul, one can do everything.</div><div class="disc-p">Dom: Confirmed the connection, noting "You don't have a soul — you are the soul, and you have a body."</div><div class="disc-h">Conclusion</div><div class="disc-p">Non-being (Wu) is the primordial, intangible state from which all things originate.<br>Each person carries Non-being within them in the form of their spirituality/soul.<br>Wu Wei as the Manifestation (Performance) of Non-being<br>The group explored Wu Wei and its relationship to Non-being and Tao.<br>Details</div><div class="disc-q">Master Erica: Explained that Wu Wei arises naturally from one's spirituality — when one acts with sincerity and kindness, action flows without deliberate thought. This is wisdom, which differs from mere intelligence.</div><div class="disc-q">Master: Illustrated Wu Wei with the example of a salesman: each new customer should be approached fresh, without the baggage of past rejections limiting one's openness.</div><div class="disc-q">Master: Referenced Confucius's advice to a ruler — instead of waging war to expand territory, teach the people to live well and be kind; others will naturally be drawn to the country, making the country stronger without any aggressive intent. The goal is achieved without directly pursuing it.</div><div class="disc-p">Dom: Shared a classroom example — instead of scolding noisy students, he acknowledged their energy positively and redirected them with empathy, inspiring their natural benevolence rather than punishing them. This achieved the desired result without force.</div><div class="disc-q">Master: Affirmed Dom's example as a demonstration of Wu Wei — inspiring empathy is acting from the original nature; punishment is a limited, human-constructed response.</div><div class="disc-q">Master: Noted the distinction between Wu Wei (natural action from Tao) and Ren Wei (human-constructed action), using cram schools as an example of Ren Wei — forcing knowledge into children rather than allowing natural learning.</div><div class="disc-h">Conclusion</div><div class="disc-p">Wu Wei is the natural, effortless expression of Tao through people who act with sincerity and benevolence.<br>Ren Wei (action driven by human constructs and desires) limits natural potential; Wu Wei unlocks it.<br>Being as the Source of All Creations and the Relationship Between Non-being and Being<br>The group discussed "Being is the name for the source of all creations" and the relationship between Non-being and Being.<br>Details</div><div class="disc-q">Master: Explained that Being is the performance/manifestation of Non-being. Since Tao (Non-being) is intangible, we experience it through the actions of virtuous people (Being).</div><div class="disc-q">Master: Added that by experiencing and discussing Non-being and Being together in daily life, we can realize and understand the wonder of Tao more deeply. "Mystery" can also be used as a verb — we mystery (experience the mystery of) Tao through living it.</div><div class="disc-q">Master: Used the analogy of light: light and the things illuminated by light appear to be two separate things, but they are one. Similarly, Non-being and Being appear different but are the same — both are manifestations of Tao.</div><div class="disc-q">Master: Noted that ordinary people only see the surface (like the surface of a lake), while those with wisdom can see deeper — understanding the causes and reasons behind all events (cause and effect / karma).</div><div class="disc-h">Conclusion</div><div class="disc-p">Non-being and Being are two aspects of the same reality — both are manifestations of Tao.<br>The distinction between them exists only from a limited human perspective.<br>Dwelling in Non-being allows one to contemplate the subtle mystery of Tao and perceive the deeper causes behind all phenomena.<br>The Mystery (Xuan) — "Mystery Upon Mystery, the Gateway to All Wonders"<br>The group discussed the final line of Chapter 1: "Together they are called the mystery, mystery upon mystery, the gateway to all wonders of the universe."<br>Details</div><div class="disc-q">Master: Explained that Xuan (mystery/dark) originally refers to a very deep, dark black — like a deep lake whose contents cannot be seen. It represents unfathomable depth and hidden power.</div><div class="disc-q">Master Erica : Reflected that when we encounter difficulties, our attitude evolves in stages — first feeling defeated, then feeling strengthened by the problem, and finally seeing the problem simply as a problem, with equanimity. Everything that happens has a reason (cause and effect), and wisdom from Tao allows us to accept this peacefully.</div><div class="disc-q">Master: Shared a story of a boy who learned to walk through walls by sincerely cleaning his master's room for years. When he showed off the skill to neighbors, he failed — because he had lost his sincerity and begun to act for the result (Ren Wei). The mystery is simple: act sincerely, and the power of Non-being is accessible.</div><div class="disc-q">Master: Concluded that seeing everything as equal (not distinguishing good/bad, beautiful/ugly) opens the gateway to all wonders — illustrated by the example of a teacher treating all students equally to achieve better outcomes.</div><div class="disc-h">Conclusion</div><div class="disc-p">The mystery (Xuan) is not complicated — it is accessible through sincerity and Wu Wei.<br>Once one begins to act for results or benefits, the connection to Non-being is lost.<br>Seeing all things as equal and natural opens the gateway to the wonders of the universe.</div><div class="disc-p">---</div><div class="disc-h">Class 3: Shattering the Cage of Duality — Breaking the Framework of Comparison</div><div class="disc-p">Liberating the mind from rigid comparison to reclaim absolute freedom.<br>Guang Ming Advanced Academy<br>May 20, 2026</div><div class="disc-h">Key Concepts or Theories</div><div class="disc-p">Duality (二元性): The inherent interdependence of opposites — beauty/ugliness, good/bad, difficult/easy, long/short, high/low, sound/silence, front/back<br>The Trap of Comparison: The act of labeling something beautiful or good simultaneously creates the concept of ugliness or badness.<br>Non-attachment (不執著): Avoiding clinging to both positive and negative perceptions, emotions, or outcomes<br>The Flow State (心流): A state of complete immersion in the present moment where distinctions dissolve and one's senses and consciousness align<br>Fangxin (放心): The concept of gathering and holding one's consciousness together, rather than losing oneself<br>Neutral perception (中立): Viewing all circumstances — good or bad — as natural and neutral, as nature itself is neutral</div><div class="disc-h">Important Questions Raised</div><div class="disc-p">Why does Laozi open Chapter 2 by discussing beauty and ugliness, goodness and badness?<br>Is comparison always harmful, or can it serve a useful purpose (e.g., choosing a phone based on need)?<br>How does unconscious or innocent comparison affect our relationships and inner peace?<br>How can one remain present and in a flow state rather than living in the past or future?<br>How should wisdom and mercy work together when performing acts of goodness, such as donating?</div><div class="disc-h">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Chapter 2 of the Tao Te Ching teaches that the moment we label something beautiful or good, we simultaneously create the concept of ugliness or badness — this is the origin of duality and comparison.<br>Comparison, even when done innocently or unconsciously, damages relationships and inner peace.<br>The duality of all things — being/non-being, difficult/easy, long/short, high/low — is a fundamental truth of existence; the goal is to transcend attachment to these dualities.<br>The flow state is the ideal condition of the mind: fully present, undistracted by judgment, with all senses and consciousness aligned.<br>Non-attachment applies to both positive and negative things; clinging to goodness or beauty is just as limiting as clinging to negativity.<br>Wisdom and mercy must work together: good intentions should be guided by discernment to maximize positive impact.<br>Small acts of kindness, done without expectation of reward, can have profound and far-reaching consequences.</div><div class="disc-h">Topic 1: Duality and the Origin of Comparison in Chapter 2</div><div class="disc-p">Chapter 2 of the Tao Te Ching opens with two foundational sentences: "When everyone under heaven recognizes beauty as beauty, the concept of ugliness arises. When everyone recognizes goodness as goodness, the concept of badness arises." The very act of labeling or recognizing one quality necessarily brings its opposite into existence. This is the philosophical basis of duality.<br>This connects to the English saying, "Comparison is the thief of joy," noting that constantly measuring oneself or others against a standard creates dissatisfaction and suffering. Comparison is often unconscious — for example, praising one student's English ability in a classroom inadvertently signals to others that they are lacking. Similarly, a teacher who praises only high-achieving students creates a hidden hierarchy that discourages others.<br>A key distinction exists between comparison driven by genuine need versus comparison driven by desire, ego, or the wish to show off, such as comparing phones based on utility versus status. Laozi's teaching is not that all practical classification is forbidden, but that attachment to the results of comparison and the judgments it produces is what causes harm.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: "Is comparison always bad? For example, if I want to buy a phone, I compare phones to find the right one. Is that wrong?"</div><div class="disc-a">Answer: Comparison for practical needs is acceptable. The issue arises when comparison is driven by desire or ego — for example, buying the most expensive phone not because you need it, but to impress others. The principle is to buy what you need, not what your eye desires.</div><div class="disc-q">Question: "So is it mainly about comparing people, or does it apply to all things?"</div><div class="disc-a">Answer: It applies to all things. However, comparing people is particularly harmful because it causes animosity and relational damage. The chapter invites us to recognize how labeling anything as good or beautiful simultaneously creates its opposite.</div><div class="disc-h">Topic 2: The Flow State, Fangxin, and Living in the Present</div><div class="disc-p">Transcending duality in practice involves exploring the concept of the flow state — a condition in which a person is so fully immersed in the present moment that they lose track of time and cease to distinguish between good/bad, difficult/easy, beautiful/ugly. This state is referenced across traditions: Daoism, Buddhism, yoga, and meditation all point toward it.<br>The concept of Fangxin was examined in depth. While the character 放 (fang) is commonly understood as "to release" or "let go," the class clarified that its deeper meaning is to gather and hold one's consciousness — like a shepherd keeping a flock together. When one is truly focused, all senses and thoughts are unified, allowing one to act with full power and clarity. This is contrasted with losing oneself — scattering one's consciousness through distraction, comparison, or emotional reactivity.<br>The Buddhist teaching that one cannot grasp the past, present, or future mind was also referenced. The class noted that even the present moment, if one is thinking about being present, is already a form of mental grasping. True presence — the flow state — transcends even the awareness of time.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: "So the flow state means being in the present moment, right?"</div><div class="disc-a">Answer: It goes beyond simply being in the present. In the flow state, one forgets time entirely — even the present moment is not consciously tracked. All senses and consciousness are gathered and aligned, allowing effortless action. It is the state in which one acts without distinguishing difficulty from ease, or beauty from ugliness.</div><div class="disc-q">Question: "Is Fangxin about letting go of emotions, or holding them together?"</div><div class="disc-a">Answer: Fangxin is about gathering and holding one's consciousness together — not scattering it. Emotions, like a storm, are not something to suppress or control, but also not something to be swept away by. The metaphor used was a ship in a storm: you must hold everything together, including yourself, rather than being thrown overboard. You do not control the storm, but you hold your ground within it.</div><div class="disc-h">Topic 3: Non-Attachment and Emotional Equanimity</div><div class="disc-p">The concept of non-attachment serves as the practical application of Chapter 2's teachings. Attachment — whether to beauty, wealth, reputation, or even goodness itself — is identified as a burden on the soul. The soul was described metaphorically as a light bulb: it should shine purely and brightly, but attachments cloud its light.</div><div class="disc-q">Master contributed an important clarification: attachment to the concept of beauty or goodness is itself the problem. If someone performs good deeds only to gain a good reputation, they have already lost the true spirit of goodness. The intention behind an action matters more than the action itself.</div><div class="disc-p">Emotional equanimity involves the ability to allow emotions to arise and pass without clinging to them. Emotions are like weather: they come and go. One should not try to forcibly suppress them, nor become defined by them. The goal is to remain centered and neutral, observing emotions without being controlled by them. For example, reading the Tao Te Ching during a difficult argument with a friend can help release anger and recognize the complaint as an opportunity for self-improvement.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: "Can you be attached to negative things, like anger?"</div><div class="disc-a">Answer: Yes. Attachment is not limited to positive things. One can be attached to anger, resentment, or negative experiences — for example, a trauma from being bitten by a dog that prevents one from ever trusting dogs again. Any attachment, positive or negative, becomes a burden on the soul and prevents one from living freely in the present.</div><div class="disc-q">Question: "If someone scams you, should you still help the next person who asks for help?"</div><div class="disc-a">Answer: Yes, but wisdom should accompany mercy. The key is to act from your true self in the present moment, without being paralyzed by past experiences. At the same time, wisdom helps you discern how to make the greatest positive impact — for example, choosing where to donate so that the effect is maximized.</div><div class="disc-h">Topic 4: Wisdom, Mercy, and the Power of Small Acts</div><div class="disc-p">In practice, wisdom and mercy must work together. Master emphasized that in Buddhism, cultivating both mercy and wisdom simultaneously is essential. Mercy without wisdom can lead to misplaced generosity; wisdom without mercy becomes cold calculation. Together, they allow one to do the most good.<br>Master illustrated this with the principle that truly good people care about the cause (what they contribute) rather than the result (what they receive). Ordinary people focus on reward; enlightened people focus on impact and intention.<br>A story was shared about a bride who, on her wedding day, encountered a funeral procession. While her companions urged her to ignore it and keep moving, she stopped, offered her most beautiful flower to be placed on the coffin. Thirty-five years later, a soldier — the son of the deceased — saved her and her children during a time of war. This story illustrated how a single small act of kindness, done without expectation or purpose, can produce profound consequences far beyond what one could imagine.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: "Is it the big gestures or the small ones that matter most?"</div><div class="disc-a">Answer: Often it is the small acts — the seeds — that carry the greatest weight. The story of the bride and the flower demonstrates that an unremarkable moment of genuine kindness, done without agenda, can ripple outward across decades. The cause is small; the result is immeasurable.</div><div class="disc-q">Question: "How should we decide where to donate or how to help?"</div><div class="disc-a">Answer: Wisdom helps discern where help will have the greatest impact — for example, donating to children who cannot afford education rather than to a less impactful cause. Mercy provides the motivation; wisdom guides the direction. Both are necessary.</div><div class="disc-p">Actionable Next Steps / Assignments<br>Observe moments of unconscious comparison in daily life and reflect on how these moments affect relationships.<br>Practice the flow state in everyday activities — sports, music, study — and notice when you lose track of time and judgment.<br>Supplemental Resources<br>Buddhist teaching on the three minds — The teaching that one cannot grasp the past mind, the present mind, or the future mind.<br>Mencius — Referenced in the discussion of Fangxin: Mencius's teaching that people search for lost chickens and dogs but do not search for their lost hearts/minds, as a metaphor for recovering one's true self.</div><div class="disc-p">---</div><div class="disc-h">Class 4: Beyond External Recognition — Practicing Wu Wei through Pure Motivation and Selfless Action</div><div class="disc-p">Exploring the manifestation of Tao through intrinsic drive and freedom from expectation<br>Guang Ming Advanced Academy<br>May 27, 2026</div><div class="disc-h">Key Concepts or Theories</div><div class="disc-p">Duality of Perception: The idea that beauty and ugliness, good and bad, are interdependent and cannot exist without each other.<br>Wu Wei (無為): Acting without selfish purpose or ego-driven motivation; doing what is naturally required in a situation without seeking personal gain or recognition.<br>Pure Motivation: The principle that the value of an action is determined by the purity of the intention behind it, not by the outcome or recognition received.<br>Merit and Recognition: The distinction between acting for external approval versus acting from an intrinsic, selfless drive.<br>Karma and Seeds of Expectation: A Buddhist concept introduced to explain how unmet expectations plant "seeds" of disappointment in the mind, which can grow into suffering.<br>Intrinsic vs. Extrinsic Motivation: The contrast between doing something for its own sake versus doing it for external reward or validation.</div><div class="disc-h">Important Questions Raised</div><div class="disc-p">What does Wu Wei truly mean? Is it passivity, or is it purposeful action without ego?<br>If a person does good their entire life and never receives recognition, is that still considered a good life?<br>Is recognition itself a form of love and appreciation, and is it wrong to desire it?<br>How do we eliminate comparison from daily life when it is so deeply embedded in human experience?<br>Where is "heaven," and why do we struggle to experience it in the present world?</div><div class="disc-h">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Chapter 2 of the Tao Te Ching teaches that all dualities (beauty/ugliness, good/bad, winner/loser) are interdependent and arise together.<br>The concept of Wu Wei does not mean laziness or inaction, but rather acting naturally, without selfish purpose, in response to what a situation requires.<br>Pure motivation is central to the value of any action; doing good for recognition or reward diminishes the merit of the act.<br>Eliminating comparison is key to experiencing a more peaceful and "heavenly" state of existence.<br>Unmet expectations create "seeds" of disappointment (karma) in the mind; removing these seeds leads to greater freedom and happiness.<br>Intrinsic motivation (acting for the sake of good itself ) is more sustainable and fulfilling than extrinsic motivation tied to recognition.<br>The sage accomplishes work without claiming credit; because no credit is claimed, the merit of the work endures permanently.<br>Learning from nature (such as the earth, the sky) illustrates selfless giving without expectation of return.</div><div class="disc-h">Topic 1: Chapter 1 Review — The Nature of Tao</div><div class="disc-p">"The Tao that can be spoken is not the eternal Tao, and the name that can be named is not the eternal name."<br>This establishes that Tao (often translated as "the Way" or "the Truth") is intangible and beyond verbal or conceptual definition. The moment it is defined, it is no longer the true Tao. It is the underlying truth and nature of all things, containing and creating everything, yet remaining beyond the grasp of language or concepts. The ideas of "being" and "non-being" serve as foundational themes that carry through directly into Chapter 2.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: What is Tao, and why can't it be spoken or named?</div><div class="disc-a">Answer: Tao is intangible. It cannot be named or spoken because the moment it is defined, it is no longer the true Tao. It is the underlying truth and nature of all things, containing and creating everything, yet beyond the grasp of language or concept.</div><div class="disc-h">Topic 2: Chapter 2 — Duality, Comparison, and the Origin of Conflict</div><div class="disc-p">Chapter 2 focuses on the principle of duality. Laozi observes that when people recognize beauty as beauty, the concept of ugliness simultaneously arises. This principle of duality extends to all opposites: good and bad, strong and weak, winner and loser.<br>For example, when one person in a group is recognized as the best English speaker, others feel comparatively inadequate, even though their actual ability has not changed. Therefore, the root of suffering lies in comparison.<br>From a spiritual perspective, all souls originally came from a pure, equal state (described as a "beautiful spiritual light"), and it is only through worldly experience that differences, comparisons, and conflicts arise. Dismantling the framework of comparison is presented as the definitive path back toward a more harmonious, "heavenly" state of existence.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: Where is heaven, and why can't we experience it?</div><div class="disc-a">Answer: Sages teach that heaven is here, in the present world. However, humans struggle to experience it as heaven because of comparison. As long as we compare ourselves to others (richer/poorer, smarter/less smart), we cannot perceive the world as a perfect place. Without comparison, everyone would be equal, and the world would be experienced as heaven.</div><div class="disc-h">Topic 3: Wu Wei — Acting Without Purpose or Ego</div><div class="disc-p">The concept of Wu Wei, meaning "non-action" or "acting without doing," does not mean passivity, laziness, or indifference. A person who uses Wu Wei as an excuse to be lazy has completely misunderstood the concept. The sage acts, but acts without selfish purpose, praise, or an agenda beyond what the moment requires. Rather, the sage "does nothing, but nothing is left undone."<br>A classic example of Wu Wei is a subconscious moral instinct: if a child is playing near a dangerous well and is about to fall in, the right response is to act immediately. This reflexive action (done without calculating personal benefit, reputation, or conscious deliberation) is the essence of Wu Wei. It resembles a parent's reflexive action to protect a child without conscious hesitation, though Wu Wei extends beyond instinct to encompass all purposeful, ego-free action.<br>The danger of purpose-driven agendas can be seen in nature, such as the Yellowstone Park ecosystem. When wolves were removed from the park to benefit the deer, the ecosystem collapsed over 50 years because the natural balance was disrupted. Intervening with a rigid agenda caused more harm than allowing nature to operate according to its own balance. Wu Wei, therefore, means acting from one's true self, in the present moment, without an artificial agenda.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: Does Wu Wei mean doing nothing at all?</div><div class="disc-a">Answer: Wu Wei does not mean inaction or indifference. The sage acts, but acts without selfish purpose, without seeking praise, and without an agenda beyond what the moment requires.</div><div class="disc-q">Question: Is Wu Wei similar to moral instinct?</div><div class="disc-a">Answer: It resembles a "subconscious moral instinct," like a parent's reflexive action to protect a child without conscious deliberation. This captures part of the concept, though Wu Wei extends beyond instinct to encompass all purposeful, ego-free action.</div><div class="disc-h">Topic 4: Merit, Recognition, and Pure Motivation</div><div class="disc-p">The final section of Chapter 2 states:<br>"His work is accomplished, but he claims no credit. Precisely because he does not claim credit, his merit never fades away."<br>This passage highlights the tension between acting without expectation of recognition and the natural human desire for acknowledgment. This philosophy shares deep similarities with Christian teachings, where the principle of acting with pure motivation (not for selfish reasons) is strongly emphasized. On the other hand, recognition in its purest form can be viewed as a kind of love and appreciation, making it a natural way of acknowledging another person's effort and good heart.<br>The key lies in the distinction between intrinsic and extrinsic motivation. When the value of an action depends on external recognition (extrinsic), it becomes unstable and outside one's control. When the value comes from within (intrinsic), it remains constant regardless of the external response. Therefore, the decision to do good should not be contingent on whether recognition follows. The earth and sky illustrate this perfectly: they sustain all life without ever asking for rent or gratitude, yet their work is the most enduring of all.<br>This principle shows up clearly through everyday experiences:<br>Family Expectations (Shared by Master): Cooking daily for a household can bring hurt if a sister cooks only for herself without reciprocating. This hurt arises from an expectation of reciprocity. Removing that expectation brings a sense of freedom, much like a parental reflex where parents protect their children without expecting thanks.<br>Delayed Recognition (Shared by Master): Sometimes recognition simply comes late, such as fully appreciating a mother's years of cooking only years later after returning home from military service. Merit and appreciation may be delayed, but they do come.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: If I live my entire life doing good without ever receiving recognition, is that still a good life?</div><div class="disc-a">Answer: Yes, it is. Consider the countless unnamed people who built the planes we fly on, made the clothes we wear, or operate the trains we ride. Their contributions are real and good, even without personal recognition. The point is to not make recognition the condition for doing good.</div><div class="disc-q">Question: Is this chapter saying that recognition is irrelevant?</div><div class="disc-a">Answer: No. The chapter is not saying recognition is unimportant. Rather, it means that the decision to do good should not be contingent on whether recognition will follow. The action should happen regardless, because it is the right thing to do.</div><div class="disc-q">Question: What does it mean that "no one can hurt us" if we act without expectation?</div><div class="disc-a">Answer: Every expectation plants a "karmic seed" in the mind. When that expectation is unmet, the seed grows into disappointment, which can cause a person to give up doing good altogether. By removing the seed of expectation, one removes the vulnerability to being hurt by others' reactions. Since other people's responses are outside our control, tying our wellbeing to them makes us perpetually vulnerable.</div>`

    chinese: `不尚賢，使民不爭；<br>不貴難得之貨，使民不為盜；不見可欲，使民心不亂。<br>是以聖人之治，虛其心，實其腹，弱其志，強其骨。<br>常使民無知無欲。使夫智者不敢為也。為無為，則無不治。`,
    commentary: `如果不刻意推崇名聲才德，百姓就不會為了名利而鬥爭；如果不標榜稀有財寶的價值，百姓就不會生起貪念去偷竊；如果不顯露足以引起慾望的事物，民心就不會混亂。因此，聖人的治理是：淨化百姓的思想，讓他們生活飽暖足食，削弱競爭擴張的野心，並增強自立生存的體魄。透過這種方式，使百姓常保純樸的本性，沒有虛偽的巧詐與過度的貪欲。即使是有小聰明的人，也不敢胡作非為。當治理者順應自然、不亂加干預，天下就沒有治理不好的地方。`,
    discussion: `<div class="disc-p">本次讀書會以《道德經》第三章為核心文本，探討老子思想中「不尚賢」、「不貴難得之貨」、「不見可欲」等核心主張，並將其與現代社會中的競爭文化、教育體制、個人慾望與心靈成長等議題相互對照。讀書會由 點傳師 主持，參與者包括 前賢、前賢甲 及 前賢乙 等人，透過互動討論與生活實例，引導學員深入理解道家聖人治理之道的現代意涵。</div><div class="disc-h">核心概念與理論</div><div class="disc-p">不尚賢：不崇尚、不過度推崇所謂的賢能之人，避免社會因比較與競爭而產生紛爭<br>不貴難得之貨：不以稀有物品為珍貴，避免人心因貪求而動盪<br>使民無知無欲：並非愚民政策，而是引導人們減少妄念與過度追求，回歸本真<br>實其腹、強其骨：充實內在根基，強化真實的能力與素養，而非追求外在名利<br>妄念（delusion）：對未來不切實際的期待、恐懼或憂慮，是阻礙人真實成長的根源<br>無為而治：聖人不以目的性行動強加於人，而是以身作則，讓萬物自然發展</div><div class="disc-h">重要提問</div><div class="disc-p">「不尚賢」中的「賢」究竟指的是什麼樣的人？<br>老子說「使民無知無欲」，是否是一種愚民政策？<br>聖人治理的理想如何從古代政治語境轉化為現代個人修身的實踐？<br>當我們不斷追求成為「賢者」或「成功人士」時，對自身心理造成了什麼影響？<br>無目的地學習與有目的地學習，哪一種更能帶來真實的成長？</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">《道德經》第三章的核心在於破除社會對「賢能」與「稀有財貨」的崇拜，以減少人際競爭與內心紛擾<br>老子所說的「使民無知無欲」並非愚民，而是引導人們放下妄念，回歸純粹的生命狀態<br>聖人之治的對象在古代是君王與臣民，但在現代語境中，每個人都應將自己視為需要自我治理的主體<br>過度的比較與競爭文化（如亞洲家庭的成績比較、職場晉升追求）是現代人妄念的主要來源<br>真正的成長來自於無目的的積累，而非刻意為了某一結果而學習或行動<br>孔子所提的「四非正」（目的性、分裂、憤怒、恐懼）與老子的思想相互呼應，皆指出情緒與妄念是阻礙真實自我的根源</div><div class="disc-h">主題一：《道德經》第三章文本解讀</div><div class="disc-p">本次讀書會以誦讀《道德經》第三章原文為開端，討論不同版本（如王弼本）之間的文字差異。點傳師 指出，《道德經》流傳逾兩千五百年，歷代傳抄難免出現一字之差，但核心義理並無根本差異。學員被提醒，在準備相關考試時，應以指定版本為準。<br>文本中「不尚賢，使民不爭」一句，引發學員對「賢」字的討論。學員們在聊天室中提出「崇尚」、「賢人」、「賢者」、「有學問有知識的人」、「厲害的人」、「有智慧的」、「有地位的人」等詮釋，最終歸納為：「賢」泛指社會所定義的優秀人才、領袖人物。<br>點傳師 進一步說明，老子並非否定才能本身，而是反對社會對才能的過度崇拜與標籤化，因為這種崇拜會在人心中製造比較與競爭，進而引發紛爭與不安。</div><div class="disc-h">相關問答</div><div class="disc-q">問：「賢」這個字究竟指的是什麼樣的人？</div><div class="disc-a">答：學員們提出多種詮釋，包括有學問、有智慧、有地位的人，最終 點傳師 歸納為社會所定義的優秀人才與領袖，並強調老子反對的是對這類人的過度崇拜，而非才能本身。</div><div class="disc-q">問：「不貴難得之貨」在現代生活中有何對應？</div><div class="disc-a">答：點傳師 以休息站停放的跑車為例，說明人們對稀有物品的嚮往如何在內心製造匱乏感與自我分類，進而影響行為與判斷。</div><div class="disc-h">主題二：競爭文化與妄念的現代反思</div><div class="disc-p">點傳師 以自身求學經歷為例，說明亞洲家庭與教育環境中普遍存在的比較文化。他分享自己在彰化頂尖高中就讀時，因無法達到「優秀」的標準而逐漸放棄，最終以全班倒數第三名畢業的經歷，說明當「成為賢者」的執念深植人心時，反而會造成自我否定與停滯。<br>此外，點傳師 引用一項英國教育實驗：英國學校邀請中國數學教師授課一個月，結果中國教師班級的考試成績比英國教師班級高出約15%。然而，雙方對此結果的詮釋截然不同——中國教師認為這證明了亞洲教育的優越性，英國教師則認為這只是應試訓練的結果，學生的生活適應能力與全面發展並未因此提升。<br>點傳師 以日本棒球投手的訓練方式為喻，說明真正的實力來自全身肌肉的協調與整體性訓練，而非針對單一肌群的強化，呼應老子「實其腹、強其骨」的整體性成長觀。</div><div class="disc-h">相關問答</div><div class="disc-q">問：前賢乙 在聊天室提到，來讀書會之前覺得要念經、敲木魚，感覺有點無聊。</div><div class="disc-a">答：點傳師 回應，這正是妄念的一種體現——我們對未知事物預先設定了期待或恐懼，而真實的體驗往往與想像截然不同。他以自己初次接觸佛堂時的偏見為例，說明打破既有框架後所帶來的驚喜與成長。</div><div class="disc-q">問：英國教育實驗中，中國教師的學生成績更好，這是否代表應試教育更優越？</div><div class="disc-a">答：點傳師 指出，成績提升只是應試訓練的結果，並不代表學生的整體能力與生活適應力有所提升，強調全面性發展的重要性。</div><div class="disc-h">主題三：聖人之治的現代轉化——從治國到修身</div><div class="disc-p">點傳師 說明，《道德經》中大量談及君王、臣民與政治治理，是因為老子、孔子所處的時代，政治人物是推動社會變革的核心群體，一般百姓尚無修行的概念與餘裕。然而，在現代社會中，每個人都應將自己視為需要自我治理的主體，將「聖人治民」的智慧內化為個人修身的實踐。<br>他以佛堂中一位年長女性義工為例：這位女士原本是商店老闆娘，不會烹飪，卻因想帶家人出遊、服務大眾的單純心念，主動考取導遊執照、學習素食烹飪，最終成為佛堂中最具影響力的人物之一。她的成長並非來自刻意追求成就，而是源於無私的付出與無目的的積累，正是老子「無為而無不為」的最佳體現。<br>點傳師 亦引用孔子所提的「四非正」——目的性、分裂、憤怒、恐懼——說明這些情緒與執念是阻礙人回歸真實自我的根源，與老子「使民無知無欲」的精神相互呼應。</div><div class="disc-h">相關問答</div><div class="disc-q">問：老子說「使民無知無欲」，現代人是否會將此解讀為愚民政策？</div><div class="disc-a">答：點傳師 指出，這是現代人最常見的誤解。老子的本意並非讓人變得愚昧，而是引導人們放下妄念與過度的慾望追求，回歸純粹的生命狀態，讓聰明才智不被貪念所驅使，進而做出傷害自己或他人的行為。他以近年緬甸詐騙案為例，說明正是因為受害者心中有「高薪、輕鬆工作」的妄念，才落入陷阱。</div><div class="disc-q">問：前賢甲 對某段文本提出詮釋。</div><div class="disc-a">答：點傳師 肯定其回答，表示方向正確，並感謝 前賢甲 的分享。</div>`,
    en_discussion: `<div class="disc-h">Class 5: Returning to the Original Heart — Emptying the Mind and Practicing Wuzhi in Modern Life</div><div class="disc-p">Exploring the restoration of inner essence through non-comparison, intellectual humility, and the dissolution of ego<br>Guang Ming Advanced Academy<br>June 3, 2026</div><div class="disc-h">Overview</div><div class="disc-p">Chapter 3 of the Tao Te Ching, a foundational Taoist text attributed to Laozi, offers profound philosophical teachings on governance, ego, desire, wisdom, and non-action (Wu Wei). Integrating Taoist principles with Buddhist teachings and modern life insights provides a contemplative framework to examine materialism, social comparison, humility, and the transcendent nature of the self.</div><div class="disc-h">Key Concepts or Theories</div><div class="disc-p">Wu Wei (Non-Action): Acting without ego-driven intent; doing what is necessary without excess thought or self-congratulation<br>Wuzhi (No Knowledge / No Hubris): Not the absence of knowledge, but the humility to recognize the limits of one's knowledge<br>Comparison as a source of suffering: Exalting talent or prizing objects creates animosity, greed, and disconnection<br>The Three Poisons (Buddhism): Greed, Anger, and Ignorance as thieves of one's true self<br>Yin and Yang / Weakness overcoming Strength: Softness and persistence (like water cutting rock) ultimately prevail over brute force<br>Flow State: Forgetting the self and time; being fully immersed in the present moment<br>Inner Essence / Soul / Conscience: The deeper, non-intellectual core of a person that transcends ego and identity labels</div><div class="disc-h">Important Questions Raised</div><div class="disc-p">Why does Laozi advise against exalting talent or prizing rare objects?<br>What does it mean to "empty the mind" and "fill the belly with inner essence"?<br>How does weakness overcome strength in practical, everyday situations?</div><div class="disc-h">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Laozi's Chapter 3 of the Tao Te Ching warns against exalting talent, prizing material objects, and displaying desirable things, as these create comparison, greed, and social unrest.<br>The sage governs by emptying people's minds of ego and filling their lives with inner essence — prioritizing foundational human goodness over intellectual or material competition.<br>Weakness overcomes strength through persistence and softness, as illustrated by water cutting rock and wind eroding stone.<br>Wu Wei (non-action) does not mean doing nothing; it means acting without ego, arrogance, or excess consciousness — being fully present without self-congratulation.<br>Wuzhi (Intellectual Humility) is not about being ignorant, but about maintaining humility regarding the limits of one's knowledge, avoiding hubris.<br>The Three Buddhist Poisons — greed, anger, and ignorance — are identified as the root causes that steal one's true, original self.<br>All major religions and philosophies share a common goal: to help people recover their kind, original heart and cultivate the self.</div><div class="disc-h">Topic 1: Chapter 3 of the Tao Te Ching — Not Exalting Talent and Not Prizing Objects</div><div class="disc-p">Chapter 3 of the Tao Te Ching opens with three guiding principles: not exalting the talented, not prizing rare objects, and not displaying desirable things. The passage explores its relevance to modern life, connecting the first sentence to the dangers of putting people on pedestals, and the second to materialism and the craving for luxury goods and brands. The third sentence — about not displaying the desirable — addresses how societal display of desirable things creates restlessness and dissatisfaction in people's hearts.<br>Modern education systems, by rewarding high scores and specialization, inadvertently create a "manufacturing factory" of talent that drives comparison and exhaustion. Laozi's warning is interpreted not as a rejection of education, but as a caution against making achievement and comparison the central values of life.<br>Comparison is the thief of joy: when one person's ability, salary, or possessions are exalted above another's, it creates animosity and obstructs genuine human connection. The principle applies not only to how we view others, but also to how we speak to ourselves — avoiding self-comparison and self-diminishment.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: What does "not prizing objects hard to come by" mean in practice?</div><div class="disc-a">Answer: If people place excessive value on rare or expensive objects, it encourages theft and greed. In modern terms, the craving for luxury brands and status symbols reflects this dynamic — it cultivates bad habits like greed and fear, which are essentially "thief-like" behaviors.</div><div class="disc-q">Question: Why does Laozi say not to exalt the talented, when modern society rewards specialization and expertise?</div><div class="disc-a">Answer: Modern society treats education as an economic industry — a factory producing employees. Laozi's point is that this system drives exhausting comparison. The deeper issue is that when we prize talent above all else, we lose sight of what truly matters: human connection, kindness, and inner worth.</div><div class="disc-h">Topic 2: The Sage Governs — Emptying Minds and Filling Bellies</div><div class="disc-p">The fourth sentence of Chapter 3 introduces the sage as a model of governance: "The sage governs by emptying their minds of ego and filling their bellies with inner essence, weakening their worldly ambitions and strengthening their physical foundation." In Laozi's era, the sage referred to a king or high official, not merely a spiritual teacher.<br>"Emptying the mind" was interpreted as removing false identification — the ego-driven labels of manager, expert, or superior — so that governance is not clouded by arrogance. "Filling the belly with inner essence" was connected to Maslow's Hierarchy of Needs: at the most basic level, ensuring people's physical needs are met.<br>Taoism posits that there is more to a person than their mind and its contents. The discussion explored the idea that the soul, spirit, or inner essence cannot be fully described in words; the more one tries to define it, the further one moves from it. This was illustrated through the metaphor of a baseball player hitting a home run — at the peak moment, there is no thought, only pure reaction and flow.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: What does "emptying their minds of ego" mean — is the sage advising people, or describing how the sage should be?</div><div class="disc-a">Answer: Both. The sage governs by modeling this behavior, and it serves as a guide for all people. The sage empties people's minds of ego by being a good model — if the leader is humble and kind, the people follow.</div><div class="disc-q">Question: What is "inner essence" — is it food, achievement, or fulfillment?</div><div class="disc-a">Answer: It operates on two levels. Visibly, it means ensuring people's basic needs (food, shelter) are met. Invisibly, it refers to fulfillment — a sense of deep satisfaction that goes beyond achievement. It connects to Maslow's hierarchy, from basic physiological needs at the bottom to self-actualization at the top.</div><div class="disc-q">Question: How does the sage "strengthen their physical foundation" or "strengthen their bones"?</div><div class="disc-a">Answer: This is metaphorical. The sage strengthens people's inner essence by being a good model. As Confucius taught, a leader must first embody what they teach — humility, politeness, and virtue — so that people naturally follow. A good leader's example is the "class" that strengthens the people's inner foundation.</div><div class="disc-h">Topic 3: Weakness Overcomes Strength — Wu Wei in Practice</div><div class="disc-p">One of Laozi's most paradoxical teachings is that weakness overcomes strength. Water, the softest substance, can cut through rock over time. Wind, though invisible, can erode the hardest stone. These natural metaphors illustrate that persistent, gentle action is ultimately more powerful than aggressive force.<br>A practical example involves encountering a dangerous driver on the road: the instinct is to fight back. But choosing to let it go — though it feels like losing in the moment — is actually winning, because fighting leads to courts, prolonged conflict, and ongoing enmity. The "weak" choice preserves one's time, peace, and life.<br>In an educational context, rather than shouting at noisy students, speaking to them calmly after class and asking whether they meant to cause harm can prompt surprise and remorse, leading them to self-correct. This illustrates the Taoist concept of Wudi (without enemy) — avoiding antagonism and hostility, and instead speaking to the student's inner goodness. The softness of the approach creates lasting change more effectively than force.<br>Furthermore, a new principal with strong ambitions who tries to change everything immediately will face resistance, whereas a leader who first understands the community and acts gradually — like wind on rock — will succeed over time.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: Does "weakness overcomes strength" mean one should seek slow revenge, like wind cutting rock over ten years?</div><div class="disc-a">Answer: While that interpretation is possible, it misses the deeper point. If one holds onto negative emotions toward another person and releases them slowly, one is still building an enemy — and the cycle never ends. The true teaching is to release the emotion entirely, not to redirect it.</div><div class="disc-q">Question: How does this principle apply in teaching?</div><div class="disc-a">Answer: By choosing softness over force in discipline, a teacher avoids creating hostility. Speaking to students with curiosity and empathy — asking why they behaved a certain way rather than condemning them — opens a path for genuine change. One cannot transform a child's life in one lesson, but one can show them a better path.</div><div class="disc-h">Topic 4: Wu Wei, Wuzhi, and the Three Poisons</div><div class="disc-p">The final section of Chapter 3 introduces Wu Wei (non-action) and Wuzhi (Intellectual Humility). The class explored these concepts in depth, connecting them to Buddhist teachings on the Three Poisons: greed, anger, and ignorance.<br>Wu Wei was clarified as not meaning passivity or laziness, but acting without ego-driven intent. The sage "acts without acting, yet nothing is left undone" — staying in one's lane, doing exactly what the situation requires, without excess consciousness or self-congratulation. When helping someone, Wu Wei means helping without thinking "I am a good person" — just acting from the present moment.<br>Wuzhi translates to "no hubris" — not the absence of knowledge, but the humility to recognize that one's knowledge is limited. Knowledge can become a barrier: for instance, a rigid view that cannot believe in the soul because it is not measurable demonstrates how one can be limited by one's own knowledge. True wisdom lies in knowing the limits of what one knows.<br>The Three Buddhist Poisons were introduced as the thieves of one's original self:<br>Greed: Desire for fame, wealth, or success — risky because it can lead people to lose themselves in pursuit of external validation<br>Anger: Arising from ego — "this is mine, you violated it, I must retaliate" — fueled by a sense of unfairness and competition<br>Ignorance: Living in illusion or expectation; imposing one's own rules on others without awareness; choosing not to see reality<br>Regarding the opposite of ignorance, curiosity serves as the path to clarity — being open and asking "what is really going on here?" rather than judging from a fixed position. The quote "be curious, not judgmental" provides a practical summary.<br>The insights conclude with a reflection on conscience as the inner moral compass — described as an "intuitively moral autopilot" — connected to the idea that all religions share the same goal: to help people recover their original, kind heart.</div><div class="disc-h">Relevant Q&A</div><div class="disc-q">Question: If Laozi says to practice "no knowledge," but ignorance is bad, aren't these contradictory?</div><div class="disc-a">Answer: They are different. Ignorance means refusing to see reality — living in illusion, imposing one's own rules, being closed. "No knowledge" (Wuzhi) means being aware of the limits of what you know — practicing humility. The connecting thread is hubris: ignorance and false knowledge both stem from arrogance, the belief that one already has all the answers.</div><div class="disc-q">Question: What did Laozi mean by Wuzhi in the original text?</div><div class="disc-a">Answer: Laozi meant that knowledge can become a barrier. When we know something, we fill ourselves with that knowledge and close off other possibilities. For example, rigid scientific frameworks may reject the soul because it cannot be seen or measured. Wuzhi means recognizing that knowledge can block us from accessing ultimate truth.</div><div class="disc-q">Question: Is moral conscience innate, or is it shaped by experience?</div><div class="disc-a">Answer: Both perspectives are key. Humans may be born with a moral compass (a kind of divine coding), while parents, friends, and life experiences also shape one's values. At any given point in life, a person has some moral compass — whether from birth, upbringing, or accumulated experience — and all of it is valid.</div>`

    classical: `不盈章`,
    english: `The Tao is an empty vessel,Yet in its Use, it is inexhaustible and never needs to be refilled. <br>It is an abyss, seemingly the Progenitor of the myriad things.<br>It blunts the sharpness;<br>It unravels the knots; <br>It tempers the brightness; <br>It merges itself with the dust.<br>Deep and translucent, it quietly endures. <br>I do not know whose child it is; <br>It seems to precede even the  Heavenly Ruler.<br>`,
    chinese: `道沖而用之，或不盈，淵兮似萬物之宗。<br>挫其銳，解其紛，和其光，同其塵。<br>湛兮似或存。吾不知誰之子，象帝之先。`,
    commentary: `「道」雖然空虛，但它的作用卻無窮無盡，好像永遠不會枯竭；它博大深厚得如同萬物的祖宗。它能挫去鋒芒，消除紛擾，調和光輝，與塵俗融合為一。它清澈且隱約存在。我不知道它是從哪裡產生的，似乎在天帝出現之前就已經存在了。`,
    discussion: `<div class="disc-h">知道・道學讀書會</div><div class="disc-h">概覽</div><div class="disc-p">本次讀書會以《道德經》第四章為核心，探討「道」的本質與其在日常生活、靈性修行中的實踐意義。講者 點傳師 引導與會者超越文字表面的理解，深入體會「道」如何滲透萬物、取之不盡、用之不竭，並以慈悲心作為連結個人修行與利他行動的核心力量。</div><div class="disc-h">核心概念與理論</div><div class="disc-p">不盈（不滿溢）：道從不填滿，因此永不枯竭，象徵一種謙遜而持續的狀態。<br>道的無形性：道如空氣、如深水，無法被捕捉，卻無所不在，隨時可用。<br>慈悲心（大悲）：真正的慈悲是無我的，以利他為出發點，是一切修行與成就的根本動力。<br>業種（業力種子）：佛教概念，指潛意識中積累的習氣與執念，修行的目的之一即是逐步清除這些障礙。<br>遷移效應（Transfer）：認知心理學概念，過去的經驗會自動投射到當下，可能成為助力或阻力。<br>和光同塵：聖人不以光芒刺眼，而是融入塵世，與萬物和諧共處，不帶偏見地對待一切。</div><div class="disc-h">重要提問</div><div class="disc-p">「道」既無形無象，為何古典文本要反覆強調它？其對修行者的實際意義為何？<br>如何在閱讀古典時，超越字面意義，真正與自身靈性修行產生連結？<br>慈悲心如何在日常生活的具體情境中（如語言學習、職場、人際關係）自然展現？<br>緊張與焦慮是否必然是負面狀態？如何以正確心態面對它？</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">《道德經》第四章的核心在於「道沖而用之，或不盈」，說明道的作用深遠而不自滿。<br>道如氧氣般滲透萬物，人們往往感受不到它的存在，卻時刻受其滋養。<br>真正的修行不在於追求外在成就，而在於向內探索，清除執念與偏見。<br>慈悲心是修行的根本，也是一切善行與成就的源頭。<br>閱讀古典的最重要目的，是將其與自身靈性實踐相連結，而非僅停留於文字理解。<br>緊張與焦慮在適當情境下是最佳狀態，無需刻意壓制，應順其自然。<br>保持善終（善始善終）意味著將慈悲心維持至生命最後一刻，不因角色轉換而改變初心。</div><div class="disc-h">主題一：《道德經》第四章——道的本質與「不盈」</div><div class="disc-p">《道德經》第四章描述道的運作方式：它如同深淵，取之不盡，用之不竭，卻從不自滿。講者 點傳師 以空氣與氧氣為比喻，說明道雖無形無象，卻充盈於整個宇宙空間。人們不會意識到氧氣的存在，卻時刻依賴它維持生命；道亦如此，滲透萬物，卻不顯露自身。<br>「不盈」的概念尤為重要：正因為道從不填滿，它才永遠不會耗盡。這與人類常見的「追求圓滿、填滿」的心態形成對比。講者強調，修行者應學習這種謙遜而持續的狀態，不急於求成，而是讓能量自然流動。<br>此外，講者提到讀書會已進行逾一年，探索至第四章，發現每次閱讀都有新的體悟，印證了道的深度是無窮無盡的。</div><div class="disc-h">相關問答</div><div class="disc-q">問：道既然無形無象，為何要反覆強調它的存在？</div><div class="disc-a">答：正因為道無法被直接描述或抓取，才需要反覆提及。目的不是讓人理解其形態，而是讓人在生活中感受其存在，進而與之連結。</div><div class="disc-h">主題二：閱讀古典的真正目的——超越文字，連結自身</div><div class="disc-p">講者 點傳師 以一個書評社群為例，指出許多人閱讀古典時，只關注他人的評論與白話翻譯，而忽略了原文本身的深度。他以量子力學的「可能性坍縮」概念類比：古典文字蘊含無數可能的詮釋，一旦被翻譯成白話，便只剩下其中一種可能，其餘的豐富性便消失了。<br>因此，閱讀古典最重要的目的，是將文字與自身的靈性修行相連結，而非僅僅理解字面意思。講者鼓勵與會者在閱讀時問自己：「這段話與我的生命有何關聯？我如何在日常中實踐它？」<br>他也以認知心理學的「遷移效應」說明，過去的經驗會自動投射到當下，形成框架與限制。修行的過程，正是逐步清除這些框架，回到如孩童般開放、無限制的學習狀態。</div><div class="disc-h">相關問答</div><div class="disc-q">問：為什麼很多人讀了古典之後，覺得「這跟我有什麼關係」？</div><div class="disc-a">答：因為他們只停留在文字層面，沒有嘗試將其與自身生命經驗連結。古典的價值在於引導人向內探索，而非提供外在知識。</div><div class="disc-h">主題三：慈悲心——修行的根本動力與利他的力量</div><div class="disc-p">講者以不丹仁波切的故事為例，師父要他下山去尋找「大悲成就」的修行者。他疑惑地問師父，他要怎麼判斷一個人是不是「大悲成就」，師父說不用，你碰到了自然就知道了。當仁波切來到佛堂之後，感覺到這裡每個人純然的善良，他就知道，這裡就是師父說的地方！並且不顧僧眾的反對，主動提出想要到佛堂「求道」！為什麼是「大悲成就」呢？其實真正的大悲，是沒有私我的，過去紅陽期的修行都是先求自我證悟，再來渡化眾生。但在白陽道場，這裡的修道人沒有在管自己能不能成佛，想著是如何服務眾生，讓眾生喜歡來佛堂，願意接近道場，進而發心明理，走上成佛的階梯。歷代每尊菩薩的愿力及成就都是這樣「同體大悲」過程，總是心心念念著救渡眾生，無私無我。<br>講者進一步以「和光同塵」詮釋聖人的境界：如同手電筒的光，走入任何環境都不會被染色，也不會改變自身的本質，卻能照亮周遭。這種狀態使人能與不同背景、不同處境的人和諧相處，不帶偏見。<br>他也以自身學習英語的經歷為例，說明慈悲心如何成為語言學習的動力：因為想幫助他人，便自然產生學習的意願，並在過程中不斷突破自我限制。</div><div class="disc-h">相關問答</div><div class="disc-q">問：慈悲心如何在日常生活中具體展現？</div><div class="disc-a">答：慈悲心不需要宏大的行動，從一個善意的念頭開始，例如帶朋友出去玩、學習一門語言以便幫助他人，這些都是慈悲心的具體展現。善意的動機會自然帶動行動，行動又會累積功德與善緣。</div><div class="disc-h">主題四：面對緊張與情緒——順其自然的智慧</div><div class="disc-p">講者分享了一個實際案例：兩位成員在接待近十位外國訪客時極度緊張，不知如何應對。講者 點傳師 告訴他們：「讓自己緊張吧。」他解釋，緊張本身是一種最佳狀態，代表當事人真心在乎這件事。刻意壓制緊張反而會造成更大的內耗。<br>當訪客真正到來後，所有的注意力自然轉移到眼前的人身上，緊張感便自然消散。這正是「道」的運作方式：不強求、不壓制，順其自然，情緒自會解開。<br>講者也以此延伸至「善終」的概念：真正的修行者在生命最後一刻，仍然心繫他人，而非執著於自身的成就。這種始終如一的慈悲心，才是真正的善終。</div><div class="disc-h">相關問答</div><div class="disc-q">問：緊張的時候應該怎麼辦？</div><div class="disc-a">答：不需要刻意消除緊張，因為緊張代表你在乎。讓自己處於緊張狀態，同時盡力去做能做的事，當真正投入當下時，緊張自然會消散。</div>`,

  {
    num: 5,
    title: `Heaven, Earth, and the Sage`,
    classical: `守中章`,
    english: `Heaven and Earth are not "benevolent"; <br>They treat the myriad things as though they were straw dogs . <br>The Sage is not "benevolent"; <br>He treats the multitude as though they were straw dogs.<br>Is not the space between Heaven and Earth like a bellows? <br>It is empty, yet its supply never fails; <br>The more it is moved, the more it brings forth.<br>Much speech leads to exhaustion; <br>It is better to keep to the Center.`,
    chinese: `天地不仁，以萬物為芻狗；<br>聖人不仁，以百姓為芻狗。<br>天地之間，其猶橐龠乎？虛而不屈，動而愈出。<br>多言數窮，不如守中。`,
    commentary: `天地真的不仁慈嗎？對待萬物如同祭祀時用的草狗一樣，用過就丟掉了；聖人真的不仁慈嗎？對待萬物如同祭祀時用的草狗一樣，用過就丟掉了。（其實天地與聖人的愛是公平沒有偏狹的，所以完全隨著因果造化運行）天地之間，不就像是一個大風箱（橐龠）嗎？它內部空虛卻不會塌陷，只要一觸動，生機與能量就會源源不絕地產生。如果自以為是，妄作主張，反而會讓自己陷入困頓窮竭，不如保持內心的虛靜與平和，默守中庸之道。`,
    discussion: `<div class="disc-h">知道・道學讀書會</div><div class="disc-h">概覽</div><div class="disc-p">本次讀書會為「知道・道學讀書會」，於2026年6月3日舉行，時長約1小時8分鐘。本次課程主要研讀《道德經》第五章與第六章，探討天地之道的本質、自然法則的運行，以及人類在宇宙秩序中的定位。課程以深入淺出的方式，結合日常生活實例，引導學員理解「無為而治」、「道」的無形滋養，以及「無我」境界的實踐意涵。</div><div class="disc-h">核心概念與理論</div><div class="disc-p">天地不仁：天地對萬物一視同仁，不偏袒任何個體，萬物皆依自然法則運行，並非殘忍，而是順應自然。<br>無為自然：道的運作無形無跡，卻滋養萬物，不強求、不干預，一切自然生成。<br>因果循環：萬事萬物的發生皆有其因果，無所謂對錯善惡，皆是自然法則的體現。<br>谷神不死（玄牝之門）：第六章所述，真如本性永恆不滅，是天地萬物的根源，取之不盡、用之不竭。<br>無我境界：真正的無我，是在全心投入當下、為他人服務時，忘卻自我分別的狀態。<br>多言數窮：言語批評過多，反而消耗能量、製造對立；不如身體力行，付諸實踐。</div><div class="disc-h">重要提問</div><div class="disc-p">天地真的無情嗎？聖人真的冷酷嗎？<br>為何善良的人也會遭遇苦難，而惡人卻似乎逍遙法外？<br>「上善若水」的道，如何在日常生活中體現？<br>何時才能達到「神在我身，我在神身」的無我境界？</div><div class="disc-h">重點摘要與學習目標</div><div class="disc-p">《道德經》第五章「天地不仁，以萬物為芻狗」並非指天地殘忍，而是說明天地依自然法則運行，不偏私、不干預。<br>聖人效法天地，對待眾生亦如此，讓萬物自然發展，而非強加干預。<br>黃石公園移除狼群的案例說明：人類自以為聰明的干預，往往破壞自然生態的平衡。<br>遭遇苦難（如癌症、意外）並非懲罰，而是天道給予的機會，讓人消業、成長、回歸本性。<br>第六章「谷神不死」說明真如本性永恆存在，是萬物的根源，綿綿若存，用之不竭。<br>「無我」的實踐，是在全心投入服務他人時，自然忘卻自我分別的狀態。<br>多言批評無益，應減少批評，轉而成為實際行動、創造改變的人。<br>個人的轉化需要長期積累，非一蹴而就，道的力量在潛移默化中發揮作用。</div><div class="disc-h">主題一：《道德經》第五章——天地不仁</div><div class="disc-p">《道德經》第五章開篇「天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗」，乍看之下似乎在批評天地與聖人的冷漠無情。點傳師以古代祭祀中「芻狗」（草編之狗）的用途為例說明：芻狗在祭祀前被珍視，祭祀後即被丟棄，這並非殘忍，而是其使命完成後的自然結果。<br>天地對萬物的態度亦如此——萬物皆依自然法則生滅，天地並不因個人的善惡而特別庇佑或懲罰。點傳師以黃石公園移除狼群為例：科學家認為狼群破壞環境而將其遷走，五十年後卻發現河流乾涸、生態崩潰，才明白狼群在生態系統中不可或缺的角色。此例說明人類自以為是的干預，往往違背自然法則，造成更大的破壞。<br>此外，點傳師亦提到，遭遇疾病或苦難並非上天的懲罰，而是消業、成長的機會。他引述一位老師對癌症患者說「恭喜」的故事，說明每一次苦難都是天道給予的禮物，讓人有機會化解業障、提升靈性。</div><div class="disc-h">相關問答</div><div class="disc-q">問：天地真的無情嗎？為何善良的人也會遭遇苦難？</div><div class="disc-a">答（點傳師）：天地並非無情，而是依自然法則運行，不偏私。苦難並非懲罰，而是消業與成長的機會，是天道以我們無法感知的方式在默默照顧我們。</div><div class="disc-q">問（點傳師）：為何我們會一直遇到不順心的事？或是遭遇橫禍、意外、逆境、生病等等。</div><div class="disc-a">答（前賢）：這是因果點傳師：很好，彼此之間有業緣，相遇是必然的，並非偶然，也無所謂對錯。這些逆緣的背後，其實都是上天慈悲的成全。</div><div class="disc-h">主題二：因果與自然法則——船夫與螃蟹的故事</div><div class="disc-p">點傳師講述了一個老和尚與小和尚的故事：船夫推船出海時，不小心壓死了一隻螃蟹。小和尚問師父，這是誰的錯？師父的答案是：沒有人的錯。船夫推船是為了謀生，是其本能；螃蟹躲在沙灘洞穴中，也是其本能。兩者相遇，是因果使然，並非任何一方的過失。<br>這個故事的核心在於：世間萬事萬物的發生，皆是自然因果的運作，並無絕對的對錯善惡。人類習慣以自身的角度評判是非，卻往往因此陷入對立與紛爭，反而偏離了自然的中道。</div><div class="disc-h">相關問答</div><div class="disc-q">問（前賢丙）：是船夫的錯，因為他不夠小心。</div><div class="disc-a">答（點傳師）：船夫並不知情，不知者無罪。師父的答案是：這是因果，兩者皆無過錯，是自然法則的運作。錯的是小和尚，一切都是自然的運作，卻硬是要分個是非對錯，無中生有。</div>`,
    en_discussion: `<div class="disc-sh">Class 7: Centering with Universal Impartiality — Embracing Life’s Impermanence in Modern Life</div><div class="disc-p">Exploring the deconstruction of personal suffering through cosmic neutrality, cultivating active acceptance over emotional complaint, and overcoming the fear of death through the lens of great sages.</div><div class="disc-sh">Guang Ming Advanced Academy</div><div class="disc-sh">June 17, 2026</div><div class="disc-sh">Overview</div><div class="disc-p">This session was part of the youth English etiquette and philosophy class. The discussion focused on Chapter 5 of the Tao Te Ching by Laozi, exploring the idea that heaven and earth are "not benevolent" and treat all things like straw dogs. Participants had a rich, cross-cultural dialogue touching on Taoism, Buddhism, Christianity, and personal life experience. The conversation examined why bad things happen to good people, the nature of God, the meaning of life and death, and how a sage's perspective transcends ordinary human suffering.</div><div class="disc-sh">Key Concepts or Theories</div><div class="disc-p">Straw Dogs (芻狗): Objects used in ancient ceremonies and discarded afterward. This is a metaphor for how heaven and earth treat all things without favoritism or sentimentality.<br>Non-benevolence of Heaven and Earth: Laozi's idea that the cosmos operates without personal emotion or preference, treating everything equally and naturally.<br>Clinging vs. Letting Go: The danger of holding too tightly to ideas, people, or outcomes, as all things are subject to change and impermanence.<br>Sage's Perspective: A transcendent viewpoint that goes beyond birth and death, self-interest, and personal suffering.<br>Transcending Birth and Death (超生死 / 了生死): The idea that great spiritual figures like Jesus, Gandhi, and the Buddha were not bound by the fear of death because they identified with something larger than themselves.<br>The Bellows Metaphor: The idea that heaven and earth are like a bellows: seemingly empty, yet inexhaustible in what they produce when put to use.<br>Exhaustion Through Excessive Speech: Laozi's warning that too much criticism and complaining leads to spiritual and mental exhaustion.<br>Centering (守中): Returning to one's inner center (the Dao) as a source of stillness, strength, and clarity.</div><div class="disc-sh">Important Questions Raised</div><div class="disc-p">If God is benevolent, why do so many disasters, wars, and tragedies still occur?<br>Why do great, kind-hearted figures like Jesus, Gandhi, and John Lennon often meet violent ends?<br>What distinguishes a sage from an ordinary person in how they face suffering and death?<br>How can we shift our perspective when bad things happen to us personally, not just to others?<br>Is it possible to accept suffering without losing compassion or emotional depth?</div><div class="disc-sh">Key Takeaways and Summary of Learning Objectives</div><div class="disc-p">Heaven and earth treat all things like straw dogs : not out of cruelty, but out of impartiality and naturalness.<br>Clinging to things, ideas, or people causes suffering because all things are impermanent and subject to change.<br>Bad things happening to good people is not evidence of God's absence or cruelty, but may reflect the natural order, personal missions, or tests for growth.<br>A sage transcends birth and death by caring for all beings rather than clinging to the self.<br>Great figures like Jesus, Gandhi, and John Lennon exemplify lives defined not by length but by depth of purpose and love.<br>Excessive complaining, blaming, and questioning leads to exhaustion; accepting life's lessons with openness leads to growth.<br>The bellows metaphor illustrates that emptiness is not nothingness : it is the source of inexhaustible potential.</div><div class="disc-sh">Topic 1: The Straw Dogs — Heaven, Earth, and Non-Benevolence</div><div class="disc-p">Chapter 5 of the Tao Te Ching opens with the provocative statement that heaven and earth are not benevolent, treating the myriad things as straw dogs. The focus centered on the historical meaning of straw dogs : ceremonial objects crafted for ritual use and discarded immediately afterward : as a metaphor for how the cosmos treats all things: useful in their moment, then released without attachment.<br>The text challenges the common human expectation that God or heaven should be kind, protective, and personally invested in our wellbeing. One instructor guided the analysis to consider that Laozi is not saying the universe is cruel, but rather that it operates without favoritism. Everything has its season, its purpose, and its natural end.<br>A participant offered the insight that the straw dogs metaphor is really about change and awareness, implying that the sage, like heaven and earth, remains aware of how things shift and responds accordingly: using what is useful, releasing what is not. This is not coldness, but wisdom.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-q">Master: Does this mean God is not benevolent? If God is there, why do so many bad things still happen?</div><div class="disc-a">Participant: A lot of suffering comes from human selfishness and desire, rooted in the belief that we deserve more, or that we are better than others. Some suffering, like disease or natural death, is simply part of nature. If God designed nature this way, then God is not always benevolent in the way we typically imagine, though, as the saying goes, "God works in mysterious ways."</div><div class="disc-q">Master: If something terrible happens to a child, how can we see any good in that?</div><div class="disc-a">Participant: From a human perspective, we cannot always see the good, and it is natural to feel deep sadness. But from a broader perspective, every being comes into this world with a mission. When that mission is complete, they return. The value of a life is not measured by its length, but by what was accomplished and experienced within it.</div><div class="disc-sh">Topic 2: Sages, Great Figures, and the Transcendence of Death</div><div class="disc-p">The analysis expanded into a cross-cultural exploration of figures who embodied the sage's perspective, including Jesus Christ, Mahatma Gandhi, John Lennon, Gautama Buddha, and Laozi himself. The dialogue examined why these figures, who lived by love and kindness, often met violent or tragic ends.<br>Master Josh explained that a sage transcends birth and death not by avoiding suffering, but by caring so completely for others that the self dissolves. Jesus accepted betrayal by Judas and crucifixion not because he was powerless, but because his concern extended beyond his own life. In Confucian terms, this is described as 配天 (Pèi Tiān), which means becoming a representative of heaven by caring for all things, not just oneself.<br>Dom raised the observation that figures like Jesus, Gandhi, and John Lennon, all of whom advocated for peace and love, were killed. The instructor responded that we should follow their intention, not fixate on the tragedy of their deaths. Even after physical death, these figures continue to influence the world, which is the true meaning of longevity, defined not as years lived, but as an impact that does not disappear.<br>A Buddhist story was shared: a temple member who died at 40 had, before birth, chosen a shorter life in order to fulfill a specific mission. The Buddha reminded the community that the value of life lies not in its duration but in what is done within it.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-q">Master: What makes sages like Jesus or Laozi different from ordinary people? How do they come to know these things?</div><div class="disc-a">Participant: The key is forgetting the self. Jesus accepted betrayal and death because at that moment, he cared only for others rather than for himself. When a person transcends self-concern, birth and death become simply a process, like finishing a job and going home. The sage's perspective is not bound by the individual lifespan.</div><div class="disc-q">Master: Is it relevant that Jesus died at 33 in such a terrible way, given what we are discussing about the value of life not being about length?</div><div class="disc-a">Participant: Yes, very relevant. Jesus transitioned beyond birth and death. For him, dying was simply finishing his mission. And yet he did not disappear, as he still lives in the minds and hearts of billions. That is true longevity. He moved to a different dimension, but he is still present.</div><div class="disc-sh">Topic 3: Suffering as a Test and the Danger of Excessive Complaint</div><div class="disc-p">The analysis turned to the closing lines of Chapter 5, which warn that "much speech leads to exhaustion" and that it is better to hold to the center. Master Josh connected this to the modern tendency to over-analyze, criticize, and complain, which are habits that drain energy and close off opportunities for growth.<br>The metaphor of a child who should not be picky about food was offered: just as a child should trust that parents provide the best nourishment, we should trust that life's experiences, even painful ones, are given to us for our growth. Complaining and blaming others causes us to miss the lessons and opportunities embedded in difficulty.</div><div class="disc-q">Master Josh also shared the metaphor of a sports team that loses repeatedly: they may not know how to win yet, but they accumulate rich experience in losing. Eventually, they learn to lose better, and then to win. Suffering, in this view, is not punishment but a form of curriculum, viewing God as a teacher who gives us tests we can handle, calibrated to our current level.</div><div class="disc-p">Dom shared a personal reflection: since engaging with Taoist study and the community, life has felt less intense and overwhelming. Things that once felt urgent and stressful now feel softer and more spacious. This was connected to the concept of 守中 (Shǒu Zhōng), representing holding to the center, and the bellows metaphor of an empty center that is not nothing, but the source of everything.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-q">Master: What is the difference between a person before and after enlightenment?</div><div class="disc-a">Participant: A traditional Buddhist story illustrates this where an enlightened monk was asked what changed after his enlightenment. He said that before, he ate and slept out of obligation. After enlightenment, he did the same things but with joy. He had become immersed in nature, seeing beauty in everything, accepting all of life's events as natural and good.</div><div class="disc-q">Master: How should we respond when disaster strikes, and is it enough to just accept it philosophically?</div><div class="disc-a">Participant: Acceptance does not mean passivity. One person may cry and scold God or the government. Another person also cries but then acts immediately to help. The difference is not in the feeling, but in what follows. Acceptance enables action; clinging and blaming create paralysis.</div><div class="disc-sh">Topic 4: The Bellows, Emptiness, and the Impartiality of Heaven</div><div class="disc-q">Master Mavis offered a closing reflection connecting the bellows metaphor to the broader theme of the Dao: the Dao is empty, yet inexhaustible. Similarly, the human heart and mind should be empty, meaning not in the sense of being blank or indifferent, but free from comparison, judgment, and attachment to good versus bad. When the mind is empty in this way, it can be filled with the greatest benevolence.</div><div class="disc-p">Master Mavis also highlighted a passage from a Taiwanese novel set during World War II, in which an American soldier prays desperately to be saved. The Bodhisattva Guanyin hears the prayer but does nothing. The novelist's point is that if the Bodhisattva saves the American, the Japanese are harmed; if she saves the Japanese, the Americans are harmed. Heaven and earth, like the Bodhisattva, cannot take sides. They treat all beings the same. This is not cruelty, as it represents the deepest form of impartiality and love.<br>Dom connected this to a line from Chapter 8 of the Tao Te Ching: "In the mind, be close to the depths," which implies that the excellence of the mind is to set one's thinking on what is deep, not to fill it with noise and distraction.</div><div class="disc-sh">Relevant Q&A</div><div class="disc-q">Master: Why does God sometimes seem not to help us, even when we pray?</div><div class="disc-a">Participant: We can only see one side of a situation. God, or heaven, sees both sides and all sides. To intervene on behalf of one person may harm another. The impartiality of heaven is not indifference; it is the only truly fair response to a world of interconnected beings.</div><div class="disc-q">Master: What does it mean for the mind to be "empty" in the Taoist sense?</div><div class="disc-a">Participant: Empty does not mean nothing. It means free from clutter, specifically from comparison, from the noise of constant judgment and desire. An empty mind, like the bellows, is capable of producing something from apparent nothingness. It is deep, not shallow; still, not dead.</div>`
